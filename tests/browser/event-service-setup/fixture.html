<!doctype html><html lang="en"><head><title>Event Service Setup verification</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--tx:#e8f2fc;--mut:#acc0d4;--bg2:#112d43;--bg3:#183c55;--line:#365971;--line2:#557790;--acc:#0879db}body{margin:20px;background:#081c30;color:var(--tx);font:16px system-ui}</style></head><body><main></main><script src="/assets/suite/service-menu.js"></script><script>
const id=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),ws=id(1),event=id(2),venue=id(3),table=id(4),item=id(5),actor=id(6);window.qa={actor,event,venue,table,ws,item,revision:0,data:null,mode:'ok',receipts:{},row:{id:item,workspace_id:ws,name:'House bottle',description:'',price_cents:6500,currency:'CAD',station:'bar',is_available:true,sort_order:0,revision:1}};
const C={auth:{ensureFresh:async()=>{if(qa.refreshHold)await new Promise(r=>qa.releaseRefresh=r);return qa.refreshOk!==false;},load:()=>({user_id:qa.actor}),token:()=>'fixture'},api:{rpc:async(n,p)=>{qa.calls=(qa.calls||0)+1;if(qa.mode==='denied')throw Object.assign(Error('Request failed'),{status:403});if(n==='service_menu_list')return{ok:true,workspace_id:ws,role:'owner',items:[qa.row]};if(n==='event_service_capabilities')return{ok:true,version:1,auth_user_id:qa.actor,actor_profile_id:'99999999-9999-4999-8999-999999999999',workspace_id:p.p_workspace,event_id:p.p_event,role:p.p_event?'guest':'owner',capabilities:{menu:1,setup:1,queue:1,lifecycle:1}};if(n==='event_service_setup_context')return{ok:true,workspace_id:ws,event_id:p.p_event,events:[{id:event,name:'Real concert'}],has_more:false,venues:p.p_event?[{id:venue,name:'Actual hall'}]:[],tables:p.p_event?[{id:table,venue_id:venue,name:'Table 12'}]:[],ordering_enabled:false};if(n==='event_service_setup_get'){if(qa.mode==='held')await new Promise(r=>qa.release=r);return{ok:true,workspace_id:qa.mode==='wrongscope'?id(99):ws,event_id:event,venue_id:venue,revision:qa.revision,data:structuredClone(qa.data),stale_item_ids:[],status:'paused',ordering_enabled:false};}if(n==='event_service_setup_save'){if(qa.mode==='notsent')throw Error('timeout');let r=qa.receipts[p.p_request];if(!r){qa.revision++;qa.data=structuredClone(p.p_data);r=qa.receipts[p.p_request]={ok:true,workspace_id:ws,event_id:event,venue_id:venue,request_id:p.p_request,revision:qa.revision,status:'saved_paused',ordering_enabled:false};}if(qa.mode==='lost')throw Error('timeout');return r;}if(n==='event_service_setup_request'){let r=qa.receipts[p.p_request];if(!r&&p.p_cancel_if_missing)r=qa.receipts[p.p_request]={ok:true,workspace_id:ws,event_id:event,venue_id:venue,request_id:p.p_request,status:'cancelled',ordering_enabled:false};return r||{ok:true,workspace_id:ws,event_id:event,venue_id:venue,request_id:p.p_request,status:'unknown',ordering_enabled:false};}throw Error(n);}}};qa.mount=async()=>{qa.handle?.destroy();qa.ctx={C,ws,role:'owner'};qa.handle=await ZoiSuite.modules.find(x=>x.id==='service-menu').mount(document.querySelector('main'),qa.ctx);};qa.mount();
