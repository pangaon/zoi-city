<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated workspace creation controller</title></head><body><main><form><label>Workspace name<input name="name" required value="New company"></label><button id="create">Create workspace</button></form><button id="check" type="button">Check current workspaces</button><p role="status"></p></main><script type="module">
import{createWorkspaceController}from'/assets/suite/workspace-creation.mjs';
const actor='11111111-1111-4111-8111-111111111111',id='33333333-3333-4333-8333-333333333333';window.qa={writes:0,mode:'lost',navigation:null};let controller;
const status=document.querySelector('[role=status]');
qa.mount=async()=>{controller?.dispose();controller=createWorkspaceController({actor,current:()=>true,storage:{load:async()=>JSON.parse(sessionStorage.getItem('workspace-fixture:'+actor)||'null'),save:async value=>sessionStorage.setItem('workspace-fixture:'+actor,JSON.stringify(value)),clear:async()=>sessionStorage.removeItem('workspace-fixture:'+actor)},rpc:async(name,args)=>{if(name==='zoi_create_workspace'){qa.writes++;if(qa.mode==='lost')throw Error('Result not confirmed. Check workspaces before continuing.');return{ok:true,workspace_id:id,name:args.p_name,kind:args.p_kind};}return{authenticated:true,workspaces:[{id,name:'New company',kind:'business',role:'owner'}]};},onConfirmed:value=>qa.navigation=value,changed:s=>{document.querySelector('#create').disabled=!s.ready||s.busy||s.pending;document.querySelector('input').disabled=s.busy||s.pending;document.querySelector('#check').disabled=s.busy;}});await controller.load();};
document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await controller.create({name:document.querySelector('input').value});}catch(error){status.textContent=error.message;}};
document.querySelector('#check').onclick=async()=>{try{const result=await controller.check();status.textContent=result.status==='unconfirmed'?'The original request is unconfirmed. Review your current workspaces; no new workspace was created by this check.':'Workspace confirmed.';}catch(error){status.textContent=error.message;}};await qa.mount();
</script></body></html>
