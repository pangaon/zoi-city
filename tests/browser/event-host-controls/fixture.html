<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlled event host controls</title><link rel="stylesheet" href="/assets/zoi-theme.css"><link rel="stylesheet" href="/assets/tickets/host-allocations.css"><link rel="stylesheet" href="/assets/events/host-controls.css"><style>body{margin:0;background:#08192b;color:#eef7ff;font:16px system-ui}main, #guest{max-width:1100px;margin:auto}#guest{padding:20px}*{box-sizing:border-box}#payment label{display:block;margin:16px 0}#payment input,#payment select,#payment button{min-height:44px;padding:10px;font:inherit;max-width:100%}#guest .event-milestone{padding:20px;border:1px solid #49657f;border-radius:20px;display:flex;gap:12px;align-items:center}#guest .event-milestone strong,#guest .event-milestone span{display:block}#guest .event-milestone strong{font-size:26px}</style></head><body><main><section id="owner"></section><button type="button" data-action="organizer-setup">Configure this event’s tables and prices</button><div id="setup"></div><section id="parea-payment-arrangements" tabindex="-1"><div id="payment"></div></section><section id="guest"><h2>Guest view</h2><button id="refresh-guest">Refresh published guest view</button><div id="guest-output"></div><div id="guest-availability"></div></section></main><script type="module">
import {mountEventHostControls} from '/assets/events/host-controls.mjs';
import {mountEventPaymentPolicy} from '/assets/tickets/event-payment-policy.mjs';
import {mountOrganizerSetup} from '/assets/tickets/organizer-setup.mjs';
import {publicPublicity} from '/assets/events/publicity.mjs';
import {renderSalesMilestone} from '/assets/events/publicity-view.mjs';
import {mountEventReservations} from '/assets/tickets/event-reservations.mjs';
const workspace='22222222-2222-4222-8222-222222222222',event='44444444-4444-4444-8444-444444444444',actor='11111111-1111-4111-8111-111111111111';
const names={toronto:'Giannis Ploutarchos & Andromache · Toronto',montreal:'Giannis Ploutarchos & Andromache · Montréal',sparse:'Ελληνική βραδιά – Kalamata'};
window.qa={inventory:{version:0,enabled:false,starts_at:null,tables:[]},actor,workspace,event,kind:'montreal',role:'owner',mode:'ok',calls:[],version:'a'.repeat(32),profile:{starts:'2027-03-26',lineup:['Giannis Ploutarchos','Andromache'],tickets_url:'https://official.example/tickets'},base:{website:'https://official.example/show',price_range:null},receipts:{},policy:{event_id:event,version:0,allow_pay_at_door:false,allow_pay_online:false,online_connected:false,response_deadline:null,response_open:true}};
const identity=()=>({id:event,name:names[qa.kind],slug:qa.kind==='toronto'?'giannis-ploutarchos-andromache-toronto-2027':qa.kind==='montreal'?'giannis-ploutarchos-andromache-montreal-2027':'kalamata-event'});
qa.core={auth:{load:()=>qa.actor?{user_id:qa.actor}:null,ensureFresh:async()=>!!qa.actor},api:{rpc:async(name,p)=>{qa.calls.push({name,p:structuredClone(p),actor:qa.actor});if((qa.mode==='session-status'&&name==='bizpage_status')||(qa.mode==='session-read'&&name==='home_content_get')||(qa.mode==='session-save'&&name==='home_content_save'))throw Object.assign(Error('invitation_unavailable'),{status:400});if(qa.mode==='temporary-read'&&name==='home_content_get')throw Object.assign(Error('Service temporarily unavailable'),{status:503});if(!qa.actor||qa.role==='viewer')throw Error('not_authorized');if(name==='bizpage_status')return{ok:true,owned:[identity()],claims:[]};if(name==='home_content_get'){if(qa.mode==='readfail')throw Error('not_authorized');return{ok:true,workspace_id:workspace,listing_id:event,version:qa.version,entity_type:'event',profile:structuredClone(qa.profile),base:structuredClone(qa.base)};}if(name==='home_content_save'){if(qa.mode==='denied')throw Error('not_authorized');if(qa.mode==='conflict')throw Error('version_conflict');if(qa.receipts[p.p_request])return structuredClone(qa.receipts[p.p_request]);if(p.p_expected_version!==qa.version)throw Error('version_conflict');qa.profile={...qa.profile,...p.p_profile,_meta:{updated_by:'owner'}};qa.version=(qa.version[0]==='a'?'b':'a').repeat(32);const r={ok:true,workspace_id:workspace,listing_id:event,request_id:p.p_request,version:qa.version};qa.receipts[p.p_request]=r;if(qa.mode==='lost'){qa.mode='ok';throw Error('response lost');}return r;}
 if(name==='event_guest_payment_options')return{ok:true,guests:[],total:0,payment_collected:false,ticket_issued:false};if(qa.role==='editor')throw Error('not_authorized');if(name==='event_payment_policy_get')return{ok:true,policy:structuredClone(qa.policy)};if(name==='event_payment_operator_report')return{ok:true,event_id:event,preferences:[],total:0,settlement_ledger:false,payment_collected:false};if(name==='event_payment_policy_configure'){qa.policy={...qa.policy,version:qa.policy.version+1,allow_pay_at_door:p.p_allow_pay_at_door,response_deadline:p.p_response_deadline};return{ok:true,request_id:p.p_request,scope:{workspace,event},policy:structuredClone(qa.policy),payment_collected:false,ticket_issued:false};}if(name==='table_inventory_operator')return{ok:true,workspace_id:workspace,event_id:event,...structuredClone(qa.inventory),payment_enabled:false,available_tables:[{table_id:'66666666-6666-4666-8666-666666666666',label:qa.kind==='montreal'?'10A':'9',capacity:10}]};if(name==='table_inventory_configure'){qa.inventory={...structuredClone(p.p_data),version:qa.inventory.version+1};return{ok:true,event_id:event,version:qa.inventory.version,enabled:qa.inventory.enabled,payment_enabled:false};}if(name==='table_identity_get')return{ok:true,workspace_id:workspace,event_id:event,version:0,tables:[]};throw Error('Unexpected RPC '+name);}}};
let controller,payment,setup;qa.mount=()=>{controller?.destroy();payment?.destroy();setup?.();document.querySelector('#setup').replaceChildren();controller=mountEventHostControls(document.querySelector('#owner'),{core:qa.core,workspace,event,location:{search:'?workspace='+workspace+'&event='+event}});payment=mountEventPaymentPolicy(document.querySelector('#payment'),{core:qa.core,workspace,event});document.querySelector('[data-action=organizer-setup]').disabled=qa.role!=='owner';};
qa.mountGuestAvailability=()=>mountEventReservations(document.getElementById('guest-availability'),{eventId:event,core:{...qa.core,otp:{}},fetchImpl:async()=>new Response(JSON.stringify({ok:true,event_id:event,configured:qa.inventory.enabled,tables:qa.inventory.enabled?qa.inventory.tables.map(t=>({table_id:t.table_id,label:t.source_label,capacity:t.capacity,min_party_size:t.min_party_size,price_per_guest_cents:t.price_per_guest_cents,currency:t.currency,pricing_version:qa.inventory.version,fees_included:true,availability:'available'})):[]}),{status:200,headers:{'Content-Type':'application/json'}})});
qa.guest=()=>{const e={...identity(),entity_type:'event',profile:structuredClone(qa.profile)},p=publicPublicity(e),node=document.querySelector('#guest-output');node.innerHTML=renderSalesMilestone(p,['https://www.zoi.city/event/'+identity().slug])||'<p>No current organiser ticket-sales report.</p>';return p;};
document.querySelector('#refresh-guest').onclick=qa.guest;document.querySelector('[data-action=organizer-setup]').onclick=()=>{setup=mountOrganizerSetup(document.querySelector('#setup'),{core:qa.core,workspace,event,onClose:()=>setup?.()});};qa.mode=new URLSearchParams(location.search).get("authority_mode")||"ok";qa.mount();
</script></body></html>
