<!doctype html><html><head><title>Selected-category search verification</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:20px;background:#081c30;color:white}input{font:inherit;box-sizing:border-box;width:100%;padding:14px}main{max-width:800px;margin:auto}.discovery-suggestions{padding:14px;border:1px solid #6b8eac;border-radius:16px}.suggestion-status{padding:10px}[role=option]{padding:14px;cursor:pointer}[role=option] span{display:block}[aria-selected=true]{background:#22476b}button{font:inherit;padding:12px;margin:6px}</style></head><body><main><h1>Map search · Toronto, Canada</h1><p><button id="none">No categories</button><button id="both">Events and venues</button></p><label for="q">Find a place</label><div id="mapsearch"><input id="q"></div><p id="chosen" role="status"></p></main><script type="module">
import{attachAutocomplete}from'/assets/discovery/autocomplete.mjs';let types=['event','venue'];const input=document.querySelector('#q');const helper=attachAutocomplete(input,{mountAfter:document.querySelector('#mapsearch'),id:'map-suggestions',filters:()=>({types,city:'Toronto',country:'Canada',strict:true}),onChoose:row=>document.querySelector('#chosen').textContent=row.name+' · '+row.href});document.querySelector('#none').onclick=()=>{types=[];input.focus();helper.refresh();};document.querySelector('#both').onclick=()=>{types=['event','venue'];input.focus();helper.refresh();};
</script></body></html>
