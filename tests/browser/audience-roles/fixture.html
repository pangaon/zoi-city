<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audience permissions</title></head><body><main class="mount" id="root"></main><p id="status" role="status"></p><script src="/assets/suite/audience.js"></script><script>
const actor='11111111-1111-4111-8111-111111111111',ws='22222222-2222-4222-8222-222222222222',contact='33333333-3333-4333-8333-333333333333';
window.qa={actor,role:'viewer',rows:[{id:contact,name:'Private client',email:'private@example.test',phone:'+1 555 555 0100',tags:['VIP'],notes:'Private notes',nameday:'June 1'}],writes:[],held:null,mode:'ok'};
qa.ctx={ws,role:'owner',toast:t=>document.querySelector('#status').textContent=t,C:{auth:{load:()=>({user_id:qa.actor})},esc:v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),api:{rpc:async(name,args)=>{
if(qa.mode==='denied')throw Error('no_access_to_workspace');
if(name==='audience_access')return{ok:true,workspace_id:ws,role:qa.role,can_write:['owner','admin','editor'].includes(qa.role),can_record_consent:['owner','admin','editor'].includes(qa.role)};
if(name==='audience_list'){if(qa.mode==='held')return new Promise(resolve=>qa.held=()=>resolve([{id:contact,name:'Late private client'}]));return structuredClone(qa.rows);}
if(!['owner','admin','editor'].includes(qa.role))throw Error('insufficient_permission');qa.writes.push(name);
if(name==='audience_upsert'){qa.rows=[{id:contact,name:args.p_name,email:args.p_email,tags:args.p_tags}];return contact;}
if(name==='audience_delete'){qa.rows=[];return true;}
if(name==='audience_import'){qa.rows=args.p_rows.map(r=>({...r,id:contact}));return{added:qa.rows.length,skipped:0};}
if(name==='email_consent_record')return{ok:true};throw Error(name);
}}}};qa.mount=async()=>{qa.handle?.destroy();qa.handle=await ZoiSuite.modules.find(m=>m.id==='audience').mount(document.querySelector('#root'),qa.ctx);};qa.mount();
</script></body></html>
