<!doctype html><html lang="en"><head><title>Service Menu verification</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--tx:#e8f2fc;--mut:#acc0d4;--bg2:#112d43;--bg3:#183c55;--line:#365971;--line2:#557790;--acc:#0879db}body{margin:20px;background:#081c30;color:var(--tx);font:16px system-ui}</style></head><body><main id="root"></main><script src="/assets/suite/service-menu.js"></script><script>
const ws='22222222-2222-4222-8222-222222222222';window.qa={actor:'11111111-1111-4111-8111-111111111111',rows:[],receipts:{},calls:[],mode:'ok'};const C={auth:{load:()=>({user_id:qa.actor,access_token:'qa'}),token:()=> qa.token||'qa',ensureFresh:async()=>true},api:{rpc:async(name,args)=>{qa.calls.push({name,args});if(qa.mode==='denied401')throw Object.assign(Error('Request failed'),{status:401});if(qa.mode==='denied403')throw Object.assign(Error('Request failed'),{statusCode:403});if(qa.mode==='denied42501')throw Object.assign(Error('Request failed'),{code:'42501'});if(name==='event_service_capabilities')return{ok:true,version:1,auth_user_id:qa.actor,actor_profile_id:'99999999-9999-4999-8999-999999999999',workspace_id:args.p_workspace,event_id:args.p_event,role:args.p_event?'guest':'owner',capabilities:{menu:1,setup:1,queue:1,lifecycle:1}};if(name==='service_menu_list'){if(qa.mode==='held')await new Promise(r=>qa.release=r);if(qa.mode==='refreshfail')throw Error('Read failed');return{ok:true,workspace_id:qa.mode==='wrongscope'?'33333333-3333-4333-8333-333333333333':ws,role:'owner',items:structuredClone(qa.rows)};}if(name==='service_menu_request'){let r=qa.receipts[args.p_request];if(!r&&args.p_cancel_if_missing)r=qa.receipts[args.p_request]={ok:true,status:'cancelled',workspace_id:ws,request_id:args.p_request};return r||{ok:true,status:'unknown',workspace_id:ws,request_id:args.p_request};}if(name==='menu_item_save_once'){let r=qa.receipts[args.p_request];if(!r){const old=qa.rows.find(x=>x.id===args.p_item_id);if(old&&old.revision!==args.p_expected_revision)r={ok:true,status:'conflict',workspace_id:ws,request_id:args.p_request,item_id:old.id,current_revision:old.revision};else{const row={...args.p_item,id:args.p_item_id||crypto.randomUUID(),workspace_id:ws,revision:args.p_expected_revision+1};qa.rows=qa.rows.filter(x=>x.id!==row.id);qa.rows.push(row);r={ok:true,status:'saved',workspace_id:ws,request_id:args.p_request,item_id:row.id,revision:row.revision};}qa.receipts[args.p_request]=r;}if(qa.mode==='lost')throw Error('Network lost');if(qa.mode==='savedrefreshfail')qa.mode='refreshfail';return r;}throw Error(name);}}};qa.mount=async()=>{qa.handle?.destroy();qa.ctx={C,ws,role:'owner'};qa.handle=await ZoiSuite.modules.find(x=>x.id==='service-menu').mount(document.querySelector('#root'),qa.ctx);};qa.mount();
</script></body></html>
