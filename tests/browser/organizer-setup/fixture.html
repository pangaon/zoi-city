<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Organizer setup lifecycle acceptance</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/assets/zoi-theme.css"><link rel="stylesheet" href="/assets/tickets/host-allocations.css"><link rel="stylesheet" href="/assets/tickets/table-inventory-operator.css"></head><body><main id="host-root"></main><script type="module">
import {mountOrganizerSetup} from '/assets/tickets/organizer-setup.mjs';
const id=n=>'82000000-0000-4000-8000-'+String(n).padStart(12,'0');
window.qa={actor:id(1),workspace:id(2),event:id(3),scope:true,identityVersion:0,inventoryVersion:0,tables:[],priced:[],enabled:false,writes:[],receipts:{},closes:0};
const f=qa;
const core={auth:{load:()=>({user_id:f.actor}),ensureFresh:async()=>{if(f.holdRefresh){f.holdRefresh=false;await new Promise(r=>f.finishRefresh=r);}return true;}},api:{rpc:async(name,p)=>{if(f.denied)throw Object.assign(Error('not_authorized'),{status:403});if(p.p_workspace!==f.workspace||p.p_event!==f.event)throw Error('scope mismatch');if(name==='table_inventory_operator')return{ok:true,event_id:f.event,version:f.inventoryVersion,enabled:f.enabled,starts_at:f.starts||null,tables:f.priced,available_tables:f.tables.map(x=>({table_id:x.id,label:x.label,capacity:x.capacity})),payment_enabled:false};if(name==='table_identity_get')return{ok:true,event_id:f.event,version:f.identityVersion,venue_id:f.identityVersion?id(4):null,tables:f.tables};if(name.endsWith('_receipt'))return{ok:true,found:!!f.receipts[p.p_request],receipt:f.receipts[p.p_request]};if(f.receipts[p.p_request])return f.receipts[p.p_request];f.writes.push({name,args:structuredClone(p)});let result;if(name==='table_identity_save'){if(p.p_expected_version!==f.identityVersion)throw Object.assign(Error('version_conflict'),{status:409});f.tables=structuredClone(p.p_tables);result={ok:true,event_id:f.event,version:++f.identityVersion,venue_id:id(4),enabled:false,table_ids:f.tables.map(x=>x.id)};}else if(name==='table_inventory_configure'){if(p.p_expected_version!==f.inventoryVersion)throw Object.assign(Error('version_conflict'),{status:400});f.priced=structuredClone(p.p_data.tables);f.enabled=p.p_data.enabled;f.starts=p.p_data.starts_at;result={ok:true,event_id:f.event,version:++f.inventoryVersion,enabled:f.enabled,payment_enabled:false};}else throw Error('Unexpected '+name);f.receipts[p.p_request]=result;if(f.lose){f.lose=false;throw Error('Response lost');}return result;}}};
window.mount=()=>{window.dispose=mountOrganizerSetup(document.getElementById('host-root'),{core,workspace:f.workspace,event:f.event,current:()=>f.scope,onClose:()=>f.closes++});};window.mount();
</script></body></html>
