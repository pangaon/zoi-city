<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated inquiry revocation acceptance</title></head><body><div id="root"></div><script type="module">
import {mount} from '/assets/inquiries/workspace.mjs';
const A='11111111-1111-4111-8111-111111111111',W='55555555-5555-4555-8555-555555555555',T='22222222-2222-4222-8222-222222222222',L='33333333-3333-4333-8333-333333333333';
window.qa={actor:A,mode:'ok',writes:0,held:null};
const thread={id:T,subject:'PRIVATE SUBJECT',listing_name:'PRIVATE BUSINESS',status:'open',version:1};
const C={auth:{load:()=>({user_id:qa.actor})},api:{rpc:async(name,args)=>{
 if(qa.mode==='deny')throw Object.assign(Error('inquiry_permission_denied'),{code:'42501'});
 if(qa.mode==='http')throw Object.assign(Error('Forbidden'),{status:403});
 if(qa.mode==='transient')throw Object.assign(Error('network unavailable'),{status:502});
 if(name==='inquiry_inbox'){const result={ok:true,role:'owner',threads:[thread],members:[],listings:[{id:L,name:'PRIVATE SETTINGS',enabled:true,version:1}],next_offset:null};if(qa.mode==='held')return new Promise(resolve=>qa.held=()=>resolve(result));return result;}
 if(name==='inquiry_thread')return{ok:true,thread,messages:[{body:'PRIVATE MESSAGE',author_side:'customer'}],audit:[],can_reply:true,older_cursor:null};
 if(name==='inquiry_reply'){qa.writes++;throw Error('lost response');}
 if(name==='inquiry_receipt')return{ok:true,found:false};
 throw Error('unexpected RPC '+name);
}}};
qa.mount=()=>mount(document.querySelector('#root'),{C,workspace:W});await qa.mount();window.ready=true;
</script></body></html>
