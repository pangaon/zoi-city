<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated workspace settings</title></head><body><main class="mount" id="root"></main><p role="status" id="status"></p><script src="/assets/suite/settings.js"></script><script>
const actor='11111111-1111-4111-8111-111111111111',ws='22222222-2222-4222-8222-222222222222';
window.qa={actor,name:'Actual workspace',profile:{business_name:'Different AI brand',about:'PRIVATE BUSINESS NOTES',tone:'Professional',languages:'English',sample:'PRIVATE SAMPLE'},mode:'ok',role:'owner',writes:0,renamed:null,hold:null};
const ctx={ws,avail:{ai:false},toast:t=>document.querySelector('#status').textContent=t,onWorkspaceRenamed:value=>qa.renamed=value,C:{auth:{load:()=>({user_id:qa.actor})},api:{rpc:async(name,args)=>{
if(qa.mode==='denied')throw Object.assign(Error('not_authorized'),{status:403});
const snapshot=()=>({ok:true,workspace_id:ws,role:qa.role,identity:{name:qa.name,version:qa.identityVersion||'33333333-3333-4333-8333-333333333333'},voice:{...qa.profile,version:qa.voiceVersion||'44444444-4444-4444-8444-444444444444'}});
if(name==='workspace_settings_get'){const value=snapshot();if(qa.mode==='held')return new Promise(resolve=>qa.hold=()=>resolve(value));return value;}
if(name==='workspace_settings_request'){qa.receipts=qa.receipts||{};if(args.p_cancel_if_missing&&!qa.receipts[args.p_request])qa.receipts[args.p_request]={ok:false,error:'request_cancelled',workspace_id:ws,request_id:args.p_request,section:args.p_section};return qa.receipts[args.p_request]||{ok:false,error:'request_unknown',workspace_id:ws,request_id:args.p_request,section:args.p_section};}
if(name==='workspace_settings_save'){qa.writes++;qa.receipts=qa.receipts||{};if(qa.mode==='unknown')throw Error('Lost before receipt');let result;if(args.p_expected_version!==snapshot()[args.p_section].version){result={ok:false,error:'version_conflict',workspace_id:ws,request_id:args.p_request,section:args.p_section,current:snapshot()[args.p_section]};}else{if(args.p_section==='identity'){qa.name=args.p_values.name;qa.identityVersion=crypto.randomUUID();}else{qa.profile=args.p_values;qa.voiceVersion=crypto.randomUUID();}const value=snapshot()[args.p_section];result={ok:true,workspace_id:ws,request_id:args.p_request,section:args.p_section,value,version:value.version};}qa.receipts[args.p_request]=result;if(qa.mode==='lost')throw Error('Lost response');return result;}
throw Error(name);
}}}};qa.mount=()=>ZoiSuite.modules.find(x=>x.id==='settings').mount(document.querySelector('#root'),ctx);qa.mount();
</script></body></html>
