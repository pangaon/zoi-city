<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlled company console acceptance</title><link rel="stylesheet" href="/assets/zoi-theme.css"><style>body{margin:0;font-family:system-ui;background:var(--bg);color:var(--tx)}header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}header img{height:42px}header strong{font-size:19px}header span{margin-left:auto;color:var(--mut)}main{padding:clamp(16px,3vw,36px);max-width:1440px;margin:auto;--bg3:var(--card)}@media(max-width:600px){header{padding:14px 18px}header span{font-size:12px}}</style></head><body><header><img src="/assets/brand/zoi-logo.png" alt="Zoi"><strong>Zoi</strong><span>Business workspace</span></header><main id="root"></main><script src="/assets/suite/operations.js"></script><script>
const id=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),workspace=id(1),actor=id(99),member=id(98);
const row=(kind,n,extra={})=>({id:id(n),workspace_id:workspace,kind,title:kind+' '+n,status:'open',version:1,data:{},...extra});
window.qa={actor,role:'owner',mode:'ok',calls:[],writes:0,receipts:{},documents:[{id:id(50),workspace_id:workspace,project_id:id(4),title:'Venue agreement',current_version:2}],records:[row('company',2,{title:'Olive Studios',data:{legal_name:'Olive Studios Ltd',jurisdiction:'Canada',registration_number:'TEST-ONLY-001',sector:'creator'}}),row('company',3,{title:'Greek Language School',data:{jurisdiction:'Australia'}}),row('project',4,{title:'Autumn showcase',company_id:id(2)}),row('project',5,{title:'School programme',company_id:id(3)}),row('task',6,{title:'Confirm venue',project_id:id(4),company_id:id(2),status:'blocked',due_at:'2026-10-01T12:00:00Z'}),row('task',7,{title:'Approve artwork',project_id:id(4),company_id:id(2),assignee_profile_id:member,due_at:'2026-10-06T12:00:00Z'}),row('task',8,{title:'Publish programme',project_id:id(4),company_id:id(2),status:'completed'}),row('task',9,{title:'Review teaching schedule',project_id:id(5),company_id:id(3)}),row('contact',10,{title:'Maria Papas',company_id:id(2),data:{email:'maria@example.org',phone:'+1 416 555 0100'}})]};
const C={auth:{load:()=>qa.actor?{user_id:qa.actor}:null,token:()=>qa.actor?'fixture.'+btoa(JSON.stringify({sub:qa.actor}))+'.fixture':'',ensureFresh:async()=>true},api:{rpc:async(n,a)=>{
 qa.calls.push({n,a});if(qa.mode==='expired')throw Object.assign(Error('suite_session_unavailable'),{status:400});if(qa.mode==='denied')throw Object.assign(Error('not_authorized'),{status:403});
 if(n==='ops_records_list')return{ok:true,records:structuredClone(qa.records),role:qa.role,members:[{profile_id:member,display_name:'Eleni'}]};
 if(n==='documents_list'){if(qa.holdDocs)return new Promise(r=>qa.releaseDocs=()=>r({ok:true,role:qa.role,projects:qa.records.filter(x=>x.kind==='project'),documents:qa.documents}));return{ok:true,role:qa.role,projects:qa.records.filter(x=>x.kind==='project'),documents:qa.documents};}
 if(n==='ops_mutation_execute'){if(qa.receipts[a.p_request])return qa.receipts[a.p_request];const p=a.p_args,prior=qa.records.find(x=>x.id===p.p_id);if(p.p_expected_version!==(prior?.version||0))throw Error('version_conflict');if(qa.role==='viewer'||(p.p_kind==='company'&&!['owner','admin'].includes(qa.role)))throw Error('insufficient_permission');qa.writes++;const data=p.p_data,project=qa.records.find(x=>x.id===data.project_id);const saved={...data,id:prior?.id||id(100+qa.writes),workspace_id:workspace,kind:p.p_kind,status:data.status||'open',version:(prior?.version||0)+1,data:{...data},company_id:data.company_id||project?.company_id||null};qa.records=qa.records.filter(x=>x.id!==saved.id).concat(saved);const receipt={ok:true,state:'saved',workspace_id:workspace,request_id:a.p_request,action:a.p_action,record_id:saved.id,kind:saved.kind,version:saved.version};qa.receipts[a.p_request]=receipt;if(qa.lose){qa.lose=false;throw Error('Response lost after commit');}return receipt;}
 if(n==='ops_request_status')return qa.receipts[a.p_request]||{ok:true,state:'missing',workspace_id:workspace,request_id:a.p_request};if(n==='ops_audit_list')return{ok:true,events:[]};throw Error('Unexpected RPC '+n);
}}};const ctx={C,ws:workspace,navigate:async(_,view)=>{ctx.view=view;await qa.mount();}};qa.mount=()=>ZoiSuite.modules.find(m=>m.id==='operations').mount(document.querySelector('#root'),ctx);qa.mount();
</script></body></html>
