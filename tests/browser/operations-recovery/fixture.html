<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated Operations recovery</title></head><body><main id="root"></main><script src="/assets/suite/operations.js"></script><script>
const actor='11111111-1111-4111-8111-111111111111',workspace='22222222-2222-4222-8222-222222222222';window.qa={actor,records:[],receipts:{},writes:0,mode:'ok',held:null,lost:true};
const C={auth:{load:()=>qa.actor?{user_id:qa.actor}:null,token:()=>qa.actor?"fixture."+btoa(JSON.stringify({sub:qa.actor}))+".fixture":"",ensureFresh:async()=>true},api:{rpc:async(name,p)=>{
 if(qa.mode==='denied')throw Object.assign(Error('not_authorized'),{status:403});if(qa.mode==='transient')throw Object.assign(Error('Temporary unavailable'),{status:502});
 if(name==='ops_records_list'){const result={ok:true,records:qa.records,role:'owner',members:[]};if(qa.mode==='held')return new Promise(resolve=>qa.held=()=>resolve(result));return result;}
 if(name==='ops_mutation_execute'){if(qa.receipts[p.p_request])return qa.receipts[p.p_request];qa.writes++;const old=qa.records.find(r=>r.id===p.p_args.p_id);const row={id:old?.id||'33333333-3333-4333-8333-'+String(qa.writes).padStart(12,'0'),workspace_id:workspace,kind:p.p_args.p_kind||old?.kind,title:p.p_args.p_data?.title||old?.title,data:p.p_args.p_data||old?.data,status:'open',version:(old?.version||0)+1};qa.records=qa.records.filter(r=>r.id!==row.id);qa.records.push(row);const receipt={ok:true,state:'saved',workspace_id:workspace,request_id:p.p_request,action:p.p_action,record_id:row.id,kind:row.kind,version:row.version};qa.receipts[p.p_request]=receipt;if(qa.lost){qa.lost=false;throw Error('Lost response after commit');}return receipt;}
 if(name==='ops_request_status')return qa.receipts[p.p_request]||{ok:true,state:p.p_cancel_if_missing?'cancelled':'missing',workspace_id:workspace,request_id:p.p_request};throw Error('Unexpected RPC '+name);
}}};qa.mount=()=>ZoiSuite.modules.find(m=>m.id==='operations').mount(document.querySelector('#root'),{C,ws:workspace});qa.mount();
</script></body></html>
