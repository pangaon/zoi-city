<!doctype html><html lang="en"><head><title>Event Service Lifecycle verification</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:16px;background:#081c30;color:#eaf3fc;font:16px system-ui}</style></head><body><main></main><script type="module">
import{mount as operator}from'/assets/events/event-service-session.mjs';import{mount as guest}from'/assets/events/event-service-order.mjs';
const id=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),ws=id(1),event=id(3),venue=id(4),session=id(5),table=id(6),guestId=id(7),admission=id(8),food=id(9),drink=id(10);window.qa={id,actor:id(2),role:'operator',mode:'ok',calls:[],receipts:{},admitted:false,orders:[],state:'active',revision:1,cashRev:1,ledger:[]};
const C={auth:{token:()=>'fixture',load:()=>({user_id:qa.actor}),ensureFresh:async()=>{if(qa.hold)await new Promise(r=>qa.release=r);return qa.fresh!==false;}},api:{rpc:async(n,p)=>{qa.calls.push({n,p});if(qa.holdRead)await new Promise(r=>qa.releaseRead=r);if(n==='event_service_capabilities')return{ok:true,version:1,auth_user_id:qa.actor,actor_profile_id:'99999999-9999-4999-8999-999999999999',workspace_id:p.p_workspace,event_id:p.p_event,role:p.p_event?'guest':'owner',capabilities:{menu:1,setup:1,queue:1,lifecycle:1}};if(n==='service_menu_list')return{ok:true,workspace_id:ws,items:[]};if(qa.mode==='denied')throw Object.assign(Error('Request failed'),{status:403});if(qa.mode==='unsent'&&p.p_request&&!n.endsWith('_request'))throw Error('Network unavailable');const base={ok:true,workspace_id:qa.mode==='wrongscope'?id(99):ws,event_id:event};
if(n==='event_service_setup_context')return{...base,event_id:p.p_event,events:[{id:event,name:'Toronto concert'}],venues:[{id:venue,name:'Venue'}],has_more:false};
if(n==='event_service_setup_get')return{...base,venue_id:venue,revision:1};
if(n==='event_service_sessions')return{...base,venue_id:venue,sessions:[{id:session,status:qa.state}]};
if(n==='event_service_operator_view')return{...base,session_id:session,status:qa.state,revision:qa.revision,currency:'CAD',section:p.p_section,has_more:{admissions:false,candidates:false,approvals:false},opens_at:'2027-03-20T22:00:00Z',closes_at:'2027-03-21T04:00:00Z',stock:[{menu_item_id:food,name:'Meal',available:3,reserved:qa.orders.length?1:0,consumed:0}],candidates:qa.admitted?[]:[{id:guestId,revision:1,label:'Alex',quantity:2,table_id:table,table_label:'Table 12',hold_expired:true}],admissions:qa.admitted?[{id:admission,label:'Alex',table_id:table,quantity:2,status:'active',revision:1}]:[],approvals:qa.orders.filter(o=>o.status==='awaiting_approval').map(o=>({...o,table_name:'Table 12',customer_name:'Alex',items:[{name:'Bottle',quantity:1}]}))};
if(n==='event_service_my_tables')return{ok:true,event_id:event,tables:qa.admitted?[{session_id:session,table_id:table,table_name:'Table 12',status:qa.state}]:[]};
if(n==='event_service_guest_view')return{ok:true,event_id:qa.mode==='wrongscope'?id(99):event,session_id:session,table_id:table,revision:qa.revision,currency:'CAD',payment_collected:false,ordering_open:qa.state==='active',has_more:false,menu:[{id:food,name:'Meal',description:'Kitchen meal',menu_revision:1,unit_cents:2000,station:'kitchen',requires_staff_approval:false,available_quantity:3},{id:drink,name:'Bottle',description:'Staff checks apply',menu_revision:1,unit_cents:10000,station:'bar',requires_staff_approval:true,available_quantity:2}],orders:qa.orders.map(o=>({...o,items:[{name:o.station==='bar'?'Bottle':'Meal',quantity:1}]}))};
if(n==='event_service_cash_view'){const paid=qa.ledger.reduce((a,l)=>a+(l.kind==='cash'?l.cents:-l.cents),0),total=qa.orders.filter(o=>o.charged).reduce((a,o)=>a+o.total_cents,0);return{...base,session_id:session,status:qa.state,currency:'CAD',online_payment_collected:false,has_more:false,tabs:[{id:id(20),name:'Table 12',revision:qa.cashRev,total_cents:total,paid_cents:paid,remaining_cents:total-paid}],ledger:qa.ledger.map(l=>({...l,reversible_cents:l.kind==='cash'?l.cents-qa.ledger.filter(r=>r.original_id===l.id).reduce((a,r)=>a+r.cents,0):0}))};}
if(n==='event_service_cash_request'){p={...p,p_kind:'settlement',p_scope:p.p_tab};n='event_service_request';}
if(n==='event_service_request'){const r=qa.receipts[p.p_request];if(r)return r;if(p.p_cancel_if_missing)return qa.receipts[p.p_request]={ok:true,kind:p.p_kind,scope_id:p.p_scope,request_id:p.p_request,status:'cancelled'};return{ok:true,kind:p.p_kind,scope_id:p.p_scope,request_id:p.p_request,status:'unknown'};}
if(p.p_request&&qa.receipts[p.p_request])return qa.receipts[p.p_request];let kind,scope,r;if(n==='event_service_admit'){kind='admit';scope=session;qa.admitted=true;r={session_id:session,table_id:table,admission_id:admission,ticket_issued:false,payment_collected:false};}
if(n==='event_service_order'){kind='order';scope=session;qa.orders=[{id:id(11),order_id:id(11),station:'kitchen',status:'received',revision:1,total_cents:2000,charged:true},{id:id(12),order_id:id(12),station:'bar',status:'awaiting_approval',revision:1,total_cents:10000,charged:false}];r={session_id:session,event_id:event,table_id:table,currency:'CAD',total_cents:12000,charged_cents:2000,payment_collected:false,orders:qa.orders};}
if(n==='event_service_approval'){kind='approval';scope=p.p_order;const o=qa.orders.find(o=>o.id===scope);o.revision++;o.status=p.p_approve?'received':'cancelled';o.charged=p.p_approve;r={workspace_id:ws,order_id:scope,status:p.p_approve?'approved':'rejected',revision:o.revision,payment_collected:false};}
if(n==='event_service_control'){kind='control';scope=session;qa.state=p.p_status;qa.revision++;r={workspace_id:ws,session_id:session,status:qa.state,revision:qa.revision};}
if(n==='event_service_cash_record'){kind='settlement';scope=p.p_tab;qa.cashRev++;const ledger={id:id(30+qa.ledger.length),tab_id:scope,payment_id:id(40+qa.ledger.length),kind:p.p_kind,cents:p.p_cents,original_id:p.p_original,note:p.p_note};qa.ledger.push(ledger);const paid=qa.ledger.reduce((a,l)=>a+(l.kind==='cash'?l.cents:-l.cents),0),total=qa.orders.filter(o=>o.charged).reduce((a,o)=>a+o.total_cents,0);r={workspace_id:ws,session_id:session,tab_id:scope,ledger_id:ledger.id,payment_id:ledger.payment_id,cash_kind:p.p_kind,cents:p.p_cents,original_id:p.p_original,revision:qa.cashRev,currency:'CAD',paid_cents:paid,remaining_cents:total-paid,recorded_by_staff:true,online_payment_collected:false};}
if(!kind)throw Error(n);const receipt=qa.receipts[p.p_request]||{ok:true,kind,scope_id:scope,request_id:p.p_request,status:'completed',...r};qa.receipts[p.p_request]=receipt;if(qa.mode==='lost')throw Error('Response lost');return receipt;
}}};qa.mount=async(role=qa.role)=>{qa.handle?.destroy();qa.role=role;qa.ctx={C,ws,role:'owner'};qa.handle=await(role==='operator'?operator(document.querySelector('main'),qa.ctx):guest(document.querySelector('main'),{C,event}));};await qa.mount();
</script></body></html>
