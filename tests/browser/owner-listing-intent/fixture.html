<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exact owner listing handoff</title></head><body><main id="root"></main><script src="/assets/suite/bizpage.js"></script><script>
const actor='11111111-1111-4111-8111-111111111111',ws='22222222-2222-4222-8222-222222222222',a='33333333-3333-4333-8333-333333333333',b='44444444-4444-4444-8444-444444444444';
window.qa={reads:[],mode:'ok',choices:[{id:a,name:'First business',slug:'first',claimed:true},{id:b,name:'Requested second business',slug:'second',claimed:true}]};
const C={auth:{load:()=>({user_id:actor}),token:()=> 'fixture'},api:{rpc:async(name,args)=>{if(name==='bizpage_status')return{owned:qa.choices};if(name==='home_content_get'){qa.reads.push(args.p_listing);if(qa.mode==='fail')throw Error('Temporary read failure');return{ok:true,workspace_id:ws,listing_id:args.p_listing,version:'a'.repeat(32),entity_type:'business',category_slug:'shops',base:{description:args.p_listing===b?'SECOND PRIVATE DESCRIPTION':'FIRST PRIVATE DESCRIPTION'},profile:{},owner_content:{}};}throw Error('Unexpected '+name);}}};qa.mount=()=>ZoiSuite.modules.find(x=>x.id==='bizpage').mount(document.querySelector('#root'),{C,ws,onListingSelected:qa.callback?value=>{qa.selection=value;const url=new URL(location.href);url.searchParams.set('workspace',value.workspaceId);url.searchParams.set('listing',value.listingId);history.replaceState(null,'',url);}:undefined});qa.mount();
</script></body></html>
