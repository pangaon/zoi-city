<!doctype html><html lang="en"><head><title>Service Queue verification</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--tx:#e8f2fc;--mut:#acc0d4;--bg2:#112d43;--bg3:#183c55;--line:#365971;--line2:#557790;--acc:#0879db}body{margin:20px;background:#081c30;color:var(--tx);font:16px system-ui}</style></head><body><main></main><script src="/assets/suite/service-queue.js"></script><script>
const id=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),ws=id(1),actor=id(2),order=id(3);window.qa={actor,ws,mode:'ok',calls:[],receipts:{},row:{id:order,revision:1,table_name:'Table 12',customer_name:'Alex',fulfillment_status:'received',target_station:'bar',notes:'',created_at:'2026-10-01T18:00:00Z',items:[{id:id(4),item_name:'House selection',quantity:2,special_instructions:'Bring water too'}]}};
const C={auth:{load:()=>({user_id:qa.actor}),token:()=>'fixture',ensureFresh:async()=>{if(qa.holdRefresh)await new Promise(r=>qa.releaseRefresh=r);return qa.refreshOk!==false;}},api:{rpc:async(n,p)=>{qa.calls.push({n,p});if(qa.mode==='denied')throw Object.assign(Error('Request failed'),{status:403});if(n==='event_service_capabilities')return{ok:true,version:1,auth_user_id:qa.actor,actor_profile_id:'99999999-9999-4999-8999-999999999999',workspace_id:p.p_workspace,event_id:p.p_event,role:p.p_event?'guest':'owner',capabilities:{menu:1,setup:1,queue:1,lifecycle:1}};if(n==='service_queue_list'){if(qa.mode==='held')await new Promise(r=>qa.release=r);return{ok:true,workspace_id:qa.mode==='wrongscope'?id(99):ws,station:p.p_station,tickets:qa.row.fulfillment_status==='delivered'?[]:[structuredClone(qa.row)].filter(r=>!p.p_station||r.target_station===p.p_station),has_more:false};}if(n==='kds_ticket_advance_once'){if(qa.mode==='notsent')throw Error('timeout');let r=qa.receipts[p.p_request];if(!r){qa.row.revision++;qa.row.fulfillment_status=p.p_status;r=qa.receipts[p.p_request]={ok:true,workspace_id:ws,order_id:order,request_id:p.p_request,status:'advanced',revision:qa.row.revision,fulfillment_status:p.p_status};}if(qa.mode==='lost')throw Error('timeout');return r;}if(n==='service_queue_request'){let r=qa.receipts[p.p_request];if(!r&&p.p_cancel_if_missing)r=qa.receipts[p.p_request]={ok:true,workspace_id:ws,order_id:order,request_id:p.p_request,status:'cancelled'};return r||{ok:true,workspace_id:ws,order_id:order,request_id:p.p_request,status:'unknown'};}throw Error(n);}}};qa.mount=async()=>{qa.handle?.destroy();qa.ctx={C,ws,role:'owner'};qa.handle=await ZoiSuite.modules.find(x=>x.id==='service-queue').mount(document.querySelector('main'),qa.ctx);};qa.mount();
</script></body></html>
