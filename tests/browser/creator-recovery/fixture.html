<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated creator recovery acceptance</title></head><body><div id="root"></div><div id="creator-app"></div><script type="module">
import {mount} from '/assets/creator/studio.mjs';
const A='11111111-1111-4111-8111-111111111111',W='55555555-5555-4555-8555-555555555555',ID='22222222-2222-4222-8222-222222222222';
window.qa={actor:A,mode:'ok',label:'PRIVATE OLD CAMPAIGN',held:null,otp:null,writeMode:'lost-saved',writes:[],receipts:{},created:0};
const C={auth:{load:()=>qa.actor?{user_id:qa.actor}:null,isSignedIn:()=>!!qa.actor,token:()=>qa.actor},otp:{send:()=>new Promise(resolve=>qa.otp=resolve),verify:()=>new Promise(resolve=>qa.otp=resolve)},api:{rpc:async(fn,args)=>{
 if(fn==='creator_mutation_execute'){qa.writes.push(structuredClone(args));if(qa.mode==='deny')throw Object.assign(Error('creator_permission_denied'),{status:403});let r=qa.receipts[args.p_request];if(!r&&qa.writeMode!=='lost-missing'){r={ok:true,state:'saved',request_id:args.p_request,action:args.p_action,campaign_id:ID,entity_id:args.p_args.p_id||ID,version:1};qa.receipts[args.p_request]=r;qa.created++;}if(qa.writeMode.startsWith('lost'))throw Error('lost response');return r;}
 if(fn==='creator_request_status'){if(qa.mode==='deny')throw Object.assign(Error('creator_permission_denied'),{status:403});return qa.receipts[args.p_request]||{ok:true,state:args.p_cancel_if_missing?'cancelled':'missing',request_id:args.p_request};}

 if(qa.mode==='deny')throw Object.assign(Error('creator_permission_denied'),{status:403});if(qa.mode==='transient')throw Error('network unavailable');
 const campaign={id:ID,title:qa.label,kind:'sponsorship',version:1,shared_version:0,inquiry_id:ID,draft:{title:qa.label,summary:'PRIVATE SUMMARY',channels:[]}};
 const result=fn==='creator_get'?{ok:true,campaign,can_write:true,briefs:[],deliverables:[],submissions:[],audit:[]}:{ok:true,campaigns:[campaign],inquiries:[],companies:[]};
 if(qa.mode==='held')return new Promise((resolve,reject)=>qa.held={resolve:()=>resolve(result),reject:()=>reject(Object.assign(Error('creator_permission_denied'),{status:403}))});return result;
}}};window.ZoiCore=C;
qa.mount=async(workspace=W)=>{qa.handle=await mount(document.querySelector('#root'),{C,workspace});};
qa.change=actor=>{qa.actor=actor;for(const name of ['zoi:authchange','zoi:auth-change','storage','focus'])window.dispatchEvent(new Event(name));};
if(new URL(location.href).searchParams.has('customer')){qa.actor=null;await import('/assets/creator/customer.mjs');}else await qa.mount();window.ready=true;
</script></body></html>
