<!doctype html><html><head><title>Sponsorship fulfillment controlled journey</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/zoi-theme.css"></head><body><main id="root"></main><script type="module">
import {mount as festival} from '/assets/festival/operator.mjs';import{mount as creator}from'/assets/creator/studio.mjs';
const id=n=>'92000000-0000-4000-8000-'+String(n).padStart(12,'0');const now='2026-10-02T12:00:00Z';window.qa={actor:id(1),role:'owner',writes:[],receipts:{},campaign:null,deliverables:[],briefs:[],submissions:[],lost:false};const q=qa;
q.application={id:id(5),package_id:id(4),workspace_id:id(2),event_id:id(3),inquiry_id:id(6),status:'approved',version:2,units:1,total_cents:50000,event_name:'QA Concert',created_at:now,terms:{kind:'sponsor',name:'Original sponsor package',description:'Original agreed terms',benefits:['Stage screen recognition','Customer-approved recap'],price_cents:50000,currency:'CAD'},data:{organisation:'QA Sponsor',contact_name:'Private applicant',contact_email:'qa@example.test',category:'sponsor',notes:'Private brief'}};
q.package={id:id(4),event_id:id(3),kind:'sponsor',name:'Changed future package',description:'New future terms',benefits:['Different future promise'],price_cents:60000,currency:'CAD',capacity:3,allocated:1,active:true,timezone:'UTC',closes_at:'2027-01-01T00:00:00Z',version:3};
const C={auth:{load:()=>q.actor?{user_id:q.actor}:null,ensureFresh:async()=>{if(q.hold){q.hold=false;await new Promise(r=>q.resume=r);}return true;},token:()=>q.actor},api:{rpc:async(fn,p)=>{
 if(fn.startsWith('creator_'))q.creatorReads=(q.creatorReads||0)+1;
 if(q.denied)throw Object.assign(Error('creator_permission_denied'),{status:403});
 if(fn==='festival_fulfillment_source'){if(q.capabilityMissing)throw Error('Fulfillment capability unavailable');return structuredClone({ok:true,capability:'festival_creator_binding_v1',workspace_id:id(2),role:q.role,application:q.application});}
 if(fn==='festival_operator')return structuredClone({ok:true,role:q.role,events:[{id:id(3),name:'QA Concert'}],packages:[q.package],applications:[q.application],audit:[],next_offset:null});
 if(fn==='festival_placement_operator')return{ok:true,scopes:[{event_id:id(3),workspace_id:id(2),configuration:'front',version:1}],placements:[{id:id(20),application_id:id(5),event_id:id(3),workspace_id:id(2),title:'QA approved sponsor'}]};if(fn==='festival_placements_public')return{ok:true,server_time:now,placements:q.hidePlacement?[]:[{id:id(20),event_id:id(3),configuration:'front',configuration_version:1,approval:'approved',starts_at:'2026-10-01T00:00:00Z',ends_at:'2027-01-01T00:00:00Z'}]};if(fn==='creator_list')return structuredClone({ok:true,role:q.role,campaigns:q.campaign?[q.campaign]:[],companies:[{id:id(7),title:'QA organizer company'}],inquiries:q.campaign?[]:[{id:id(6),subject:'Approved sponsor application'}]});
 if(fn==='creator_customer_list')return{ok:true,campaigns:q.briefs.length?[{id:id(8),kind:'sponsorship',title:q.campaign.draft.title,shared_version:q.campaign.shared_version}]:[]};
 if(fn==='creator_get')return structuredClone({ok:true,campaign:q.campaign,can_write:q.role!=='viewer',operator:q.actor===id(1),briefs:q.briefs,deliverables:q.deliverables,submissions:q.submissions,audit:[]});
 if(fn==='creator_request_status')return q.receipts[p.p_request]||{ok:true,state:p.p_cancel_if_missing?'cancelled':'missing',request_id:p.p_request};
 if(fn==='creator_mutation_execute'){q.writes.push(structuredClone(p));if(q.receipts[p.p_request])return q.receipts[p.p_request];const a=p.p_args;let entity=id(8);if(p.p_action==='creator_convert')q.campaign={id:id(8),workspace_id:id(2),inquiry_id:id(6),kind:'sponsorship',version:1,shared_version:0,draft:{title:'Approved sponsor application',summary:'Review agreed benefits',currency:'CAD',planned_fee_cents:50000,channels:[],usage_terms:'',disclosure_notes:''}};
 if(p.p_action==='creator_deliverable_save'){entity=a.p_id;q.deliverables=q.deliverables.filter(d=>d.id!==entity);q.deliverables.push({id:entity,...a.p_data,version:a.p_expected_version+1});q.campaign.version++;}
 if(p.p_action==='creator_draft_save'){q.campaign.draft=a.p_data;q.campaign.version++;}
 if(p.p_action==='creator_brief_share'){entity=id(10);q.campaign.shared_version++;q.briefs=[{id:entity,version:q.campaign.shared_version,status:'shared',created_at:now,payload:{kind:'sponsorship',brief:structuredClone(q.campaign.draft),deliverables:structuredClone(q.deliverables)}}];}
 if(p.p_action==='creator_brief_decide'){entity=a.p_brief;q.briefs[0].status=a.p_decision;}
 if(p.p_action==='creator_submission_send'){entity=id(11);q.submissions=[{id:entity,brief_id:q.briefs[0].id,deliverable_id:a.p_deliverable,status:'submitted',url:a.p_url,note:a.p_note,created_at:now}];}
 if(p.p_action==='creator_submission_decide'){entity=a.p_submission;q.submissions[0].status=a.p_decision;q.completedTask=q.submissions[0].deliverable_id;}
 const result={ok:true,state:'saved',request_id:p.p_request,action:p.p_action,campaign_id:id(8),entity_id:entity,version:q.campaign.version};q.receipts[p.p_request]=result;if(q.lost){q.lost=false;throw Error('Response lost');}return result;}
 throw Error('Unexpected RPC '+fn);
}}};q.ctx={C,ws:id(2)};q.mount=async()=>festival(document.getElementById('root'),q.ctx);q.customer=async()=>{q.actor=id(99);window.dispatchEvent(new Event('zoi:auth-change'));await creator(document.getElementById('root'),{C});};q.operator=async()=>{q.actor=id(1);window.dispatchEvent(new Event('zoi:auth-change'));await q.mount();};await q.mount();
</script></body></html>
