<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Redirecting… · Zoi</title>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#080a0e;color:#8b95a3;
  font-family:system-ui,sans-serif;font-size:14px}
.box{text-align:center}
.spin{width:26px;height:26px;border:2px solid rgba(255,255,255,.15);border-top-color:#d9b26a;border-radius:50%;
  margin:0 auto 14px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:#6ea8ff}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div id="msg">Taking you there…</div>
</div>
<script>
const BASE='https://csebihpaychdkanjjsmz.supabase.co';
const KEY='sb_publishable_BM4ZQtOCUhjg7VqyFGJGRw_eFyTgI4j';
function slug(){
  try{
    const q=new URLSearchParams(location.search).get('s'); if(q) return q.trim();
    const parts=location.pathname.split('/').filter(Boolean);
    let last=parts[parts.length-1]||'';
    if(/\.html?$/i.test(last)) last=parts[parts.length-2]||'';
    if(last==='l') return '';
    return decodeURIComponent(last||'');
  }catch(e){ return ''; }
}
function safe(u){ u=String(u||''); return (u.indexOf('http://')===0||u.indexOf('https://')===0)?u:null; }
(async function(){
  const s=slug();
  const msg=document.getElementById('msg');
  if(!s){ msg.innerHTML='Broken link. <a href="/">Go to Zoi →</a>'; return; }
  try{
    const r=await fetch(BASE+'/rest/v1/rpc/link_resolve',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_slug:s})});
    const t=await r.text(); const j=t?JSON.parse(t):null;
    const url=j&&safe(j.url);
    if(url){ location.replace(url); }
    else{ msg.innerHTML='This link no longer works. <a href="/">Go to Zoi →</a>'; }
  }catch(e){ msg.innerHTML='Could not resolve link. <a href="/">Go to Zoi →</a>'; }
})();
</script>
</body>
</html>
