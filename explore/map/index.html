<meta name="theme-color" content="#080a0e">

<link rel="dns-prefetch" href="https://tiles.openfreemap.org">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html,body{height:100%}
  body{overflow:hidden}
  .zoi-header{position:relative;z-index:40}

  /* ---- stage ---- */
  .m-stage{position:fixed;inset:var(--hdr,64px) 0 0 0;display:flex;overflow:hidden;background:var(--bg);
    /* Panel width is declared once here; the tool rail is positioned from it, so
       the two can no longer end up stacked on each other. */
    --pw:min(384px,calc(100vw - 28px))}
  #map{position:absolute;inset:0}
  #map:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .maplibregl-canvas{outline:none}

  /* The globe's backdrop. Keeping it token-driven means the void around the
     planet matches the page instead of MapLibre's default grey. */
  .maplibregl-map{background:var(--bg)!important;font-family:"Hanken Grotesk",system-ui,sans-serif}

  /* ---- floating panes ---- */
  .m-pane{
    position:absolute;z-index:12;background:color-mix(in srgb,var(--card) 86%,transparent);
    backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)
  }

  /* search + filters, top left */
  .m-controls{top:14px;left:14px;width:min(370px,calc(100vw - 28px));padding:12px;display:grid;gap:10px}
  .m-searchrow{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;padding:9px 11px}
  .m-searchrow:focus-within{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
  .m-searchrow svg{flex:0 0 16px;opacity:.6}
  .m-searchrow input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:14.5px;outline:none}
  .m-searchrow input::placeholder{color:var(--dim)}
  .m-clearq{border:0;background:none;color:var(--dim);cursor:pointer;padding:2px 4px;border-radius:6px;font-size:16px;line-height:1}
  .m-clearq:hover{color:var(--tx)}

  .m-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:min(244px,34vh);overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain}
  .m-chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--bg2);color:var(--mut);
    font:600 12.5px/1.35 "Hanken Grotesk",system-ui,sans-serif;text-transform:none;letter-spacing:0;
    cursor:pointer;white-space:nowrap;
    transition:border-color .16s var(--ease),color .16s var(--ease),background .16s var(--ease)
  }
  .m-chip:hover{color:var(--tx);border-color:var(--line2)}
  .m-chip .m-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px;box-shadow:none}
  .m-chip .m-n{font-variant-numeric:tabular-nums;font-size:11.5px;opacity:.75;font-weight:500}
  .m-chip[aria-pressed="true"]{color:var(--tx);background:color-mix(in srgb,var(--card2) 70%,transparent);
    border-color:color-mix(in srgb,currentColor 45%,var(--line))}
  .m-chip[data-off="1"]{opacity:.38}
  .m-chiprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .m-chiprow .m-lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .m-linkish{border:0;background:none;color:var(--acc);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:2px}
  .m-linkish:hover{text-decoration:underline}

  /* results / detail, right */
  .m-panel{top:14px;right:14px;bottom:14px;width:var(--pw);display:flex;flex-direction:column;overflow:hidden}
  .m-panel header{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .m-panel header h2{margin:0;font-family:"Fraunces",serif;font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1}
  .m-panel header .m-sub{display:block;font-family:"Hanken Grotesk",sans-serif;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
  .m-panel .m-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
  .m-xbtn{border:1px solid var(--line);background:var(--bg2);color:var(--mut);width:28px;height:28px;
    border-radius:8px;cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto}
  .m-xbtn:hover{color:var(--tx);border-color:var(--line2)}
  .m-sheetbtn{display:none;place-items:center}
  .m-sheetbtn svg{width:16px;height:16px;transition:transform .2s var(--ease)}

  .m-row{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;
    text-decoration:none;color:inherit;transition:background .14s var(--ease)}
  .m-row:hover,.m-row:focus-visible{background:color-mix(in srgb,var(--card2) 60%,transparent);outline:none}
  .m-row .m-mark{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-family:"Fraunces",serif;font-size:14px;font-weight:700;color:var(--bg)}
  [data-theme="light"] .m-row .m-mark{color:#fff}
  .m-row .m-meta{min-width:0;flex:1}
  /* These are spans. Without display:block the name and the category rendered
     on one run-together line and text-overflow never engaged, so long Greek
     names spilled straight out of the panel. */
  .m-row .m-meta{display:block}
  .m-row .m-nm{display:block;font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-row .m-wh{display:block;font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-row .m-km{display:block;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:2px}
  .m-empty{padding:34px 20px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.6}
  .m-panel footer{padding:9px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);line-height:1.5}

  /* map controls, bottom right */
  .m-tools{bottom:14px;right:calc(var(--pw) + 26px);padding:6px;display:flex;flex-direction:column;gap:4px;z-index:13}
  .m-tool{
    width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--mut);cursor:pointer;
    display:grid;place-items:center;transition:background .14s var(--ease),color .14s var(--ease)
  }
  .m-tool:hover{background:var(--bg2);color:var(--tx)}
  .m-tool[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
  .m-tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .m-tool .m-txt{font-size:12px;font-weight:700;letter-spacing:.02em}
  .m-toolsep{height:1px;background:var(--line);margin:2px 4px}

  /* zoom cluster + pin markers */
  .m-cl{cursor:pointer;will-change:transform}
  .m-cl svg{display:block;overflow:visible}
  .m-cl .m-cnt{font:600 11.5px/1 "Hanken Grotesk",sans-serif;fill:var(--tx);
    paint-order:stroke;stroke:var(--bg);stroke-width:3px;font-variant-numeric:tabular-nums}
  .m-cl:hover .m-ring{filter:brightness(1.25)}

  .m-pin{cursor:pointer;width:16px;height:16px;border-radius:50%;box-sizing:border-box;
    border:2px solid color-mix(in srgb,var(--bg) 80%,transparent);
    box-shadow:0 2px 7px rgba(0,0,0,.45);transition:transform .13s var(--ease)}
  .m-pin:hover,.m-pin.m-on{transform:scale(1.45);z-index:5}
  .m-pin.m-on{box-shadow:0 0 0 3px color-mix(in srgb,var(--tx) 55%,transparent)}
  .m-spider-line{stroke:var(--line2);stroke-width:1;fill:none}

  /* tooltip */
  .maplibregl-popup{z-index:14}
  .maplibregl-popup-content{
    background:color-mix(in srgb,var(--card) 94%,transparent);color:var(--tx);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;
    box-shadow:var(--shadow);font-size:13px;max-width:240px
  }
  .maplibregl-popup-tip{border-top-color:color-mix(in srgb,var(--card) 94%,transparent)!important;
    border-bottom-color:color-mix(in srgb,var(--card) 94%,transparent)!important}
  .m-tipnm{font-weight:650;line-height:1.3}
  .m-tipwh{color:var(--mut);font-size:11.5px;margin-top:2px}
  .m-tipgo{color:var(--acc);font-size:11px;font-weight:600;margin-top:5px;display:block}

  /* attribution + status */
  .m-attrib{position:absolute;left:14px;bottom:12px;z-index:11;font-size:10.5px;color:var(--dim);
    background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(8px);
    padding:4px 9px;border-radius:8px;border:1px solid var(--line);max-width:min(560px,calc(100vw - 120px))}
  .m-attrib a{color:var(--mut);text-decoration:none}
  .m-attrib a:hover{color:var(--tx);text-decoration:underline}

  .m-status{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:20;
    padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);
    color:var(--mut);box-shadow:var(--shadow);pointer-events:none;
    opacity:0;transition:opacity .22s var(--ease)}
  .m-status.m-show{opacity:1}
  .m-status .m-spin{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px;
    border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .m-nowebgl{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:var(--bg)}

  .m-nowebgl .m-in{max-width:420px;text-align:center}

  /* mobile: the panel becomes a sheet */
  @media (max-width:860px){
    /* The panel becomes a bottom sheet. Its height and the tool rail's offset
       come from one variable so the rail can never end up sitting on top of the
       sheet — which is exactly what happened when they were set independently. */
    .m-stage{--sheet:40vh}
    .m-controls{top:10px;left:10px;right:10px;width:auto;padding:10px;gap:8px}
    /* One scrolling line rather than a wrapped block: on a phone the wrapped
       version ate 240px of chrome and left barely 120px of actual map. */
    .m-chips{flex-wrap:nowrap;max-height:none;overflow-x:auto;overflow-y:hidden;
      padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .m-chips::-webkit-scrollbar{display:none}
    .m-chiprow{margin-bottom:-2px}
    .m-panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:var(--sheet)}
    .m-panel.m-hidden{display:none}
    .m-tools{top:auto;bottom:calc(var(--sheet) + 20px);right:10px;
      flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 20px)}
    .m-toolsep{width:1px;height:26px;margin:6px 2px}
    .m-attrib{left:10px;bottom:calc(var(--sheet) + 74px);max-width:calc(100vw - 20px)}
    /* Collapsing the sheet gives the map back; every other element is offset
       from --sheet, so they all move with it. */
    .m-sheetbtn{display:grid}
    .m-stage.m-shut{--sheet:46px}
    .m-stage.m-shut .m-panel .m-body,
    .m-stage.m-shut .m-panel footer{display:none}
    .m-stage.m-shut .m-sheetbtn svg{transform:rotate(180deg)}
  }
  /* Short viewports need a smaller sheet or there is no map left to look at. */
  @media (max-width:860px) and (max-height:730px){
    .m-stage{--sheet:32vh}
  }
  @media (prefers-reduced-motion:reduce){.m-pin,.m-tool,.m-chip,.m-row{transition:none}.m-status .m-spin{animation:none}}
</style>

<header class="zoi-header" id="hdr"><div class="wrap zoi-bar">
  <a class="zoi-brand" href="/" aria-label="Zoi home"><span class="zoi-seal">&#918;</span><b>Zoi</b></a>
  <nav class="zoi-nav" aria-label="Zoi"><a href="/explore" aria-current="page">Directory</a><a href="/community">Community</a><a href="/social">Business</a><a href="/tickets">Tickets</a><a href="/#marketplace">Marketplace</a></nav>
  <form class="zoi-search" role="search" action="/explore" method="get"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" name="q" placeholder="Search the Greek world&hellip;" aria-label="Search the Zoi directory" autocomplete="off"><button type="submit">Search</button></form>
  <div class="zoi-actions"><button class="theme-btn" id="themeBtn" title="Theme &mdash; dark / light / gold" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button><a class="btn btn-primary" id="zoiCta" href="/social">Start free</a></div>
</div></header>

<main class="m-stage" id="stage">
  <div id="map" tabindex="0" role="application" aria-label="Map of the Greek world"></div>

  <section class="m-pane m-controls" aria-label="Map filters">
    <div class="m-searchrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, city or category…" autocomplete="off" aria-label="Filter places on the map">
      <button class="m-clearq" id="clearq" hidden aria-label="Clear search">&times;</button>
    </div>
    <div class="m-chiprow">
      <span class="m-lbl" id="chipcount">Categories</span>
      <button class="m-linkish" id="allon">All</button>

    <div class="m-chips" id="chips" role="group" aria-label="Filter by category"></div>
  </section>

  <aside class="m-pane m-panel" id="panel" aria-label="Places">
    <header>
      <h2 id="ptitle">Loading…<span class="m-sub" id="psub">reading the directory</span></h2>
      <button class="m-sheetbtn m-xbtn" id="psheet" aria-label="Collapse the list" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <button class="m-xbtn" id="pclose" hidden aria-label="Back to all results">&times;</button>
    </header>
    <div class="m-body" id="pbody"></div>
    <footer id="pfoot"></footer>
  </aside>

  <div class="m-pane m-tools" role="group" aria-label="Map view">
    <button class="m-tool" id="tGlobe" aria-pressed="true" title="Globe view">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></svg>
    </button>
    <button class="m-tool" id="tTerrain" aria-pressed="false" title="Terrain and 3D buildings">
      <svg viewBox="0 0 24 24"><path d="M2 19h20L14.5 6 10 13l-2.5-3z"/></svg>
    </button>
    <button class="m-tool" id="tGreek" aria-pressed="false" title="Greek place names">
      <span class="m-txt">Ελ</span>
    </button>
    <div class="m-toolsep"></div>
    <button class="m-tool" id="tNear" title="Find places near me">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
    </button>
    <button class="m-tool" id="tShare" title="Copy a link to this view">
      <svg viewBox="0 0 24 24"><path d="M9 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M15 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    </button>
    <button class="m-tool" id="tReset" title="Back to the whole world">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
    </button>
  </div>

  <div class="m-attrib" id="attrib"></div>
  <div class="m-status" id="status" role="status" aria-live="polite"></div>

  <div class="m-nowebgl" id="nowebgl" hidden>
    <div class="m-in">
      <h2 style="font-family:Fraunces,serif;margin:0 0 8px">Your browser can't run the map</h2>
      <p class="muted" style="font-size:14px;line-height:1.6">
        This map needs WebGL. Everything is still browsable as a list — the
        panel on the right works, and <a href="/explore">Explore</a> has the
        full directory.
      </p>
    </div>
  </div>
</main>

<script>
/* =====================================================================
 * The Zoi world map.
 *
 * MapLibre GL, our own basemap style (assets/zoi-basemap.js), and the
 * directory's coordinates as a clustered GeoJSON source.
 *
 * Two things about the data shape drive most of the design here:
 *
 *  1. A large share of listings are positioned at their CITY, not their street
 *     door, because that is the precision the source data carries. So many
 *     points share an identical coordinate. Clustering alone cannot separate
 *     them — no zoom level ever will — so coincident points are spiderfied into
 *     a ring, and the panel always lists what is under the pin.
 *
 *  2. Precision is stated, never implied. A pin placed at a city centroid says
 *     so when you open it.
 * ===================================================================== */
(function () {
  'use strict';
  var C = window.ZoiCore, MB = window.maplibregl, BM = window.ZoiBasemap;

  /* ---------- categories, in the emblem wheel's order ---------- */
  var TYPES = [
    { k: 'business',     label: 'Businesses' },
    { k: 'vendor',       label: 'Vendors' },
    { k: 'event',        label: 'Events' },
    { k: 'artist',       label: 'Artists' },
    { k: 'creator',      label: 'Creators' },
    { k: 'venue',        label: 'Venues' },
    { k: 'church',       label: 'Parishes' },
    { k: 'school',       label: 'Schools' },
    { k: 'professional', label: 'Professionals' },
    { k: 'travel_place', label: 'Places' },
    { k: 'sports',       label: 'Sports' },
    { k: 'organization', label: 'Associations' }
  ];
  var IDX = {}; TYPES.forEach(function (t, i) { IDX[t.k] = i; });

  /* Colours come from the same wheel the emblems use, so a pin and the card it
     opens are never a different colour. Recomputed whenever the theme flips. */
  var COLOURS = [];
  function readColours() {
    var W = ['--gold', '--red', '--acc', '--green'];
    var cs = getComputedStyle(document.documentElement);
    var anchors = W.map(function (k) { return (cs.getPropertyValue(k) || '').trim() || '#d9b26a'; });
    COLOURS = TYPES.map(function (t, slot) {
      var seg = Math.floor(slot / 3) % 4, step = slot % 3;
      var a = anchors[seg], b = anchors[(seg + 1) % 4];
      if (step === 0) return a;
      return BM.mix(a, b, step === 1 ? 0.33 : 0.67);
    });
  }
  readColours();

  /* ---------- tiny helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
    });
  }
  function typeSlug(t) { return t === 'travel_place' ? 'travel-place' : t; }
  function href(p) { return '/' + typeSlug(p.t) + '/' + encodeURIComponent(p.s); }
  function nice(s) {
    return String(s || '').replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function fmtN(n) { return n.toLocaleString(); }
  function km(d) { return d < 1 ? Math.round(d * 1000) + ' m' : (d < 20 ? d.toFixed(1) : Math.round(d)) + ' km'; }
  function haversine(a, b, c, d) {
    var R = 6371, r = Math.PI / 180;
    var dLa = (c - a) * r, dLo = (d - b) * r;
    var h = Math.sin(dLa / 2) * Math.sin(dLa / 2) +
      Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  var statusT;
  function status(msg, spin, ms) {
    var el = $('status');
    if (!msg) { el.classList.remove('m-show'); return; }
    el.innerHTML = (spin ? '<span class="m-spin"></span>' : '') + esc(msg);
    el.classList.add('m-show');
    clearTimeout(statusT);
    if (ms) statusT = setTimeout(function () { el.classList.remove('m-show'); }, ms);
  }

  /* ---------- state ---------- */
  var ALL = [];                       // every place with a coordinate
  var on = {};                        // active category filters
  TYPES.forEach(function (t) { on[t.k] = true; });
  var query = '';
  var here = null;                    // {lat,lng} once geolocated
  var selected = null;
  var map = null, ready = false;
  var clusterMarkers = {}, pinMarkers = {}, spider = [];

  /* ---------- URL state ----------
   * #zoom/lat/lng/bearing/pitch, filters in the query string. Every view is a
   * link somebody can send.
   */
  function readUrl() {
    var out = { view: null };
    var h = (location.hash || '').replace(/^#\/?/, '');
    var m = h.split('/').map(Number);
    if (m.length >= 3 && m.every(function (n) { return isFinite(n); })) {
      out.view = { zoom: m[0], center: [m[2], m[1]], bearing: m[3] || 0, pitch: m[4] || 0 };
    }
    var p = new URLSearchParams(location.search);
    if (p.get('q')) { query = p.get('q'); $('q').value = query; }
    var t = p.get('t');
    if (t) {
      TYPES.forEach(function (x) { on[x.k] = false; });
      t.split(',').forEach(function (k) { if (k in on) on[k] = true; });
      if (!TYPES.some(function (x) { return on[x.k]; })) TYPES.forEach(function (x) { on[x.k] = true; });
    }
    return out;
  }
  var urlT;
  function writeUrl() {
    clearTimeout(urlT);
    urlT = setTimeout(function () {
      if (!map) return;
      var c = map.getCenter();
      var hash = '#' + [map.getZoom().toFixed(2), c.lat.toFixed(5), c.lng.toFixed(5),
        Math.round(map.getBearing()), Math.round(map.getPitch())].join('/');
      var p = new URLSearchParams();
      if (query) p.set('q', query);
      var offCount = TYPES.filter(function (t) { return !on[t.k]; }).length;
      if (offCount) p.set('t', TYPES.filter(function (t) { return on[t.k]; }).map(function (t) { return t.k; }).join(','));
      var qs = p.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + hash);
    }, 260);
  }

  /* ---------- data ---------- */
  function matches(p) {
    if (!on[p.t]) return false;
    if (!query) return true;
    return p.hay.indexOf(query.toLowerCase()) !== -1;
  }
  function toGeoJSON(list) {
    return {
      type: 'FeatureCollection',
      features: list.map(function (p, i) {
        return {
          type: 'Feature', id: i,
          geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
          properties: { i: p.i, ti: IDX[p.t] == null ? 0 : IDX[p.t] }
        };
      })
    };
  }

  async function loadData() {
    status('Reading the directory…', true);
    var offsets = [];
    for (var o = 0; o < 12000; o += 1000) offsets.push(o);
    var pages = await Promise.all(offsets.map(function (off) {
      return C.api.rpc('explore_geo', { p_limit: 1000, p_offset: off }, { auth: 'anon' })
        .catch(function () { return []; });
    }));
    var seen = Object.create(null), out = [];
    pages.forEach(function (page) {
      (page || []).forEach(function (r) {
        if (!r || r.lat == null || r.lng == null) return;
        if (seen[r.slug]) return;
        seen[r.slug] = 1;
        var p = {
          i: out.length, s: r.slug, n: r.name, t: r.entity_type || 'business',
          city: r.city, country: r.country, cat: r.category_slug,
          lat: +r.lat, lng: +r.lng
        };
        p.hay = ((p.n || '') + ' ' + (p.city || '') + ' ' + (p.country || '') + ' ' +
                 nice(p.cat) + ' ' + (p.t || '')).toLowerCase();
        out.push(p);
      });
    });
    ALL = out;

    /* Exact-duplicate coordinates are the defining feature of this dataset, so
       they are indexed up front rather than discovered on every click. */
    var at = Object.create(null);
    ALL.forEach(function (p) {
      var k = p.lat.toFixed(5) + ',' + p.lng.toFixed(5);
      (at[k] || (at[k] = [])).push(p);
    });
    ALL.forEach(function (p) {
      p.co = at[p.lat.toFixed(5) + ',' + p.lng.toFixed(5)];
      p.approx = p.co.length > 2;   // a shared coordinate is a city centroid
    });
    status('', false);
    return out;
  }

  /* ---------- chips ---------- */
  function buildChips() {
    var counts = {};
    ALL.forEach(function (p) { counts[p.t] = (counts[p.t] || 0) + 1; });
    var box = $('chips');
    box.innerHTML = '';
    TYPES.forEach(function (t, i) {
      if (!counts[t.k]) return;
      var b = document.createElement('button');
      b.className = 'm-chip';
      b.type = 'button';
      b.style.color = COLOURS[i];
      b.setAttribute('aria-pressed', on[t.k] ? 'true' : 'false');
      b.dataset.k = t.k;
      if (!on[t.k]) b.dataset.off = '1';
      b.innerHTML = '<span class="m-dot"></span>' + esc(t.label) +
        ' <span class="m-n">' + fmtN(counts[t.k]) + '</span>';
      b.addEventListener('click', function (e) {
        // Alt-click isolates one category — much faster than turning 11 off.
        if (e.altKey || e.metaKey) {
          var only = TYPES.every(function (x) { return x.k === t.k ? on[x.k] : !on[x.k]; });
          TYPES.forEach(function (x) { on[x.k] = only ? true : x.k === t.k; });
        } else on[t.k] = !on[t.k];
        if (!TYPES.some(function (x) { return on[x.k]; })) TYPES.forEach(function (x) { on[x.k] = true; });
        syncChips(); refresh(); writeUrl();
      });
      box.appendChild(b);
    });
    syncChips();
  }
  function syncChips() {
    Array.prototype.forEach.call($('chips').children, function (b) {
      var v = on[b.dataset.k];
      b.setAttribute('aria-pressed', v ? 'true' : 'false');
      if (v) delete b.dataset.off; else b.dataset.off = '1';
    });
    var n = TYPES.filter(function (t) { return on[t.k]; }).length;
    $('chipcount').textContent = n === TYPES.length ? 'Categories' : n + ' of ' + TYPES.length + ' shown';
  }

  /* ---------- clusters as composition rings ----------
   * A cluster is drawn as a ring whose arcs are its actual category mix. It
   * costs one small SVG per on-screen cluster (tens, not thousands) and it
   * turns a count into a shape you can read at a glance: gold-heavy is
   * commerce, blue-heavy is parishes and schools.
   */
  function ringSVG(counts, total) {
    var r = total <= 1 ? 9 : Math.min(26, 11 + Math.sqrt(total) * 0.95);
    var sw = Math.max(3.5, r * 0.30);
    var rr = r - sw / 2;
    var circ = 2 * Math.PI * rr;
    var parts = [], acc = 0;
    for (var i = 0; i < counts.length; i++) {
      if (!counts[i]) continue;
      var frac = counts[i] / total;
      var len = frac * circ;
      parts.push('<circle class="m-ring" cx="0" cy="0" r="' + rr.toFixed(2) + '" fill="none" stroke="' +
        COLOURS[i] + '" stroke-width="' + sw.toFixed(2) + '" stroke-linecap="butt" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-acc * circ).toFixed(2) + '" transform="rotate(-90)"/>');
      acc += frac;
    }
    var d = (r + sw) * 2;
    return '<svg width="' + d + '" height="' + d + '" viewBox="' +
      (-d / 2) + ' ' + (-d / 2) + ' ' + d + ' ' + d + '">' +
      '<circle cx="0" cy="0" r="' + (rr + sw / 2 + 1).toFixed(2) + '" fill="var(--bg)" opacity=".55"/>' +
      parts.join('') +
      '<text class="m-cnt" x="0" y="0" text-anchor="middle" dominant-baseline="central">' +
      (total > 999 ? (total / 1000).toFixed(1).replace('.0', '') + 'k' : total) + '</text></svg>';
  }

  /**
   * Draw the markers for whatever the source currently has on screen.
   *
   * The unclustered half of this is not the obvious loop, because of how the
   * data is shaped: hundreds of listings share one exact coordinate (their city
   * centroid). Once clustering disengages above clusterMaxZoom they would all
   * land on the same pixel — 197 parishes and tavernas stacked into what looks
   * like a single dot, with only the top one clickable. So coincident points are
   * bucketed by coordinate and fanned out, and a bucket too large to fan becomes
   * a counted stack you can open.
   */
  function renderClusters() {
    if (!ready || !map.getSource('places')) return;
    var src = map.getSource('places');
    var feats = map.querySourceFeatures('places');
    var keep = {};
    var buckets = Object.create(null);

    feats.forEach(function (f) {
      var pr = f.properties;
      if (!pr.cluster) {
        var p = ALL[pr.i];
        if (!p) return;
        var key = p.lat.toFixed(5) + ',' + p.lng.toFixed(5);
        var b = buckets[key] || (buckets[key] = { lngLat: [p.lng, p.lat], items: [], seen: {} });
        // querySourceFeatures can hand back the same feature from two tiles
        if (b.seen[p.i]) return;
        b.seen[p.i] = 1;
        b.items.push(p);
        return;
      }
      var cid = 'c' + pr.cluster_id;
      keep[cid] = 1;
      if (clusterMarkers[cid]) return;
      var counts = [];
      for (var i = 0; i < TYPES.length; i++) counts.push(pr['t' + i] || 0);
      var el2 = document.createElement('div');
      el2.className = 'm-cl';
      el2.innerHTML = ringSVG(counts, pr.point_count);
      el2.setAttribute('role', 'button');
      el2.setAttribute('tabindex', '0');
      el2.setAttribute('aria-label', pr.point_count + ' places — open');
      var lngLat = f.geometry.coordinates.slice();
      function listLeaves() {
        // Zooming will not separate these; they share a coordinate.
        src.getClusterLeaves(pr.cluster_id, 500, 0).then(function (leaves) {
          var group = (leaves || []).map(function (l) { return ALL[l.properties.i]; }).filter(Boolean);
          if (group.length) showList(group, group.length + ' here', groupWhere(group), lngLat);
        }, function () {});
      }
      function openCluster() {
        var cur = map.getZoom();
        src.getClusterExpansionZoom(pr.cluster_id).then(function (z) {
          if (!isFinite(z) || z <= cur + 0.05 || cur > 15.5) { listLeaves(); return; }
          map.easeTo({ center: lngLat, zoom: Math.min(z + 0.3, 16.5), duration: 620 });
        }, listLeaves);
      }
      el2.addEventListener('click', openCluster);
      el2.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCluster(); }
      });
      clusterMarkers[cid] = new MB.Marker({ element: el2 }).setLngLat(lngLat).addTo(map);
    });

    /* Two different city centroids can land a few pixels apart — Omonia and
       Athens-centre did exactly that, drawing a "158" ring on top of a "7" ring
       so neither could be read or clicked. Exact-coordinate buckets are merged
       when they are closer than MERGE_PX on screen. Largest-first and
       deterministic, so the grouping does not flicker while panning. */
    buckets = mergeNearby(buckets);

    /* ---- the unclustered buckets ---- */
    Object.keys(buckets).forEach(function (key) {
      var b = buckets[key];
      var n = b.items.length;

      if (n === 1) {
        var p = b.items[0];
        var id = 'p' + p.i;
        keep[id] = 1;
        if (!pinMarkers[id]) pinMarkers[id] = makePin(p, b.lngLat, null);
        return;
      }

      if (n <= FAN_MAX) {
        // Fan them around their shared point. The marker keeps the true
        // coordinate and only carries a pixel offset, so the fan tracks
        // correctly through pan, zoom, rotate and pitch.
        b.items.forEach(function (p, j) {
          var id = 'f' + key + ':' + n + ':' + p.i;
          keep[id] = 1;
          if (pinMarkers[id]) return;
          var a = (j / n) * Math.PI * 2 - Math.PI / 2;
          var rad = n <= 6 ? 21 : 21 + (j % 2) * 15;
          pinMarkers[id] = makePin(p, b.lngLat, [Math.cos(a) * rad, Math.sin(a) * rad]);
        });
        return;
      }

      // Too many to fan legibly. One counted stack, click to open the list.
      var sid = 's' + key + ':' + n;
      keep[sid] = 1;
      if (pinMarkers[sid]) return;
      var counts = TYPES.map(function () { return 0; });
      b.items.forEach(function (p) { counts[IDX[p.t] || 0]++; });
      var el = document.createElement('div');
      el.className = 'm-cl';
      el.innerHTML = ringSVG(counts, n);
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', n + ' places at this address — open');
      var items = b.items.slice(), ll = b.lngLat;
      function open() { showList(items, n + ' here', groupWhere(items), ll); }
      el.addEventListener('click', function (e) { e.stopPropagation(); open(); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
      pinMarkers[sid] = new MB.Marker({ element: el }).setLngLat(ll).addTo(map);
    });

    Object.keys(clusterMarkers).forEach(function (k) {
      if (!keep[k]) { clusterMarkers[k].remove(); delete clusterMarkers[k]; }
    });
    Object.keys(pinMarkers).forEach(function (k) {
      if (!keep[k]) { pinMarkers[k].remove(); delete pinMarkers[k]; }
    });
  }

  /** Above this many listings on one spot, a fan stops being readable. */
  var FAN_MAX = 12;
  /** Two marker stacks closer than this on screen are drawn as one. */
  var MERGE_PX = 46;

  function mergeNearby(buckets) {
    var keys = Object.keys(buckets);
    if (keys.length < 2) return buckets;
    // biggest first, then by key, so the result never depends on iteration order
    keys.sort(function (a, b) {
      var d = buckets[b].items.length - buckets[a].items.length;
      return d || (a < b ? -1 : 1);
    });
    var pts = {};
    keys.forEach(function (k) { pts[k] = map.project(buckets[k].lngLat); });
    var out = {}, taken = [];
    keys.forEach(function (k) {
      var p = pts[k];
      for (var i = 0; i < taken.length; i++) {
        var t = taken[i], q = pts[t];
        if (Math.abs(p.x - q.x) < MERGE_PX && Math.abs(p.y - q.y) < MERGE_PX) {
          // fold into the bigger stack; it keeps its own anchor coordinate
          var host = out[t];
          for (var j = 0; j < buckets[k].items.length; j++) host.items.push(buckets[k].items[j]);
          host.merged = true;
          return;
        }
      }
      taken.push(k);
      out[k] = { lngLat: buckets[k].lngLat, items: buckets[k].items.slice() };
    });
    return out;
  }

  function makePin(p, lngLat, offset) {
    var el = document.createElement('div');
    el.className = 'm-pin';
    el.style.background = COLOURS[IDX[p.t] || 0];
    el.title = p.n || '';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', p.n || 'place');
    el.addEventListener('click', function (ev) { ev.stopPropagation(); choose(p, true); });
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); choose(p, true); }
    });
    el.addEventListener('mouseenter', function () { tip(p, lngLat); });
    el.addEventListener('mouseleave', hideTip);
    var opts = { element: el };
    if (offset) opts.offset = offset;
    return new MB.Marker(opts).setLngLat(lngLat).addTo(map);
  }

  function groupWhere(group) {
    var c = {}, best = '', n = 0;
    group.forEach(function (p) { var k = p.city || ''; c[k] = (c[k] || 0) + 1; if (c[k] > n) { n = c[k]; best = k; } });
    var country = (group[0] && group[0].country) || '';
    return [best, country].filter(Boolean).join(', ') || (group.length + ' places');
  }

  /* ---------- spiderfy ----------
   * When several listings share one coordinate, offset their markers around a
   * ring so each is individually hoverable and clickable. The markers stay
   * anchored to the true coordinate; only the pixel offset changes, so they
   * track correctly through pan, zoom, rotate and tilt.
   */
  function clearSpider() {
    spider.forEach(function (m) { m.remove(); });
    spider = [];
  }
  function spiderfy(group, lngLat) {
    clearSpider();
    if (group.length < 2) return;
    var n = Math.min(group.length, 28);
    var rings = n <= 8 ? 1 : n <= 18 ? 2 : 3;
    var idx = 0;
    for (var ring = 0; ring < rings; ring++) {
      var cap = Math.ceil(n / rings);
      var count = Math.min(cap, n - idx);
      var rad = 26 + ring * 24;
      for (var j = 0; j < count; j++, idx++) {
        var p = group[idx];
        var a = (j / count) * Math.PI * 2 - Math.PI / 2 + (ring * 0.4);
        var el = document.createElement('div');
        el.className = 'm-pin';
        el.style.background = COLOURS[IDX[p.t] || 0];
        el.title = p.n || '';
        (function (pp) {
          el.addEventListener('click', function (e) { e.stopPropagation(); choose(pp, true); });
          el.addEventListener('mouseenter', function () { tip(pp, lngLat); });
          el.addEventListener('mouseleave', hideTip);
        })(p);
        spider.push(new MB.Marker({ element: el, offset: [Math.cos(a) * rad, Math.sin(a) * rad] })
          .setLngLat(lngLat).addTo(map));
      }
    }
  }

  /* ---------- popup ---------- */
  var pop = new MB.Popup({ closeButton: false, closeOnClick: false, offset: 14, maxWidth: '250px' });
  function tip(p, lngLat) {
    pop.setLngLat(lngLat).setHTML(
      '<div class="m-tipnm">' + esc(p.n) + '</div>' +
      '<div class="m-tipwh">' + esc(nice(p.cat)) + (p.city ? ' · ' + esc(p.city) : '') + '</div>' +
      '<span class="m-tipgo">Open listing →</span>'
    ).addTo(map);
  }
  function hideTip() { pop.remove(); }

  /* ---------- the panel ---------- */
  function rowHTML(p) {
    var i = IDX[p.t] || 0;
    var initial = (p.n || '?').trim().charAt(0).toUpperCase();
    var d = here ? haversine(here.lat, here.lng, p.lat, p.lng) : null;
    return '<a class="m-row" href="' + href(p) + '" data-i="' + p.i + '">' +
      '<span class="m-mark" style="background:' + COLOURS[i] + '">' + esc(initial) + '</span>' +
      '<span class="m-meta"><span class="m-nm">' + esc(p.n) + '</span>' +
      '<span class="m-wh">' + esc(nice(p.cat)) + (p.city ? ' · ' + esc(p.city) : '') + '</span>' +
      (d != null ? '<span class="m-km">' + km(d) + ' away</span>' : '') +
      '</span></a>';
  }

  var listState = { items: [], shown: 0, mode: 'all' };
  function paint(reset) {
    var body = $('pbody');
    if (reset) { body.innerHTML = ''; listState.shown = 0; }
    var slice = listState.items.slice(listState.shown, listState.shown + 60);
    if (!slice.length && !listState.shown) {
      body.innerHTML = '<div class="m-empty">Nothing here yet.<br>' +
        (query ? 'Try a different search, or ' : '') + 'zoom out to see more.</div>';
      return;
    }
    var frag = document.createElement('div');
    frag.innerHTML = slice.map(rowHTML).join('');
    while (frag.firstChild) body.appendChild(frag.firstChild);
    listState.shown += slice.length;
  }
  $('pbody').addEventListener('scroll', function () {
    var b = $('pbody');
    if (b.scrollTop + b.clientHeight > b.scrollHeight - 240 && listState.shown < listState.items.length) paint(false);
  });
  $('pbody').addEventListener('mouseover', function (e) {
    var a = e.target.closest && e.target.closest('.m-row');
    if (!a) return;
    var p = ALL[+a.dataset.i];
    if (p) tip(p, [p.lng, p.lat]);
  });
  $('pbody').addEventListener('mouseout', hideTip);

  function showList(items, title, sub, lngLat) {
    listState = { items: items, shown: 0, mode: 'group' };
    $('ptitle').innerHTML = esc(title) + '<span class="m-sub">' + esc(sub) + '</span>';
    $('pclose').hidden = false;
    $('panel').classList.remove('m-hidden');
    paint(true);
    var approx = items.length > 2 && items[0] && items[0].approx;
    $('pfoot').innerHTML = fmtN(items.length) + ' place' + (items.length === 1 ? '' : 's') +
      (approx ? ' · positioned at the city, not the street address' : '');
    if (lngLat) spiderfy(items, lngLat);
  }

  function showAll() {
    clearSpider();
    selected = null;
    var vis = ALL.filter(matches);
    // nearest-first once we know where the user is, otherwise centre-out
    var c = map ? map.getCenter() : { lat: 37.98, lng: 23.72 };
    var o = here || c;
    vis.sort(function (a, b) {
      return haversine(o.lat, o.lng, a.lat, a.lng) - haversine(o.lat, o.lng, b.lat, b.lng);
    });
    listState = { items: vis, shown: 0, mode: 'all' };
    $('ptitle').innerHTML = (here ? 'Nearest to you' : 'On the map') +
      '<span class="m-sub">' + (vis.length === ALL.length
        ? fmtN(vis.length) + ' places'
        : fmtN(vis.length) + ' of ' + fmtN(ALL.length) + ' shown') + '</span>';
    $('pclose').hidden = true;
    paint(true);
    $('pfoot').innerHTML = coverageNote();
  }

  var totalListings = null;
  function coverageNote() {
    if (totalListings && totalListings > ALL.length) {
      return fmtN(ALL.length) + ' of ' + fmtN(totalListings) +
        ' listings have coordinates. The rest are in <a href="/explore">Explore</a>.';
    }
    return fmtN(ALL.length) + ' listings mapped.';
  }

  function choose(p, keepSpider) {
    selected = p;
    if (!keepSpider) clearSpider();
    hideTip();
    var group = p.co && p.co.length > 1 ? p.co.filter(matches) : [p];
    if (group.length > 1) {
      showList(group, group.length + ' here', groupWhere(group), [p.lng, p.lat]);
    } else {
      showList([p], p.n, [nice(p.cat), p.city, p.country].filter(Boolean).join(' · '), null);
    }
    map.easeTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 12), duration: 620 });
  }

  $('pclose').addEventListener('click', function () { showAll(); writeUrl(); });

  // Collapse the bottom sheet on small screens. Everything else is positioned
  // from --sheet, so the tool rail and attribution follow it up and down.
  $('psheet').addEventListener('click', function () {
    var shut = $('stage').classList.toggle('m-shut');
    this.setAttribute('aria-expanded', shut ? 'false' : 'true');
    this.setAttribute('aria-label', shut ? 'Show the list' : 'Collapse the list');
    if (map) setTimeout(function () { map.resize(); }, 220);
  });

  /* ---------- filtering ---------- */
  var refreshT;
  function refresh() {
    clearTimeout(refreshT);
    refreshT = setTimeout(function () {
      if (!ready) return;
      clearSpider();
      currentData = toGeoJSON(ALL.filter(matches));
      map.getSource('places').setData(currentData);
      Object.keys(clusterMarkers).forEach(function (k) { clusterMarkers[k].remove(); });
      Object.keys(pinMarkers).forEach(function (k) { pinMarkers[k].remove(); });
      clusterMarkers = {}; pinMarkers = {};
      if (listState.mode === 'all') showAll();
    }, 90);
  }

  $('q').addEventListener('input', function () {
    query = this.value.trim();
    $('clearq').hidden = !query;
    refresh(); writeUrl();
  });
  $('clearq').addEventListener('click', function () {
    query = ''; $('q').value = ''; this.hidden = true; refresh(); writeUrl(); $('q').focus();
  });
  $('allon').addEventListener('click', function () {
    TYPES.forEach(function (t) { on[t.k] = true; });
    syncChips(); refresh(); writeUrl();
  });

  /* ---------- style / theme ---------- */
  var pref = { greek: false, terrain: false };
  function styleOpts() {
    return {
      theme: (document.documentElement.getAttribute('data-theme') || 'dark'),
      greek: pref.greek,
      terrain: pref.terrain
    };
  }
  function reskin() {
    if (!map) return;
    readColours();
    map.setStyle(BM.style(styleOpts()), { diff: false });
    map.once('styledata', function () {
      addDataLayers(currentData);
      if (pref.terrain) map.setTerrain({ source: 'dem', exaggeration: 1.1 });
      buildChips();
    });
  }

  /* ---------- data layers ----------
   * Points live in a clustered GeoJSON source. clusterProperties accumulates a
   * per-category count so a cluster knows its own composition without us having
   * to re-scan the leaves on every frame.
   */
  function clusterProps() {
    var cp = {};
    TYPES.forEach(function (t, i) {
      cp['t' + i] = ['+', ['case', ['==', ['get', 'ti'], i], 1, 0]];
    });
    return cp;
  }
  var currentData = null;
  function addDataLayers(data) {
    if (map.getSource('places')) return;
    currentData = data || toGeoJSON(ALL.filter(matches));
    map.addSource('places', {
      type: 'geojson',
      data: currentData,
      cluster: true,
      clusterRadius: 54,
      clusterMaxZoom: 14,
      clusterProperties: clusterProps()
    });
    // An invisible circle layer is what makes querySourceFeatures() return
    // rendered features; the visible marks are DOM markers drawn from it.
    map.addLayer({
      id: 'places-probe', type: 'circle', source: 'places',
      paint: { 'circle-radius': 1, 'circle-opacity': 0 }
    });
    renderClusters();
  }

  /* ---------- build the map ---------- */
  function boot(initial) {
    var start = initial.view || { center: [23.7275, 37.9838], zoom: 1.35, bearing: 0, pitch: 0 };
    map = new MB.Map({
      container: 'map',
      style: BM.style(styleOpts()),
      center: start.center,
      zoom: start.zoom,
      bearing: start.bearing || 0,
      pitch: start.pitch || 0,
      maxZoom: 18.5,
      minZoom: 0.6,
      attributionControl: false,
      hash: false,
      cooperativeGestures: false,
      dragRotate: true,
      pitchWithRotate: true
    });
    window.zoiMap = map;

    map.addControl(new MB.NavigationControl({ visualizePitch: true, showZoom: true, showCompass: true }), 'bottom-left');
    map.addControl(new MB.ScaleControl({ maxWidth: 92, unit: 'metric' }), 'bottom-left');

    $('attrib').innerHTML = BM.ATTRIBUTION;

    map.on('load', function () {
      ready = true;
      addDataLayers(null);
      showAll();
      status('', false);
    });
    map.on('render', function () {
      // querySourceFeatures only returns anything meaningful once the source
      // has settled; calling it mid-load churns markers for nothing.
      if (map.isSourceLoaded('places')) renderClusters();
    });
    map.on('moveend', function () { writeUrl(); if (listState.mode === 'all') showAll(); });
    map.on('click', function () { hideTip(); });
    map.on('error', function (e) {
      // A missing tile is normal at the edges of coverage and must not shout.
      if (e && e.error && /tile|404/i.test(String(e.error.message || ''))) return;
      console.warn('[map]', e && e.error);
    });
  }

  /* ---------- tools ---------- */
  $('tGlobe').addEventListener('click', function () {
    var globe = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', globe ? 'true' : 'false');
    map.setProjection(globe
      ? { type: ['interpolate', ['linear'], ['zoom'], 3, 'vertical-perspective', 6, 'mercator'] }
      : { type: 'mercator' });
    if (globe && map.getZoom() > 4) map.easeTo({ zoom: 2.2, pitch: 0, duration: 900 });
  });

  $('tTerrain').addEventListener('click', function () {
    pref.terrain = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', pref.terrain ? 'true' : 'false');
    if (pref.terrain) {
      if (!map.getSource('dem')) {
        map.addSource('dem', {
          type: 'raster-dem', tiles: [BM.DEM], encoding: 'terrarium',
          tileSize: 256, maxzoom: 13
        });
      }
      map.setTerrain({ source: 'dem', exaggeration: 1.1 });
      map.easeTo({ pitch: Math.max(map.getPitch(), 52), duration: 900 });
      status('Terrain on — drag with right button to tilt', false, 3600);
    } else {
      map.setTerrain(null);
      map.easeTo({ pitch: 0, duration: 700 });
    }
  });

  $('tGreek').addEventListener('click', function () {
    pref.greek = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', pref.greek ? 'true' : 'false');
    // Only the label layers change, so patch them in place — a full setStyle
    // would throw away tiles we already have.
    var NF = pref.greek
      ? ['coalesce', ['get', 'name:el'], ['get', 'name:latin'], ['get', 'name']]
      : ['coalesce', ['get', 'name'], ['get', 'name:latin'], ['get', 'name:el']];
    map.getStyle().layers.forEach(function (l) {
      if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
        try { map.setLayoutProperty(l.id, 'text-field', NF); } catch (e) {}
      }
    });
    status(pref.greek ? 'Greek place names' : 'Local place names', false, 2200);
  });

  $('tNear').addEventListener('click', function () {
    if (!navigator.geolocation) { status('Your browser will not share a location', false, 3000); return; }
    status('Finding you…', true);
    navigator.geolocation.getCurrentPosition(function (pos) {
      here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      status('', false);
      map.easeTo({ center: [here.lng, here.lat], zoom: 10.5, duration: 1400 });
      if (!map.getSource('me')) {
        map.addSource('me', { type: 'geojson', data: { type: 'Point', coordinates: [here.lng, here.lat] } });
        map.addLayer({
          id: 'me-halo', type: 'circle', source: 'me',
          paint: {
            'circle-radius': 16, 'circle-color': COLOURS[IDX.church],
            'circle-opacity': 0.16, 'circle-stroke-width': 1,
            'circle-stroke-color': COLOURS[IDX.church], 'circle-stroke-opacity': 0.4
          }
        });
        map.addLayer({
          id: 'me-dot', type: 'circle', source: 'me',
          paint: {
            'circle-radius': 5, 'circle-color': COLOURS[IDX.church],
            'circle-stroke-width': 2, 'circle-stroke-color': '#fff'
          }
        });
      } else {
        map.getSource('me').setData({ type: 'Point', coordinates: [here.lng, here.lat] });
      }
      showAll();
    }, function () {
      status('Could not get your location', false, 3200);
    }, { enableHighAccuracy: false, timeout: 9000, maximumAge: 300000 });
  });

  $('tShare').addEventListener('click', function () {
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { status('Link to this view copied', false, 2400); },
        function () { status(url, false, 5000); }
      );
    } else status(url, false, 5000);
  });

  $('tReset').addEventListener('click', function () {
    clearSpider();
    map.easeTo({ center: [23.7275, 37.9838], zoom: 1.35, pitch: 0, bearing: 0, duration: 1500 });
    showAll();
  });

  /* keyboard: / focuses search, Escape backs out */
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape') { hideTip(); clearSpider(); if (listState.mode !== 'all') showAll(); }
  });

  /* theme changes must repaint the basemap, not just the chrome */
  new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      if (muts[i].attributeName === 'data-theme') { reskin(); return; }
    }
  }).observe(document.documentElement, { attributes: true });

  /* ---------- go ---------- */
  (async function () {
    var initial = readUrl();

    // header height drives the stage inset; measure rather than assume
    var h = document.getElementById('hdr');
    if (h && h.firstElementChild) {
      document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
      new ResizeObserver(function () {
        document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
        if (map) map.resize();
      }).observe(h);
    }

    if (!MB || typeof MB.Map !== 'function') { $('nowebgl').hidden = false; return; }

    try { await loadData(); }
    catch (err) {
      $('ptitle').innerHTML = 'Could not load the map<span class="m-sub">the directory did not answer</span>';
      $('pbody').innerHTML = '<div class="m-empty">Try again in a moment, or browse <a href="/explore">Explore</a>.</div>';
      return;
    }

    buildChips();
    C.api.rpc('home_stats', {}, { auth: 'anon' }).then(function (s) {
      var r = Array.isArray(s) ? s[0] : s;
      totalListings = r && (r.listings || r.total_listings || r.n_listings) || null;
      if (listState.mode === 'all') $('pfoot').innerHTML = coverageNote();
    }).catch(function () {});

    try { boot(initial); }
    catch (err) {
      console.error(err);
      $('nowebgl').hidden = false;
      showAll();
    }
  })();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});</script>
</body>
