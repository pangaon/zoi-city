<!doctype html><html lang="en" data-theme="dark"><head><!-- zoi.city canonical flagship: Breath orbs (home) + live directory (behind) -->
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Ζωή — zoi.city · The Breath of the Greek World</title>
<meta name="description" content="Zoi — the agentic, self-tailoring home of the Greek world. Glass orbs lead to a verified directory of churches, tavernas, festivals, bakeries and businesses across the diaspora, plus today's name-day."/>

<meta name="color-scheme" content="dark light">

<style>
:root{
  /* bridged onto the shared design system — /assets/zoi-theme.css */
  /* inherited straight from the shared tokens: --mut, --gold, --green */
  --ink:var(--bg);
  --paper:var(--tx);
  --txt:var(--tx);
  --marble1:var(--card);
  --marble2:var(--card2);
  --gline:var(--line2);
  --gold2:var(--gold);
  --gold-d:var(--gold);
  --aeg:var(--acc);
  --sea:var(--acc);
  --pig:var(--red);
  --violet:var(--acc);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d406c;font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;background:linear-gradient(180deg,#4a90bd 0%,#226fa1 38%,#0e477a 72%,#0a3a64 100%)}
#bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;mix-blend-mode:soft-light}
#shimmer{position:fixed;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.6;background:radial-gradient(42% 30% at 26% 16%,rgba(255,255,255,.6),transparent 60%),radial-gradient(46% 34% at 78% 74%,rgba(255,255,255,.42),transparent 62%);animation:shim 18s var(--ease) infinite alternate}
@keyframes shim{from{transform:translate(0,0) scale(1)}to{transform:translate(-34px,22px) scale(1.08)}}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/></svg>")}
#vign{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 200px 30px rgba(6,30,55,.45)}
.word{position:fixed;top:calc(env(safe-area-inset-top) + 20px);left:0;right:0;text-align:center;z-index:6;pointer-events:none}
.word b{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:28px;letter-spacing:1px;color:#fff;text-shadow:0 3px 20px rgba(6,30,55,.5);font-variation-settings:'opsz'144}
.word span{display:block;font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold2);margin-top:5px;text-shadow:0 1px 8px rgba(6,30,55,.5)}
/* top controls */
.ctl{position:fixed;top:calc(env(safe-area-inset-top) + 18px);z-index:9;display:flex;gap:2px;padding:4px;border-radius:30px;background:rgba(255,255,255,.78);border:1px solid #fff;box-shadow:0 12px 28px -14px rgba(6,40,70,.6);transition:opacity .3s}
.ctl.hide{opacity:0;pointer-events:none}
.ctl.l{left:calc(env(safe-area-inset-left) + 16px)}.ctl.r{right:calc(env(safe-area-inset-right) + 16px)}
.ctl button{border:none;background:none;color:var(--mut);cursor:pointer;border-radius:24px;padding:9px 14px;min-height:44px;font:700 11px 'Hanken Grotesk';letter-spacing:.06em;transition:.25s;display:flex;align-items:center;gap:6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ctl button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.ctl button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2a06;box-shadow:0 6px 14px -6px rgba(184,137,59,.6)}
/* stage */
.stagewrap{position:fixed;inset:0;display:grid;place-items:center;z-index:4}
.stage{position:relative}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.13);pointer-events:none}
/* orb = bubble + label below */
.orb{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:44px;min-height:44px;contain:layout style;-webkit-user-select:none;user-select:none}
.orb:active .bubble,.orb.pressed .bubble{transform:scale(.94)!important;transition:transform .12s var(--ease)}
/* refined staggered intro reveal: orbs fade in, bubbles scale up from a hush */
.orb{opacity:0}
.orb.in{opacity:1;transition:opacity .7s var(--ease)}
.orb .bubble,.orb .olabel{transform-origin:center;transition:transform .8s var(--spring),box-shadow .35s,opacity .6s var(--ease)}
.orb:not(.in) .bubble{transform:scale(.55);opacity:.2}
.orb:not(.in) .olabel{opacity:0;transform:translateX(-50%) translateY(6px)}
.core{opacity:0;transition:opacity .8s var(--ease)}
.core.in{opacity:1}
.core:not(.in){transform:translate(-50%,-50%) scale(.82)}
@media(prefers-reduced-motion:reduce){.orb,.core{transition-duration:.01s}.orb .bubble,.orb .olabel{transition-duration:.01s}}
.bubble{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;position:relative;
 background:linear-gradient(155deg,var(--marble1),var(--marble2));border:1px solid #fff;
 box-shadow:0 20px 44px -16px rgba(6,40,70,.6),0 6px 14px -6px rgba(6,40,70,.4),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -10px 20px -10px rgba(10,77,140,.15);
 transition:transform .35s var(--spring),box-shadow .35s}
.orb:hover .bubble{transform:translateY(-3px);box-shadow:0 26px 54px -16px rgba(6,40,70,.7),0 0 0 2px var(--gold2),0 6px 14px -6px rgba(6,40,70,.4)}
.bubble .ico svg{stroke-width:1.7;fill:none}
.bubble .ring2{position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(10,77,140,.1)}
.olabel{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;pointer-events:none}
.olabel b{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:15px;color:#fff;text-shadow:0 2px 10px rgba(6,30,55,.7);display:block;line-height:1}
.olabel span{font-size:10px;color:var(--gold2);font-weight:600;text-shadow:0 1px 8px rgba(6,30,55,.7)}
.orb.dim{opacity:.4;filter:saturate(.8)}
.orb .done{position:absolute;top:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--green),#2f7d5c);display:none;place-items:center;box-shadow:0 6px 14px -6px rgba(10,60,40,.7);border:2px solid #fff}
.orb.answered .done{display:grid}
.orb .done svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3}
.orb.answered .bubble{box-shadow:0 20px 44px -16px rgba(6,40,70,.6),0 0 0 2px var(--gold2),inset 0 2px 0 rgba(255,255,255,.95)}
/* core */
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:5;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
 background:radial-gradient(circle at 50% 32%,#fff,#f3e7cb 70%,#eddcb6 100%);border:1px solid #fff;
 box-shadow:0 26px 64px -20px rgba(6,40,70,.7),0 0 60px -8px rgba(231,200,126,.55),inset 0 3px 0 rgba(255,255,255,.95),inset 0 -16px 30px -12px rgba(184,137,59,.25);
 transition:transform .5s var(--spring)}
.core:hover{transform:translate(-50%,-50%) scale(1.04)}
.core .halo{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(231,200,126,.5);animation:halo 3.6s var(--ease) infinite}
@keyframes halo{0%{transform:scale(.96);opacity:.6}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.wx{display:flex;align-items:center;gap:7px;color:var(--gold-d)}
.wx svg{width:20px;height:20px;stroke:#c79a4b;fill:none;stroke-width:1.7}
.wx b{font-family:'Fraunces';font-style:italic;font-weight:600;font-size:24px;color:#1a3b20;line-height:1}
.wxcity{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-top:3px}
.askpill{margin-top:9px;display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:30px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706;font:800 12px 'Hanken Grotesk';letter-spacing:.04em;box-shadow:0 10px 22px -8px rgba(184,137,59,.7)}
.askpill .pdot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pp 1.8s infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.core.onb .wx,.core.onb .wxcity,.core.onb .askpill{display:none}
.core .onbtitle,.core .onbprog{display:none}
.core.onb .onbtitle{display:block;font-family:'Fraunces';font-style:italic;font-weight:500;font-size:21px;color:#1a3b20;line-height:1.05;padding:0 14px}
.core.onb .onbprog{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-top:8px}
.core.builtdone .wxcity::after{content:" · ✦"}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font-size:11.5px;color:#dcebf4;z-index:5;text-shadow:0 1px 8px rgba(6,30,55,.6)}
/* pop-out (boxless, centered) */
.scrim{position:fixed;inset:0;z-index:18;background:radial-gradient(circle at 50% 42%,rgba(8,40,66,.28),rgba(7,32,54,.6));opacity:0;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:90px 20px 96px;pointer-events:none}
.pop>*{pointer-events:auto}
.pe{opacity:0;will-change:transform,opacity}
.pe.fl .pin{animation:flo 4.6s var(--ease) infinite}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.p-eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);text-shadow:0 2px 14px rgba(6,30,55,.6)}
.p-name{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:clamp(32px,8.5vw,58px);line-height:1;color:#fff;text-align:center;text-shadow:0 6px 34px rgba(6,30,55,.7);font-variation-settings:'opsz'144}
.p-sub{font-family:'Fraunces';font-style:italic;font-size:clamp(15px,4vw,19px);color:#dcebf4;text-align:center;text-shadow:0 3px 16px rgba(6,30,55,.6);margin-top:-2px}
.p-pills{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:min(94vw,540px)}
.p-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:30px;font-size:13.5px;font-weight:600;color:#0c2f4e;background:rgba(255,255,255,.92);border:1px solid #fff;box-shadow:0 14px 30px -16px rgba(6,40,70,.6),inset 0 1px 0 #fff;cursor:pointer;transition:transform .3s var(--spring),box-shadow .3s}
.p-pill:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(6,40,70,.7),0 0 0 2px var(--gold2)}
.p-pill .pd{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.p-pill.sel{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706}
.p-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.p-act{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:30px;font:800 14px 'Hanken Grotesk';cursor:pointer;border:none;box-shadow:0 20px 42px -16px rgba(6,40,70,.55);transition:transform .3s var(--spring),filter .3s}
.p-act:hover{transform:translateY(-2px);filter:brightness(1.05)}
.p-act.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706;box-shadow:0 22px 46px -16px rgba(184,137,59,.65)}
.p-act.glass{background:rgba(255,255,255,.9);color:#0c2f4e;border:1px solid #fff}
.p-search{width:min(86vw,440px);background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:16px;color:#0c2f4e;padding:14px 16px;font:500 16px 'Hanken Grotesk';outline:none;box-shadow:0 16px 34px -18px rgba(6,40,70,.6)}
.p-search::placeholder{color:#7d97a8}
.p-x{position:fixed;top:calc(env(safe-area-inset-top) + 16px);right:16px;z-index:22;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid #fff;color:#0c2f4e;cursor:pointer;display:grid;place-items:center;box-shadow:0 14px 30px -14px rgba(6,40,70,.7);opacity:0;pointer-events:none;transition:opacity .4s,transform .3s var(--spring)}
.p-x.on{opacity:1;pointer-events:auto}.p-x:hover{transform:scale(1.08)}
.p-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);z-index:40;opacity:0;background:rgba(255,255,255,.95);border:1px solid #fff;color:#0c2f4e;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;transition:.4s var(--spring);pointer-events:none;text-align:center;max-width:88vw;box-shadow:0 18px 40px -18px rgba(6,40,70,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== NEXT SCREEN (full, light, glassy) ===== */
.screen{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#fbf8f1 0%,#f4efe3 60%,#efe7d4 100%);color:var(--txt);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .52s var(--ease);overscroll-behavior:contain}
.screen.on{transform:translateX(0)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/></svg>")}
.screen::after{content:"";position:absolute;left:0;right:0;top:0;height:200px;pointer-events:none;background:radial-gradient(70% 90% at 20% 0%,rgba(31,158,201,.16),transparent 70%),radial-gradient(70% 90% at 95% 5%,rgba(199,154,75,.14),transparent 70%)}
.s-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 13px;background:rgba(251,248,241,.78);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid rgba(199,154,75,.22)}
.s-back{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.9);color:#0c2f4e;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 24px -14px rgba(6,40,70,.5),inset 0 1px 0 #fff;transition:transform .3s var(--spring),box-shadow .3s}
.s-back:hover{transform:translateX(-2px);box-shadow:0 12px 28px -12px rgba(6,40,70,.6)}
.s-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.s-htxt{flex:1;min-width:0}
.s-htxt b{display:block;font-family:'Fraunces';font-style:italic;font-weight:500;font-size:21px;line-height:1.02;color:#10314f;font-variation-settings:'opsz'90}
.s-htxt span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.s-live{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2f7d5c;background:rgba(63,157,118,.13);border:1px solid rgba(63,157,118,.3);padding:5px 9px;border-radius:20px}
.s-live .ld{width:6px;height:6px;border-radius:50%;background:#3f9d76;animation:pp 1.8s infinite}
.s-live.cache{color:var(--gold-d);background:rgba(199,154,75,.13);border-color:rgba(199,154,75,.34)}
.s-live.cache .ld{background:var(--gold)}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(env(safe-area-inset-bottom) + 40px);position:relative;z-index:2}
.s-meander{height:2px;width:54px;margin:2px 0 16px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 9px);border-radius:2px;opacity:.7}
/* cards */
.card{background:#fffdf9;border:1px solid rgba(199,154,75,.2);border-radius:18px;padding:15px 16px;box-shadow:0 16px 34px -24px rgba(6,40,70,.45),inset 0 1px 0 #fff;transition:transform .3s var(--spring),box-shadow .3s;animation:cardin .55s var(--spring) both}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.985)}
.card.tap:hover{box-shadow:0 20px 40px -22px rgba(6,40,70,.5),0 0 0 1.5px rgba(199,154,75,.45);transform:translateY(-2px)}
.s-list{display:flex;flex-direction:column;gap:11px}
/* event row */
.evt{display:flex;align-items:center;gap:13px}
.evt-date{flex:none;width:54px;text-align:center;border-radius:13px;padding:8px 4px;background:linear-gradient(160deg,#0a4d8c,#1f9ec9);color:#fff;box-shadow:0 10px 22px -12px rgba(10,77,140,.6)}
.evt-date b{display:block;font-family:'Fraunces';font-style:italic;font-size:22px;line-height:1;font-weight:600}
.evt-date span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.92}
.evt-main{flex:1;min-width:0}
.evt-main h4{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:16.5px;color:#10314f;line-height:1.1}
.evt-main p{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px}
.evt-main p svg{width:12px;height:12px;stroke:var(--gold-d);fill:none;stroke-width:2;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;border-radius:24px;font:800 12.5px 'Hanken Grotesk';padding:10px 15px;transition:transform .25s var(--spring),filter .25s,box-shadow .25s}
.btn:active{transform:scale(.95)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706;box-shadow:0 12px 26px -12px rgba(184,137,59,.6)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.glass{background:rgba(255,255,255,.92);color:#0c2f4e;border:1px solid rgba(199,154,75,.34)}
.btn.go{background:linear-gradient(135deg,var(--green),#2f7d5c);color:#fff;box-shadow:0 12px 26px -12px rgba(47,125,92,.55)}
.btn.sm{padding:8px 13px;font-size:11.5px}
.btn.wide{width:100%;padding:14px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
/* directory grid */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dcat{display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left}
.dcat .di{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(155deg,#fff,#e9f1f6);border:1px solid #fff;box-shadow:0 8px 18px -12px rgba(6,40,70,.5),inset 0 1px 0 #fff}
.dcat .di svg{width:21px;height:21px;fill:none;stroke-width:1.8}
.dcat h4{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:15px;color:#10314f;line-height:1.05}
.dcat .dn{font-family:'Fraunces';font-weight:600;font-size:25px;color:#10314f;line-height:1;font-feature-settings:'tnum'}
.dcat .dl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-top:-1px}
.dtotal{grid-column:1/-1;text-align:center;background:linear-gradient(160deg,#0a4d8c,#093b6b);color:#fff;border-color:rgba(255,255,255,.2)}
.dtotal .dn{color:#fff;font-size:34px}.dtotal .dl{color:var(--gold2)}
/* product grid */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{padding:0;overflow:hidden;display:flex;flex-direction:column}
.prod .pimg{height:104px;display:grid;place-items:center;position:relative;overflow:hidden}
.prod .pimg svg{width:46px;height:46px;stroke:rgba(255,255,255,.92);fill:none;stroke-width:1.4;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.prod .pinfo{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.prod h4{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:14.5px;color:#10314f;line-height:1.12}
.prod .pp{font-weight:800;font-size:14px;color:var(--gold-d)}
.prod .prow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
/* name-day composer */
.greetcard{position:relative;border-radius:20px;overflow:hidden;padding:26px 22px;color:#fff;background:linear-gradient(150deg,#0a4d8c,#1f9ec9 130%);box-shadow:0 24px 50px -22px rgba(10,77,140,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.greetcard .gmean{height:3px;width:60px;margin-bottom:16px;background:repeating-linear-gradient(90deg,var(--gold2) 0 7px,transparent 7px 11px);opacity:.9}
.greetcard .gxp{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:30px;line-height:1.04;letter-spacing:.3px}
.greetcard .gto{margin-top:14px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.greetcard .gname{font-family:'Fraunces';font-style:italic;font-size:22px;margin-top:2px}
.greetcard .gsun{position:absolute;right:-22px;top:-22px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(233,200,126,.55),transparent 70%)}
.field{width:100%;background:#fffdf9;border:1px solid rgba(199,154,75,.3);border-radius:14px;color:#0c2f4e;padding:12px 14px;font:500 15px 'Hanken Grotesk';outline:none;transition:border .25s,box-shadow .25s}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,75,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:22px;font-size:12.5px;font-weight:600;color:#0c2f4e;background:#fffdf9;border:1px solid rgba(199,154,75,.3);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706;border-color:transparent}
/* service times */
.svc{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(199,154,75,.28)}
.svc:last-child{border-bottom:none}
.svc .sd{font-weight:700;font-size:13.5px;color:#10314f}
.svc .st{font-family:'Fraunces';font-style:italic;font-weight:600;font-size:16px;color:var(--gold-d)}
.svc .ss{font-size:11.5px;color:var(--mut)}
/* article list */
.art{display:flex;gap:13px;align-items:flex-start}
.art-thumb{flex:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;box-shadow:0 10px 22px -14px rgba(6,40,70,.5)}
.art-thumb svg{width:26px;height:26px;stroke:rgba(255,255,255,.95);fill:none;stroke-width:1.5}
.art-main h4{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:16px;color:#10314f;line-height:1.12}
.art-main .ameta{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin:5px 0 4px}
.art-main p{font-size:12.5px;color:var(--mut);line-height:1.4}
/* section label */
.s-sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-weight:800;margin:22px 2px 11px}
.s-sec:first-child{margin-top:2px}
.s-lead{font-family:'Fraunces';font-style:italic;font-size:15px;color:#46586a;line-height:1.4;margin-bottom:16px;max-width:60ch}
.s-note{text-align:center;font-weight:600;letter-spacing:.03em;text-transform:none;color:#7d97a8}
/* commerce hook */
.sellbar{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,rgba(199,154,75,.13),rgba(233,200,126,.1));border:1px solid rgba(199,154,75,.34);border-radius:16px;padding:13px 14px;margin-top:6px}
.sellbar .si{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 8px 18px -10px rgba(184,137,59,.6)}
.sellbar .si svg{width:18px;height:18px;stroke:#3a2706;fill:none;stroke-width:2}
.sellbar .stx{flex:1;min-width:0}
.sellbar .stx b{display:block;font-size:13px;color:#10314f;font-weight:800}
.sellbar .stx span{font-size:11.5px;color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:14px}
.tag.gold{color:var(--gold-d);background:rgba(199,154,75,.15)}
.tag.go{color:#2f7d5c;background:rgba(63,157,118,.15)}
.tag.mock{color:#7d6a3a;background:rgba(199,154,75,.12);border:1px dashed rgba(199,154,75,.5)}
@media (max-width:400px){.dgrid,.pgrid{gap:9px}.s-htxt b{font-size:19px}.dcat .dn{font-size:22px}.prod .pimg{height:92px}.greetcard .gxp{font-size:26px}}
/* ===== MERGED DIRECTORY (live data, light Aegean) ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:680px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.lcard{display:flex;flex-direction:column;gap:0;overflow:hidden;padding:0}
.lcard .lbanner{height:74px;position:relative;display:grid;place-items:center;overflow:hidden}
.lcard .lbanner .llogo{width:48px;height:48px;border-radius:12px;background:#fff;object-fit:contain;padding:5px;box-shadow:0 8px 18px -10px rgba(6,40,70,.5)}
.lcard .lbanner .lglyph{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.92);box-shadow:0 8px 18px -10px rgba(6,40,70,.4)}
.lcard .lbanner .lglyph svg{width:22px;height:22px;fill:none;stroke-width:1.8}
.lcard .lbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.lcard h4{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:15px;color:#10314f;line-height:1.12;display:flex;align-items:center;gap:6px}
.lcard .lmeta{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.lcard .lmeta svg{width:11px;height:11px;stroke:var(--gold-d);fill:none;stroke-width:2;flex:none}
.lcard .lcat{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-d);font-weight:800}
.lcard .lrow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:4px}
.verif{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--sea),#0a4d8c)}
.verif svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3}
.rating{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--gold-d);font-variant-numeric:tabular-nums}
.rating svg{width:12px;height:12px;fill:var(--gold);stroke:none}
.tag.sea{color:#0a4d8c;background:rgba(31,158,201,.15)}
/* filter chips (horizontal scroll) */
.filterbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:22px;font-size:12.5px;font-weight:700;color:#0c2f4e;background:#fffdf9;border:1px solid rgba(199,154,75,.3);cursor:pointer;transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fchip:hover{border-color:var(--gold)}.fchip:active{transform:scale(.94)}
.fchip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706;border-color:transparent}
.fchip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
/* search field in screen */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;pointer-events:none}
.sfield{width:100%;background:#fffdf9;border:1px solid rgba(199,154,75,.3);border-radius:14px;color:#0c2f4e;padding:13px 14px 13px 44px;font:500 16px 'Hanken Grotesk';outline:none;transition:border .25s,box-shadow .25s}
.sfield:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,75,.18)}
.sfield::placeholder{color:#9db1bf}
/* skeletons */
.skel{background:linear-gradient(100deg,#efe7d6 30%,#f7f0e1 50%,#efe7d6 70%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:12px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.skcard{height:150px;border-radius:18px}.skrow{height:74px;border-radius:18px}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
/* empty / error states */
.empty{text-align:center;padding:34px 18px;color:var(--mut)}
.empty .ei{width:58px;height:58px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(155deg,#fff,#e9f1f6);border:1px solid #fff;box-shadow:0 12px 26px -16px rgba(6,40,70,.5)}
.empty .ei svg{width:28px;height:28px;stroke:var(--gold-d);fill:none;stroke-width:1.7}
.empty b{display:block;font-family:'Fraunces';font-style:italic;font-weight:500;font-size:19px;color:#10314f;margin-bottom:5px}
.empty p{font-size:13px;line-height:1.45;max-width:34ch;margin:6px auto 0}
.empty .btn{margin-top:14px}
/* ===== entity detail overlay (light Aegean) ===== */
.detail{position:fixed;inset:0;z-index:42;background:linear-gradient(180deg,#fbf8f1 0%,#f4efe3 60%,#efe7d4 100%);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .5s var(--ease);overscroll-behavior:contain}
.detail.on{transform:translateX(0)}
.dhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 13px;background:rgba(251,248,241,.8);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid rgba(199,154,75,.22)}
.dback{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.9);color:#0c2f4e;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 24px -14px rgba(6,40,70,.5);transition:transform .3s var(--spring)}
.dback:hover{transform:translateX(-2px)}.dback svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.dht{flex:1;min-width:0;font-family:'Fraunces';font-style:italic;font-weight:500;font-size:18px;color:#10314f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(env(safe-area-inset-bottom) + 40px)}
.dbody .inner{max-width:560px;margin:0 auto;padding:0 16px}
.dhero{position:relative;padding:30px 16px 26px;color:#fff;overflow:hidden}
.dhero .dhmean{height:3px;width:56px;margin-bottom:14px;background:repeating-linear-gradient(90deg,var(--gold2) 0 7px,transparent 7px 11px);opacity:.9}
.dhero .dhlogo{width:62px;height:62px;border-radius:16px;background:#fff;object-fit:contain;padding:7px;box-shadow:0 14px 30px -14px rgba(0,0,0,.4);margin-bottom:13px}
.dhero .dheyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:800}
.dhero h1{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:clamp(26px,7vw,36px);line-height:1.05;margin-top:6px;font-variation-settings:'opsz'144}
.dhsub{font-size:13px;color:rgba(255,255,255,.92);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dhsub svg{width:13px;height:13px;stroke:rgba(255,255,255,.9);fill:none;stroke-width:2}
.dhbadges{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.dhbadges .tag{background:rgba(255,255,255,.92)}
.dsec-t{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-weight:800;margin:22px 0 11px}
.about{font-size:14px;line-height:1.55;color:#46586a}
.contactgrid{display:flex;flex-direction:column;gap:9px}
.crow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:#fffdf9;border:1px solid rgba(199,154,75,.2);text-decoration:none;color:var(--txt);transition:.2s}
.crow:hover{border-color:var(--gold);transform:translateY(-1px)}
.crow .ci{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(155deg,#fff,#e9f1f6);border:1px solid #fff}
.crow .ci svg{width:18px;height:18px;stroke:var(--aeg);fill:none;stroke-width:2}
.crow .ctx{min-width:0}
.crow .ctx b{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d);font-weight:800}
.crow .ctx span{font-size:13.5px;color:#10314f;font-weight:600;word-break:break-word}
.hoursbox{font-size:13.5px;color:#10314f;line-height:1.7;background:#fffdf9;border:1px solid rgba(199,154,75,.2);border-radius:14px;padding:13px 15px}
.ctarow{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.btn.sea{background:linear-gradient(135deg,var(--sea),#0a4d8c);color:#fff;box-shadow:0 12px 26px -12px rgba(10,77,140,.5)}
.reviewcard{background:#fffdf9;border:1px solid rgba(199,154,75,.2);border-radius:14px;padding:12px 14px}
.reviewcard .rvh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.reviewcard .rvn{font-weight:800;font-size:13px;color:#10314f}
.reviewcard p{font-size:12.5px;color:#46586a;line-height:1.45}
/* ===== home intro: dual-purpose tagline + hub nav (Business / Community) ===== */
.homeintro{position:fixed;top:calc(env(safe-area-inset-top) + 66px);left:0;right:0;z-index:7;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transition:opacity .45s var(--ease)}
.homeintro.hide{opacity:0;pointer-events:none!important}
.hi-tag{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:13px;letter-spacing:.2px;color:#eef6fc;text-align:center;max-width:min(90vw,370px);line-height:1.4;text-shadow:0 2px 13px rgba(6,30,55,.6);padding:0 14px}
.hi-tag b{color:var(--gold2);font-weight:600;font-style:normal}
.hi-nav{display:flex;gap:9px;pointer-events:auto}
.hi-pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 16px;border-radius:26px;font:800 12px 'Hanken Grotesk';letter-spacing:.02em;color:#0c2f4e;background:rgba(255,255,255,.84);border:1px solid #fff;box-shadow:0 13px 28px -14px rgba(6,40,70,.55),inset 0 1px 0 #fff;cursor:pointer;transition:transform .3s var(--spring),box-shadow .3s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hi-pill:hover{transform:translateY(-2px);box-shadow:0 17px 32px -14px rgba(6,40,70,.62),0 0 0 2px var(--gold2)}
.hi-pill:active{transform:scale(.96)}
.hi-pill.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706}
.hi-pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
/* ===== business / creator hub ===== */
.bizhero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;color:#fff;background:linear-gradient(150deg,#0a4d8c,#1f9ec9 135%);box-shadow:0 24px 50px -22px rgba(10,77,140,.7),inset 0 1px 0 rgba(255,255,255,.3);margin-bottom:16px}
.bizhero .gsun{position:absolute;right:-24px;top:-24px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(233,200,126,.5),transparent 70%);pointer-events:none}
.bizhero .bh-mean{height:3px;width:56px;margin-bottom:13px;background:repeating-linear-gradient(90deg,var(--gold2) 0 7px,transparent 7px 11px);opacity:.9}
.bizhero h2{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:clamp(23px,6vw,30px);line-height:1.08;position:relative}
.bizhero p{font-size:13.5px;color:rgba(255,255,255,.93);margin-top:9px;line-height:1.45;max-width:44ch;position:relative}
.biztabs{display:flex;gap:8px;margin-bottom:14px}
.biztab{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:14px;font:800 13px 'Hanken Grotesk';color:#0c2f4e;background:#fffdf9;border:1px solid rgba(199,154,75,.3);cursor:pointer;transition:.2s;touch-action:manipulation}
.biztab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.biztab.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2706;border-color:transparent;box-shadow:0 12px 26px -14px rgba(184,137,59,.6)}
.toolgrid{display:flex;flex-direction:column;gap:11px}
.toolcard{display:flex;gap:13px;align-items:flex-start}
.toolcard .ti{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(155deg,#fff,#e9f1f6);border:1px solid #fff;box-shadow:0 8px 18px -12px rgba(6,40,70,.5)}
.toolcard .ti svg{width:22px;height:22px;fill:none;stroke-width:1.8}
.toolcard .tc{flex:1;min-width:0}
.toolcard .tc h4{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:16px;color:#10314f;line-height:1.12;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolcard .tc p{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:4px}
.leadform{display:flex;flex-direction:column;gap:10px;margin-top:8px}

.composer .cmp-top{display:flex;align-items:center;gap:11px}

.composer .cmp-av svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8}
.composer .cmp-ph{flex:1;font-size:13.5px;color:var(--mut);font-style:italic}
.ndbig{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px;color:#fff;background:linear-gradient(150deg,#c79a4b,#9a6f24 130%);box-shadow:0 20px 44px -20px rgba(154,111,36,.6)}
.ndbig .gsun{position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%);pointer-events:none}

.ndbig .ndn{font-family:'Fraunces';font-style:italic;font-weight:500;font-size:19px;line-height:1.2;margin-top:4px;position:relative}
/* ===== ACCOUNT CHIP + PASSWORDLESS AUTH (email OTP) ===== */
.acctwrap{position:fixed;top:calc(env(safe-area-inset-top) + 74px);right:calc(env(safe-area-inset-right) + 16px);z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:7px;transition:opacity .3s}

.acctchip:active{transform:scale(.96)}
.acctchip.signin{padding:9px 15px}
.acctchip.signin svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.acctnm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctcaret{width:12px;height:12px;stroke:var(--mut);fill:none;stroke-width:2.4;flex:none}
.acctmenu{display:none;flex-direction:column;min-width:196px;background:rgba(255,255,255,.97);border:1px solid #fff;border-radius:16px;padding:6px;box-shadow:0 20px 44px -18px rgba(6,40,70,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

function sbCount(table,profileSchema){ /* returns Promise<number|null>; never throws */
 return new Promise(function(res){
  try{
   var ctl=('AbortController' in window)?new AbortController():null;var to=setTimeout(function(){if(ctl)ctl.abort();res(null);},3500);
   var h={'apikey':SB.key,'Authorization':'Bearer '+SB.key,'Prefer':'count=exact','Range':'0-0'};
   if(profileSchema)h['Accept-Profile']=profileSchema;
   fetch(SB.url+'/rest/v1/'+table+'?select=id',{headers:h,signal:ctl?ctl.signal:undefined}).then(function(r){
    clearTimeout(to);
    var cr=r.headers.get('content-range');
    if(r.ok&&cr&&cr.indexOf('/')>-1){var n=parseInt(cr.split('/')[1],10);res(isNaN(n)?null:n);}else res(null);
   }).catch(function(){clearTimeout(to);res(null);});
  }catch(e){res(null);}
 });
}

function tryLive(){ /* attempt once; refresh COUNTS/orbs from the live DB. Falls back silently to the real 2026-06-29 snapshot. */

 sbRPC('dir_counts',{}).then(function(rows){
  if(rows&&rows.length){
   var total=0,by={};
   rows.forEach(function(r){if(r&&r.entity_type){by[r.entity_type]=r.n;total+=(+r.n||0);}});
   if(total>0){
    COUNTS_BY_TYPE=by;COUNTS.byType=by;COUNTS.total=total;COUNTS._live=true;
    if(by.church!=null)COUNTS.churches=by.church;
    if(by.event!=null)COUNTS.events=by.event;
    if(by.business!=null)COUNTS.businesses=by.business;
    if(by.school!=null)COUNTS.schools=by.school;
    if(by.organization!=null)COUNTS.organizations=by.organization;
    ORB_COUNT.church=COUNTS.churches;ORB_COUNT.events=COUNTS.events;ORB_COUNT.cat=COUNTS.total;
    if(mode==='home')renderOrbs(); /* live refresh of the visible orb counts */
    refreshLiveScreens();
   }
  }
 });
 /* Secondary best-effort total via direct count header (kept for resilience). */
 sbCount('listings','zoi').then(function(total){

 });

 for(var i=0;i<map.length;i++){if(c.indexOf(map[i][0])>-1)return map[i][1];}

}

 var rootsRegion=rootsRaw.indexOf(' · ')>-1?rootsRaw.split(' · ')[1].trim():null;
 return {
  p_display_name:(first||raw||null),
  p_first_name:(first||null),
  p_roots_place:(rootsPlace||null),
  p_roots_region:(rootsRegion||null),
  p_city:(profile.city||null),
  p_country:inferCountry(profile.city),

 };
