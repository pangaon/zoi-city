<!doctype html><html lang="en"><head><title>Event response deadline test</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:24px;background:#08192b;color:#e8f5fc;font:16px system-ui}main{max-width:850px;margin:auto}label{display:block;margin:20px 0}input,select,button{display:block;box-sizing:border-box;max-width:100%;padding:12px;margin:8px 0;border:1px solid #66849c;border-radius:12px;background:#18364e;color:inherit;font:inherit}p{line-height:1.6}article,form{padding:20px;border:1px solid #39556c;border-radius:18px;margin:20px 0}button:disabled{opacity:.5}</style></head><body><main></main><script type="module">
import{mountHostAllocations}from'/assets/tickets/host-allocations.mjs';
import{mountEventPaymentPolicy}from'/assets/tickets/event-payment-policy.mjs';
const event='40000000-0000-4000-8000-000000000001',workspace='30000000-0000-4000-8000-000000000001',guest='82000000-0000-4000-8000-000000000001';
window.qa={actor:guest,event,workspace,guest,mode:'ok',calls:[],receipts:{},policy:{event_id:event,version:0,allow_pay_at_door:false,allow_pay_online:false,online_connected:false,response_deadline:null,response_open:true}};
const rpc=async(name,p)=>{qa.calls.push({name,p});if(name==='zoi_me')return{ok:true,profile:{id:guest}};if(name==='event_host_list')return{ok:true,allocations:[]};if(name==='table_inventory_operator')return{ok:true,enabled:false,tables:[]};if(qa.mode==='readfail'&&!['event_payment_request','event_payment_policy_configure','event_guest_payment_choose'].includes(name))throw Error('read failed');if(name==='event_guest_payment_options')return{ok:true,guests:qa.guestMode?[{guest_id:guest,event_id:event,event_name:'Your concert',table_label:'Table 12',quantity:2,price_per_guest_cents:12500,currency:'CAD',expires_at:'2027-03-20T20:00:00Z',policy:structuredClone(qa.policy),choice:qa.choice||null}]:[],total:qa.guestMode?1:0,payment_collected:false,ticket_issued:false};if(name==='event_payment_policy_get')return{ok:true,policy:structuredClone(qa.policy)};if(name==='event_payment_operator_report')return{ok:true,event_id:event,preferences:[],total:0,settlement_ledger:false,payment_collected:false};if(name==='event_payment_policy_configure'||name==='event_guest_payment_choose'){if(qa.mode==='notsent')throw Error('timeout');const scope=name==='event_payment_policy_configure'?{workspace,event}:{guest};let r=qa.receipts[p.p_request];if(!r){if(name==='event_payment_policy_configure'){qa.policy={...qa.policy,version:qa.policy.version+1,allow_pay_at_door:p.p_allow_pay_at_door,response_deadline:p.p_response_deadline,response_open:true};r={ok:true,request_id:p.p_request,scope,policy:structuredClone(qa.policy),payment_collected:false,ticket_issued:false};}else{qa.choice={method:'pay_at_door',status:'unpaid',version:1,policy_version:qa.policy.version};r={ok:true,request_id:p.p_request,scope,event_id:event,guest_id:guest,quantity:2,price_per_guest_cents:12500,currency:'CAD',choice:qa.choice,payment_collected:false,ticket_issued:false};}qa.receipts[p.p_request]=r;}if(qa.mode==='lost')throw Error('timeout');if(qa.mode==='savedreadfail')qa.mode='readfail';return r;}if(name==='event_payment_request'){let r=qa.receipts[p.p_request];if(!r&&p.p_cancel_if_missing)r=qa.receipts[p.p_request]={ok:true,status:'cancelled',request_id:p.p_request,kind:p.p_kind,scope:p.p_scope,payment_collected:false,ticket_issued:false};return{ok:true,request_id:p.p_request,kind:p.p_kind,scope:p.p_scope,found:!!r,receipt:r||null};}throw Error(name);};
const shell=new URLSearchParams(location.search).has('shell');if(shell){document.querySelector('style').remove();for(const href of['/assets/zoi-theme.css','/assets/tickets/host-allocations.css']){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.append(l);}document.querySelector('main').id='host-root';}
qa.mount=()=>{if(typeof qa.handle==='function')qa.handle();else qa.handle?.destroy();const core={auth:{load:()=>({user_id:qa.actor}),ensureFresh:async()=>true},api:{rpc}};qa.handle=shell?mountHostAllocations(document.querySelector('main'),{core,location:{search:'?event='+event+(qa.guestMode?'':'&workspace='+workspace),hash:'',pathname:'/tickets/hosts/'}}):mountEventPaymentPolicy(document.querySelector('main'),{core,workspace:qa.guestMode?null:workspace,event});};qa.mount();
</script></body></html>
