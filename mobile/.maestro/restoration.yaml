# Real standalone iOS simulator UI only. No GPS, login, cart changes, payment, order or send.
appId: com.usgreekscan.zoi
name: Zoi restoration screenshots and first launch
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: 'Explore Zoi'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Opening Zoi…'
    timeout: 15000
- assertVisible: 'LIFE, TOGETHER.'
- assertNotVisible: 'Skip welcome and explore Zoi'
- takeScreenshot: 01-welcome
- tapOn: 'Explore Zoi'
- extendedWaitUntil:
    visible: 'Find your Greek connection'
    timeout: 15000
- takeScreenshot: 02-home
- tapOn: 'Explore the map'
- extendedWaitUntil:
    visible: 'Expand map'
    timeout: 20000
- assertVisible: 'Zoi street-level places map'
- takeScreenshot: 03-map
- tapOn: 'Expand map'
- assertVisible: 'Close expanded map'
- assertNotVisible: 'All sections'
- takeScreenshot: 04-map-expanded
- tapOn: 'Close expanded map'
- assertVisible: 'Expand map'
- assertVisible: 'All sections'
- tapOn: 'Zoi home'
- scrollUntilVisible:
    element:
      text: 'Shop BuyGreek marketplace'
    direction: DOWN
    timeout: 10000
- tapOn: 'Shop BuyGreek marketplace'
- assertVisible: 'Search all BuyGreek products'
- extendedWaitUntil:
    notVisible: 'Loading BuyGreek products'
    timeout: 30000
- assertNotVisible: 'BuyGreek could not load.*'
- assertNotVisible: 'The store took too long.*'
- assertNotVisible: 'No products found.*'
- assertVisible: 'View .+'
- takeScreenshot: 05-buygreek
# Opening the existing cart page is read-only; no product/options/cart mutations.
- tapOn: 'Store & cart'
- assertVisible: 'Official store'
- extendedWaitUntil:
    notVisible: 'Opening BuyGreek…'
    timeout: 30000
- assertNotVisible: 'The store could not load.*'
- assertNotVisible: 'Taking longer than usual.*'
- assertVisible: 'Cart and checkout by BuyGreek.'
# Require actual store content, beyond the native wrapper and loading indicator.
- extendedWaitUntil:
    visible: 'Your cart.*|Shopping cart.*'
    timeout: 30000
- tapOn: 'Close store'
- assertVisible: 'Find your Greek connection'
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: deny
- extendedWaitUntil:
    visible: 'Find your Greek connection'
    timeout: 15000
- assertNotVisible: 'Explore Zoi'
