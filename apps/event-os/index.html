<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  /* bridged onto the shared design system — /assets/zoi-theme.css */
  /* inherited straight from the shared tokens: --gold, --green, --line */
  --ink:var(--bg);
  --ink2:var(--bg);
  --paper:var(--tx);
  --paper2:var(--mut);
  --muted:var(--mut);
  --muted2:var(--dim);
  --gold-s:var(--gold);
  --gold-soft:var(--gold);
  --aegean:var(--acc);
  --sea:var(--acc);
  --pigment:var(--red);
  --amber:var(--gold);
  --line2:var(--line);
  --glass:var(--card2);
  --glass2:var(--card);
  --gl:var(--line2);
  --glassline:var(--line2);
  --r:22px;
  --rs:16px;
  --rxs:12px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--paper);background:var(--ink2);
 line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.world{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(1300px 900px at 8% -12%,rgba(31,158,201,.22),transparent 58%),
 radial-gradient(1100px 800px at 108% 4%,rgba(184,137,59,.20),transparent 54%),
 radial-gradient(1000px 1000px at 60% 120%,rgba(10,77,140,.26),transparent 60%),
 radial-gradient(700px 600px at 88% 96%,rgba(181,50,95,.12),transparent 60%),
 linear-gradient(160deg,#0c2236,#0a1a28 60%,#081420);
 animation:drift 30s var(--ease) infinite alternate}
@keyframes drift{to{background-position:50px 36px,-40px 24px,0 -36px,30px 10px,0 0}}
.grain{position:fixed;inset:0;z-index:-1;opacity:.42;pointer-events:none;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.62'/></svg>")}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:5px;
 border-right:1px solid var(--line2);overflow-y:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.main{flex:1;min-width:0;padding:22px clamp(16px,3.4vw,46px) 60px;max-width:1280px}
body.on-floor .main{max-width:none;padding-left:clamp(16px,2vw,30px);padding-right:clamp(16px,2vw,30px)}
.brandrow{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.seal{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#22160a;
 background:radial-gradient(circle at 32% 28%,var(--gold-soft),var(--gold));font-family:'Fraunces';font-weight:600;font-size:22px;
 box-shadow:0 8px 20px -8px rgba(184,137,59,.9)}
.brand{font-family:'Fraunces';font-weight:600;font-size:19px;line-height:1}
.brand small{display:block;font-family:'Hanken Grotesk';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.navlbl{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);padding:14px 10px 5px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;cursor:pointer;color:var(--muted);
 font-weight:600;font-size:14px;border:1px solid transparent;transition:.3s var(--ease);position:relative}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav:hover{color:var(--paper);background:var(--glass)}
.nav.on{color:var(--paper);background:var(--glass2);border-color:var(--glassline);
 box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 10px 26px -16px rgba(0,0,0,.6)}
.nav.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:3px;background:linear-gradient(var(--gold-soft),var(--gold))}
.nav .badge{margin-left:auto;font-size:10px;font-weight:800;background:var(--pigment);color:#fff;border-radius:20px;padding:2px 7px;min-width:18px;text-align:center}
.nav .badge.amb{background:var(--amber);color:#22160a}
.sidefoot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line2)}
.uchip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:.3s}
.uchip:hover{background:var(--glass)}
.uav{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(150deg,var(--aegean),#072f57);color:#fff;font-weight:700;font-size:13px}
/* glass */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.45);-webkit-backdrop-filter:blur(22px) saturate(1.45);
 border:1px solid var(--glassline);box-shadow:0 1px 0 rgba(255,255,255,.09) inset,0 22px 46px -28px rgba(0,0,0,.7);border-radius:var(--r)}
.glass2{background:var(--glass2);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
 border:1px solid var(--glassline);border-radius:var(--rs)}
/* screens */
.screen{display:none}
.screen.on{display:block;animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.stag{opacity:0;transform:translateY(16px);animation:rise .65s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
/* event header */
.evhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:12px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.evhead::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.3;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.kick{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);display:flex;align-items:center;gap:8px}
.evtitle{font-family:'Fraunces';font-weight:500;font-size:clamp(18px,2.5vw,27px);line-height:1.03;margin:3px 0 3px;font-variation-settings:'opsz'144,'wght'430}
.evmeta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;font-weight:500}
.evmeta b{color:var(--paper);font-weight:600}
.evswitch{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sea);animation:pulse 2.4s infinite}
.dot.live{background:var(--pigment)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,158,201,.5)}70%{box-shadow:0 0 0 8px rgba(31,158,201,0)}100%{box-shadow:0 0 0 0 rgba(31,158,201,0)}}
.dot.live{animation:pulseP 2s infinite}
@keyframes pulseP{0%{box-shadow:0 0 0 0 rgba(181,50,95,.5)}70%{box-shadow:0 0 0 8px rgba(181,50,95,0)}100%{box-shadow:0 0 0 0 rgba(181,50,95,0)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--glass2);color:var(--paper);
 border:1px solid var(--glassline);border-radius:30px;padding:10px 16px;font:600 13.5px 'Hanken Grotesk';cursor:pointer;
 transition:transform .35s var(--spring),background .3s,border-color .3s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.btn:hover{transform:translateY(-2px);background:color-mix(in srgb, var(--tx) 13%, transparent)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#22160a;border-color:transparent;box-shadow:0 10px 26px -12px rgba(184,137,59,.8)}
.btn.aeg{background:linear-gradient(135deg,var(--aegean),var(--sea));color:#fff;border-color:transparent}
.btn.pig{background:linear-gradient(135deg,var(--pigment),#d4527d);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.block{width:100%}
.btn.danger{color:#ff9db8;border-color:rgba(181,50,95,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* cards / grid */
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:1020px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{padding:18px;position:relative;overflow:hidden}
.metric .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:11px}
.metric .eyebrow svg{width:15px;height:15px;stroke:var(--gold-soft);fill:none;stroke-width:1.9}
.metric .big{font-family:'Fraunces';font-weight:500;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:'opsz'72}
.metric .sub{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:6px}
.metric .sub b{color:var(--green);font-weight:700}
.metric .sub b.down{color:var(--pigment)}
.ring{position:absolute;right:14px;top:14px;width:54px;height:54px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.h-serif{font-family:'Fraunces';font-weight:500}
.sect{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 14px}
.sect h2{font-family:'Fraunces';font-weight:500;font-size:23px;margin:0}
.sect .lnk{color:var(--gold-soft);font-weight:700;font-size:12.5px;cursor:pointer}
.progbar{height:9px;border-radius:9px;background:color-mix(in srgb, var(--tx) 10%, transparent);overflow:hidden;margin-top:6px}
.progbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width 1.2s var(--ease)}
/* feed */
.feed{display:flex;flex-direction:column}
.fitem{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2)}
.fitem:last-child{border:none}
.ficon{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--glass2)}
.ficon svg{width:16px;height:16px;stroke:var(--sea);fill:none;stroke-width:1.9}
.ficon.g svg{stroke:var(--gold-soft)}.ficon.p svg{stroke:var(--pigment)}.ficon.gr svg{stroke:var(--green)}
.ft{font-size:13.5px;font-weight:600}.fm{font-size:11.5px;color:var(--muted)}
.fwhen{margin-left:auto;font-size:11px;color:var(--muted2);white-space:nowrap}
.attn{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;margin-bottom:9px;border:1px solid;background:color-mix(in srgb, var(--tx) 4%, transparent)}
.attn.amb{border-color:rgba(217,162,59,.35);background:rgba(217,162,59,.08)}
.attn.pig{border-color:rgba(181,50,95,.35);background:rgba(181,50,95,.08)}
.attn.sea{border-color:rgba(31,158,201,.3);background:rgba(31,158,201,.07)}
.attn svg{width:18px;height:18px;flex:none;stroke-width:1.9;fill:none}
.attn.amb svg{stroke:var(--amber)}.attn.pig svg{stroke:var(--pigment)}.attn.sea svg{stroke:var(--sea)}
.attn .at{font-size:13px;font-weight:600}.attn .am{font-size:11.5px;color:var(--muted)}
.attn .btn{margin-left:auto}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill.gold{background:rgba(184,137,59,.16);color:var(--gold-soft)}
.pill.green{background:rgba(46,139,87,.18);color:#6fd49b}
.pill.sea{background:rgba(31,158,201,.16);color:#7fd4ef}
.pill.pig{background:rgba(181,50,95,.16);color:#f29bbb}
.pill.amb{background:rgba(217,162,59,.16);color:#f0cd86}
.pill.mut{background:color-mix(in srgb, var(--tx) 8%, transparent);color:var(--muted)}
</style>
<style>
/* ===== FLOOR BUILDER (canvas-dominant, responsive panels) ===== */
.builder{position:relative;height:calc(100vh - 188px);min-height:540px;display:flex;flex-direction:column}
/* top toolbar strip — never overlaps canvas content */
.cvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;margin-bottom:11px;border-radius:var(--rs);position:relative;z-index:5}
.cvbar .sep{width:1px;height:24px;background:var(--line);flex:none}
.cvbar .spacer{flex:1}
.zoomctl{display:flex;align-items:center;gap:2px;padding:3px;border-radius:30px;background:rgba(0,0,0,.22);border:1px solid var(--line2)}
.zb{width:30px;height:30px;border:none;background:none;color:var(--paper);cursor:pointer;border-radius:50%;font-size:18px;display:grid;place-items:center;transition:.2s;flex:none}
.zb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.zb:hover{background:var(--glass2)}
.zlvl{font-size:11px;font-weight:700;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.toolseg{display:flex;gap:2px;padding:3px;border-radius:30px;background:rgba(0,0,0,.22);border:1px solid var(--line2)}
.toolseg button{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:24px;padding:6px 11px;font:700 12px 'Hanken Grotesk';transition:.2s}
.toolseg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.toolseg button.on{background:var(--glass2);color:var(--paper);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.cvstats{display:flex;gap:6px;flex-wrap:wrap}
.cvstat{padding:6px 11px;border-radius:30px;font-size:11px;font-weight:700;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.2);border:1px solid var(--line2)}
.cvstat b{font-family:'Fraunces';font-variant-numeric:tabular-nums}
.selpill{display:none;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:30px;background:rgba(184,137,59,.16);border:1px solid rgba(184,137,59,.4);color:var(--gold-soft);font-size:11.5px;font-weight:800}
.selpill.on{display:flex}
.selpill .mini{display:flex;gap:2px}
.selpill .mb{width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.25);color:var(--paper);cursor:pointer;display:grid;place-items:center;transition:.2s}
.selpill .mb:hover{background:var(--glass2)}
.selpill .mb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.selpill .mb.dng:hover{background:rgba(181,50,95,.3);color:#ff9db8}
/* canvas viewport — fills remaining space, full width */
.canvaswrap{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--r)}
.canvaswrap.tool-pan{cursor:grab}
.canvaswrap.tool-pan.panning{cursor:grabbing}
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
/* venue room frame */
.venue{position:absolute;border:1.5px solid rgba(217,184,115,.4);border-radius:14px;
 background:color-mix(in srgb, var(--tx) 1.8%, transparent);
 background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
 box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 60px -10px rgba(0,0,0,.4);pointer-events:none}
.venue.nogrid{background-image:none}
.venue .vname{position:absolute;top:-11px;left:18px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);background:var(--ink2);padding:2px 9px;border-radius:20px;border:1px solid rgba(217,184,115,.4)}
/* palette rail / drawer */
.bpalette{position:absolute;top:0;left:0;width:198px;max-height:100%;overflow-y:auto;scrollbar-width:none;z-index:14;padding:14px;
 transition:transform .42s var(--spring),opacity .3s;border-radius:var(--rs)}
.bpalette::-webkit-scrollbar{display:none}
.bpalette.hide{transform:translateX(-118%);opacity:0;pointer-events:none}
.bpalette h4,.bprops h4{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.panelclose{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 5%, transparent);color:var(--paper);cursor:pointer;display:grid;place-items:center;flex:none;transition:.2s}
.panelclose:hover{background:var(--glass2)}
.panelclose svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.pal{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:grab;border:1px solid transparent;transition:.25s;margin-bottom:5px;user-select:none}
.pal:hover{background:var(--glass2);border-color:var(--glassline);transform:translateX(2px)}
.pal:active{cursor:grabbing}
.pal .pi{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--glass2)}
.pal .pi svg{width:18px;height:18px;stroke:var(--gold-soft);fill:none;stroke-width:1.7}
.pal .pn{font-size:12.5px;font-weight:600}.pal .pc{font-size:10.5px;color:var(--muted)}
/* properties drawer — only present when an element is selected */
.bprops{position:absolute;top:0;right:0;width:262px;max-height:100%;overflow-y:auto;scrollbar-width:none;z-index:14;padding:16px;display:flex;flex-direction:column;
 transition:transform .42s var(--spring),opacity .3s;border-radius:var(--rs)}
.bprops::-webkit-scrollbar{display:none}
.bprops.hide{transform:translateX(118%);opacity:0;pointer-events:none}
/* table elements */
.el{position:absolute;cursor:move;transition:box-shadow .25s;touch-action:none}
.el.fixture{cursor:default}
.el .lbl{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--paper);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
.el .seats{position:absolute;inset:0;pointer-events:none}
.el .seatdot{position:absolute;width:8px;height:8px;border-radius:50%;background:color-mix(in srgb, var(--tx) 55%, transparent);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.el .lockbadge{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.45);display:none;place-items:center}
.el.fixture .lockbadge{display:grid}
.el .lockbadge svg{width:9px;height:9px;stroke:var(--gold-soft);fill:none;stroke-width:2.4}
.el.sel{z-index:20!important}
.el.sel .lockbadge{display:none}
.el.sel .shape{box-shadow:0 0 0 2px var(--gold-soft),0 0 0 6px rgba(217,184,115,.25),0 14px 30px -14px rgba(0,0,0,.7)!important}
.shape{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);
 box-shadow:0 8px 22px -12px rgba(0,0,0,.7);border:1.5px solid color-mix(in srgb, var(--tx) 25%, transparent)}
/* status colors */
.st-available .shape{background:linear-gradient(150deg,#1b3548,#13283a)}
.st-reserved .shape{background:linear-gradient(150deg,#1b5e8c,#0a4d8c)}
.st-sold .shape{background:linear-gradient(150deg,#2e8b57,#1f6b41)}
.st-vip .shape{background:linear-gradient(150deg,var(--gold),#946a23)}
.marquee{position:absolute;border:1.5px dashed var(--gold-soft);background:rgba(217,184,115,.1);z-index:30;pointer-events:none}
/* scrim behind drawers (laptop/mobile) */
.bscrim{position:absolute;inset:0;z-index:12;background:rgba(6,14,22,.35);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;border-radius:var(--r)}
.bscrim.on{opacity:1;pointer-events:auto}
.field{margin-bottom:13px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--paper);
 border-radius:11px;padding:10px 13px;font:500 13.5px 'Hanken Grotesk';outline:none;transition:.25s}
.field input:focus,.field select:focus{border-color:var(--gold-soft);box-shadow:0 0 0 3px rgba(217,184,115,.16)}
.field select option{background:#0c2236}
.statusrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.statbtn{padding:9px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 4%, transparent);cursor:pointer;font-size:11.5px;font-weight:700;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:7px;justify-content:center}
.statbtn .sw{width:11px;height:11px;border-radius:50%}
.statbtn.on{color:var(--paper);border-color:var(--glassline);background:var(--glass2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line2)}
.legend span{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:600}
.legend .sw{width:11px;height:11px;border-radius:3px}
/* responsive floor: desktop = rail+contextual props; laptop/tablet = drawers; mobile = bottom sheets */
.bpalette,.bprops{background:var(--glass);backdrop-filter:blur(22px) saturate(1.45);-webkit-backdrop-filter:blur(22px) saturate(1.45);border:1px solid var(--glassline);box-shadow:0 22px 46px -28px rgba(0,0,0,.7)}
@media(min-width:1200px){
 /* desktop: palette is a persistent slim rail (toggle to hide); props only when selected (handled in JS) */
 .builder.pal-open .canvas-pad-left{}
}
@media(max-width:1199px){
 /* laptop/tablet: panels are slide-over drawers over the canvas */
 .bpalette{box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
 .bprops{box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
}
@media(max-width:760px){
 .builder{height:calc(100vh - 150px);min-height:440px}
 .cvbar{gap:6px;padding:8px}
 .cvstats{order:5;width:100%}
 .bpalette{left:0;right:0;top:auto;bottom:0;width:100%;max-height:62%;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px)}
 .bpalette.hide{transform:translateY(112%)}
 .bprops{left:0;right:0;top:auto;bottom:0;width:100%;max-height:72%;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px)}
 .bprops.hide{transform:translateY(112%)}
 .sheetgrab{display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:-4px auto 12px}
}
.sheetgrab{display:none}
/* ===== BOX OFFICE ===== */
.boxgrid{display:grid;grid-template-columns:1fr 340px;gap:18px}
@media(max-width:980px){.boxgrid{grid-template-columns:1fr}}
.tier{display:flex;align-items:center;gap:14px;padding:15px;border-radius:var(--rs);margin-bottom:11px;border:1px solid var(--line2);transition:.3s;cursor:pointer}
.tier:hover{border-color:var(--glassline);background:var(--glass)}
.tier.sold{opacity:.62}
.tieric{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center}
.tieric svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.tn{font-family:'Fraunces';font-size:17px;font-weight:600}
.td{font-size:12px;color:var(--muted)}
.tp{font-family:'Fraunces';font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:30px;overflow:hidden}
.qty button{width:32px;height:32px;border:none;background:color-mix(in srgb, var(--tx) 5%, transparent);color:var(--paper);font-size:18px;cursor:pointer;transition:.2s}
.qty button:hover{background:var(--glass2)}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cart{padding:18px;position:sticky;top:22px}
.cartrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.cartrow .x{cursor:pointer;color:var(--muted2);font-weight:700}
.cartrow .x:hover{color:var(--pigment)}
.carttot{display:flex;justify-content:space-between;font-family:'Fraunces';font-size:22px;font-weight:600;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.payseg{display:flex;gap:6px;margin:10px 0}
.payseg button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 4%, transparent);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;transition:.2s}
.payseg button.on{background:var(--glass2);color:var(--paper);border-color:var(--glassline)}
.addon{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;border:1px solid var(--line2);margin-bottom:7px;cursor:pointer;transition:.25s}
.addon:hover{border-color:var(--glassline)}
.addon.on{background:rgba(184,137,59,.1);border-color:rgba(184,137,59,.4)}
.addon .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;transition:.2s}
.addon.on .ck{background:var(--gold);border-color:var(--gold)}
.addon.on .ck svg{opacity:1}
.addon .ck svg{width:13px;height:13px;stroke:#22160a;stroke-width:3;fill:none;opacity:0}
/* ===== MODES ===== */
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:8px}
@media(max-width:880px){.modegrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.modegrid{grid-template-columns:1fr}}
.modec{padding:16px;cursor:pointer;border:1px solid var(--line2);transition:.35s var(--spring);position:relative;overflow:hidden}
.modec:hover{transform:translateY(-3px);border-color:var(--glassline)}
.modec.on{border-color:var(--gold-soft);background:rgba(184,137,59,.1)}
.modec.on::after{content:"✓";position:absolute;top:12px;right:14px;color:var(--gold-soft);font-weight:800}
.modec .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);margin-bottom:11px}
.modec .mi svg{width:21px;height:21px;stroke:var(--gold-soft);fill:none;stroke-width:1.7}
.modec .mn{font-family:'Fraunces';font-size:17px;font-weight:600;line-height:1.1}
.modec .md{font-size:12px;color:var(--muted);margin-top:3px}
/* thermometer */
.thermo{display:flex;gap:20px;align-items:center}
.thermtube{width:46px;height:230px;border-radius:30px;background:color-mix(in srgb, var(--tx) 7%, transparent);position:relative;overflow:hidden;border:1px solid var(--line);flex:none}
.thermfill{position:absolute;bottom:0;left:0;right:0;border-radius:30px;background:linear-gradient(0deg,var(--pigment),#e0608a);transition:height 1.4s var(--spring)}
.thermbulb{width:64px;height:64px;border-radius:50%;background:linear-gradient(150deg,var(--pigment),#e0608a);position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);box-shadow:0 0 24px -4px rgba(181,50,95,.6)}
.mealrow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line2)}
.mealbar{flex:1;height:10px;border-radius:8px;background:color-mix(in srgb, var(--tx) 8%, transparent);overflow:hidden}
.mealbar i{display:block;height:100%;border-radius:8px;transition:width 1s var(--ease)}
/* ===== GUESTS / generic list ===== */
.lhead{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.srch{flex:1;min-width:180px;display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:30px}
.srch svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9}
.srch input{flex:1;border:none;background:none;color:var(--paper);font:500 14px 'Hanken Grotesk';outline:none}
.filt{display:flex;gap:7px;flex-wrap:wrap}
.fc{padding:8px 13px;border-radius:30px;font-size:12px;font-weight:700;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 4%, transparent);color:var(--muted);cursor:pointer;transition:.25s;white-space:nowrap}
.fc.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.gtable{display:flex;flex-direction:column}
.grow{display:flex;align-items:center;gap:13px;padding:13px 14px;border-bottom:1px solid var(--line2);transition:.25s;cursor:pointer}
.grow:hover{background:var(--glass)}
.gav{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.gn{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.gm{font-size:12px;color:var(--muted);margin-top:1px}
.gright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* ===== LIVE OPS ===== */
.scanbox{padding:0;overflow:hidden;text-align:center;position:relative}
.scanview{height:300px;display:grid;place-items:center;position:relative;background:linear-gradient(160deg,#0a2238,#081420);overflow:hidden}
.scanframe{width:200px;height:200px;border-radius:24px;border:2px solid color-mix(in srgb, var(--tx) 20%, transparent);position:relative}
.scanframe::before,.scanframe::after{content:"";position:absolute;width:34px;height:34px;border:3px solid var(--gold-soft)}
.scanframe::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:18px 0 0 0}
.scanframe::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 18px 0}
.scanline{position:absolute;left:8px;right:8px;height:2px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);top:10px;animation:scan 2.4s var(--ease) infinite;box-shadow:0 0 14px var(--gold-soft)}
@keyframes scan{0%,100%{top:10px}50%{top:188px}}
.scanresult{position:absolute;inset:0;display:none;place-items:center;flex-direction:column;gap:12px;animation:fade .4s}
.scanresult.on{display:grid}
.scanresult.ok{background:radial-gradient(circle at 50% 40%,rgba(46,139,87,.4),rgba(8,20,32,.95))}
.scanresult.bad{background:radial-gradient(circle at 50% 40%,rgba(181,50,95,.4),rgba(8,20,32,.95))}
.scanresult.warn{background:radial-gradient(circle at 50% 40%,rgba(217,162,59,.4),rgba(8,20,32,.95))}
.bigcheck{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;animation:pop .5s var(--spring)}
.bigcheck svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:3}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.gauge{position:relative;width:160px;height:160px;margin:0 auto}
/* ===== SPONSORS ===== */
.sponsor{padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sponlogo{height:54px;width:100%;border-radius:12px;display:grid;place-items:center;font-family:'Fraunces';font-weight:600;font-size:19px;letter-spacing:.02em;position:relative;overflow:hidden}
.tierband{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
/* ===== EVENT PAGE ===== */
.pubtoggle{display:inline-flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:30px;padding:4px;gap:2px}
.pubtoggle button{padding:8px 16px;border-radius:30px;border:none;background:none;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;transition:.25s}
.pubtoggle button.on{background:var(--paper);color:var(--ink)}
.pubcover{height:300px;border-radius:var(--r);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:24px;background:linear-gradient(150deg,#11405f,#0a1a28)}
/* photographic cover layers: real image + duotone overlay so it sits in the dark skin */
.pubcover .coverimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.pubcover .coverveil{position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(8,20,32,.25) 0%,rgba(8,20,32,.45) 45%,rgba(8,20,32,.92) 100%),
 radial-gradient(800px 400px at 16% 120%,rgba(10,77,140,.5),transparent 60%),
 linear-gradient(120deg,rgba(184,137,59,.22),transparent 55%)}
.pubcover.imgfail{background:linear-gradient(150deg,#11405f,#0a1a28)}
.pubcover.imgfail .coverveil{background:linear-gradient(180deg,transparent,rgba(8,20,32,.55))}
.thumb{position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(150deg,#11405f,#0a1a28)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.thumb:hover img{transform:scale(1.06)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,20,32,.7))}
.thumb.imgfail{background:linear-gradient(150deg,var(--aegean),#0a1a28)}
.pubcover::after{content:"";position:absolute;inset:0;z-index:2;mix-blend-mode:overlay;opacity:.3;pointer-events:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.qr{width:120px;height:120px;border-radius:14px;background:#fff;padding:9px;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px}
.qr i{background:#0B1F2E;border-radius:1px}.qr i.o{background:#fff}
/* ===== designed sponsor logo lockups (fictional brands) ===== */
.sptile{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:.35s var(--spring)}
.sptile:hover{transform:translateY(-3px)}
.splock{height:104px;display:grid;place-items:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line2)}
.splock::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at 80% -10%,rgba(255,255,255,.12),transparent 70%);pointer-events:none}
.splock svg{display:block}
.spmeta{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.spmeta .spn{font-weight:700;font-size:13px}
.spmeta .spt{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
/* ===== modal / sheet / toast / skeleton ===== */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(6,14,22,.6);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px}
.scrim.on{display:flex;animation:fade .3s}
.modal{max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:0;animation:up .45s var(--spring);scrollbar-width:none}
.modal::-webkit-scrollbar{display:none}
.modal.wide{max-width:560px}
@keyframes up{from{transform:translateY(40px) scale(.98);opacity:0}}
.mhead{padding:20px 22px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mhead h3{font-family:'Fraunces';font-weight:600;font-size:22px;margin:0;line-height:1.1}
.mhead .sub{font-size:13px;color:var(--muted);margin-top:3px}
.mbody{padding:18px 22px 22px}
.close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 5%, transparent);color:var(--paper);cursor:pointer;font-size:18px;flex:none;transition:.2s}
.close:hover{background:var(--glass2)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(24px);z-index:300;opacity:0;
 background:rgba(11,31,46,.95);border:1px solid var(--glassline);color:var(--paper);padding:12px 18px;border-radius:30px;
 font-size:13px;font-weight:600;transition:.45s var(--spring);pointer-events:none;display:flex;align-items:center;gap:10px;backdrop-filter:blur(12px);box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;stroke:var(--green);fill:none;stroke-width:2.2}
.toast .undo{margin-left:6px;color:var(--gold-soft);font-weight:800;cursor:pointer;pointer-events:auto}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:54px 24px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:var(--glass2)}
.empty .ei svg{width:30px;height:30px;stroke:var(--gold-soft);fill:none;stroke-width:1.6}
.empty h3{font-family:'Fraunces';color:var(--paper);font-size:21px;margin:0 0 6px;font-weight:600}
.empty p{font-size:13.5px;max-width:300px;margin:0 auto 16px}
.offline{display:none;align-items:center;gap:9px;background:rgba(181,50,95,.16);border:1px solid rgba(181,50,95,.4);color:#f29bbb;
 font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:13px;margin-bottom:14px}
.offline.on{display:flex}
.offline svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
/* ===== mobile tabs ===== */
.mobnav{display:none}
.mtoggle{display:none}
@media(max-width:760px){
 .side{display:none}
 .shell{display:block}
 .main{padding:16px 16px 96px;max-width:100%}
 .evswitch{width:100%;margin-left:0;margin-top:10px}
 .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:120;padding:0 10px calc(env(safe-area-inset-bottom) + 8px)}
 .mobnavin{display:flex;width:100%;border-radius:22px;padding:8px 6px;justify-content:space-around;overflow-x:auto;scrollbar-width:none}
 .mobnavin::-webkit-scrollbar{display:none}
 .mtab{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;padding:5px 4px}
 .mtab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
 .mtab.on{color:var(--gold-soft)}
 .boxgrid{grid-template-columns:1fr}.cart{position:static}
 .thermo{flex-direction:column}
}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.scrollx::-webkit-scrollbar{display:none}
/* ===== mode-aware builder chrome ===== */
.modechip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:30px;font-size:11.5px;font-weight:800;background:rgba(184,137,59,.16);border:1px solid rgba(184,137,59,.4);color:var(--gold-soft);cursor:pointer;transition:.25s}
.modechip:hover{background:rgba(184,137,59,.26)}
.modechip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.smartlist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.smartbtn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:11px;border:1px solid rgba(184,137,59,.3);background:rgba(184,137,59,.08);color:var(--paper);cursor:pointer;font:700 12px 'Hanken Grotesk';text-align:left;transition:.22s}
.smartbtn:hover{background:rgba(184,137,59,.18);border-color:rgba(184,137,59,.5);transform:translateX(2px)}
.smartbtn svg{width:16px;height:16px;stroke:var(--gold-soft);fill:none;stroke-width:1.8;flex:none}
.smartbtn small{display:block;color:var(--muted);font-weight:600;font-size:10px}
.quickrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.quickbtn{display:flex;align-items:center;gap:6px;justify-content:center;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 4%, transparent);color:var(--paper);cursor:pointer;font:700 11.5px 'Hanken Grotesk';transition:.2s}
.quickbtn:hover{background:var(--glass2);border-color:var(--glassline)}
.quickbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.quickbtn.sold{color:#6fd49b}.quickbtn.cash{color:var(--amber)}.quickbtn.vip{color:var(--gold-soft)}.quickbtn.resv{color:#7fd4ef}
/* bulk action bar */
.bulkbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(120%);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
 max-width:94%;padding:8px 10px;border-radius:18px;z-index:18;opacity:0;pointer-events:none;transition:transform .42s var(--spring),opacity .3s}
.bulkbar.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.bulkbar b{font-family:'Fraunces';font-weight:600;color:var(--gold-soft);margin-right:2px;font-size:13px}
.bkb{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:color-mix(in srgb, var(--tx) 5%, transparent);color:var(--paper);cursor:pointer;border-radius:24px;padding:6px 11px;font:700 11.5px 'Hanken Grotesk';transition:.2s;white-space:nowrap}
.bkb:hover{background:var(--glass2);border-color:var(--glassline);transform:translateY(-1px)}
.bkb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9}
.bkb.dng{color:#ff9db8;border-color:rgba(181,50,95,.4)}
.bkb.dng:hover{background:rgba(181,50,95,.18)}
.bkb .sw{width:9px;height:9px;border-radius:50%}

/* heuristic: pick the most fitting operator mode for an ingested event */
function inferMode(name){
 const n=(name||'').toLowerCase();
 if(/festival|panigyri|paniyiri|fest\b/.test(n))return 'festival';
 if(/gala|benefit|fundrais|auction/.test(n))return 'gala';
 if(/wedding|banquet|dinner dance|reception/.test(n))return 'banquet';
 if(/church|parish|orthodox|cathedral|community|name day/.test(n))return 'church';
 return 'concert';
}
function fmtRealDate(iso){
 if(!iso)return 'Date TBA';
 const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;
 const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
 const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
 return `${wd} · ${mo} ${d.getDate()}, ${d.getFullYear()}`;
}
/* map a real RPC row into the operator event model */
function realToEvent(row){
 const mode=inferMode(row.name);
 const loc=[row.city,row.state||''].filter(Boolean).join(', ');
 // deterministic but lively demo metrics so the cockpit feels alive on a real event
 const seed=(row.id||row.name||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
 const cap=300+ (seed%6)*100;            // 300–800
 const sold=Math.round(cap*(0.42+(seed%30)/100)); // ~42–72%
 const ppl=mode==='festival'?12:mode==='gala'?260:mode==='church'?55:90;
 return {
  id:'real-'+(row.slug||seed),real:true,realId:row.id,
  name:row.name,
  date:fmtRealDate(row.start_date)+(mode==='festival'?' · Festival weekend':' · 6:00 PM'),
  venue:(row.host?row.host+' — ':'')+(loc||row.city||'Venue TBA'),
  host:row.host||row.name, city:row.city, state:row.state||'', country:row.country||'',
  startDate:row.start_date,
  cap, mode, live:false,
  sold, revenue:sold*ppl, checkin:0, tables:Math.round(cap/10), goal:Math.round(sold*ppl*1.6),
 };
}
async function fetchRealEvents(){
 if(discover.loading)return;
 discover.loading=true;discover.error=null;
 if(typeof renderDiscover==='function')renderDiscover();
 try{
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),9000);
  const res=await fetch(ZOI_API.url,{
   method:'POST',
   headers:{'apikey':ZOI_API.key,'Authorization':'Bearer '+ZOI_API.key,'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({p_limit:24}),signal:ctrl.signal,
  });
  clearTimeout(to);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const rows=await res.json();
  if(!Array.isArray(rows)||!rows.length)throw new Error('No rows');
  discover.events=rows.map(realToEvent);
  discover.loaded=true;discover.error=null;
 }catch(err){
  discover.error=err&&err.name==='AbortError'?'timeout':(err.message||'unreachable');
  discover.loaded=true; // mark loaded so we stop showing the spinner; fallback shown
 }finally{
  discover.loading=false;
  if(typeof renderDiscover==='function')renderDiscover();
 }
}

 toast('Loaded real event — '+ev.name);
}

/* ----- animated counter ----- */
function countUp(el,to,opt={}){
 const dur=opt.dur||1100, money=opt.money, start=performance.now(), from=opt.from||0;
 function step(t){let p=Math.min(1,(t-start)/dur);p=1-Math.pow(1-p,3);
  const v=from+(to-from)*p; el.textContent=money?fmt(v):Math.round(v).toLocaleString('en-US')+(opt.suffix||'');
  if(p<1)requestAnimationFrame(step);}
 requestAnimationFrame(step);
}

function elHTML(el){
 const s=ELTYPES[el.t];const isRound=s.round;const sel=floor.sel.has(el.id)?'sel':'';
 let seatsHtml='';
 if(el.seats>0&&!s.struct){
  const n=Math.min(el.seats,16);
  for(let i=0;i<n;i++){
   if(isRound){const a=(i/n)*2*Math.PI-Math.PI/2;const rx=el.w/2+9,ry=el.h/2+9;
    seatsHtml+=`<div class="seatdot" style="left:${el.w/2+Math.cos(a)*rx-4}px;top:${el.h/2+Math.sin(a)*ry-4}px"></div>`;}
   else{const per=Math.ceil(n/2);const top=i<per;const idx=top?i:i-per;const cnt=top?per:n-per;
    const x=(idx+1)/(cnt+1)*el.w-4;seatsHtml+=`<div class="seatdot" style="left:${x}px;top:${top?-13:el.h+5}px"></div>`;}
  }
 }
 // VIP-lounge: square platform with couch blocks around it (ported from old builder)
 let lounge='';
 if(s.lounge){
  const cw=Math.round(el.w*0.34),ch=10;
  lounge=`<div class="couch" style="left:${(el.w-cw)/2}px;top:-3px;width:${cw}px;height:${ch}px"></div>
   <div class="couch" style="left:${(el.w-cw)/2}px;bottom:-3px;width:${cw}px;height:${ch}px"></div>
   <div class="couch" style="top:${(el.h-cw)/2}px;left:-3px;width:${ch}px;height:${cw}px"></div>
   <div class="couch" style="top:${(el.h-cw)/2}px;right:-3px;width:${ch}px;height:${cw}px"></div>`;
 }
 let inner=el.name;
 if(s.struct){inner=`<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.9">${esc(el.name)}${s.vendor&&el.vendor?'<br><small style="font-size:8px;opacity:.75">'+esc(el.vendor)+'</small>':''}</span>`;}
 else inner=`<span>${esc(el.name)}${el.seats?'<br><small style="font-size:8px;opacity:.7;font-weight:600">'+el.seats+' seats</small>':''}</span>`;
 const structBg=el.t==='stage'?'linear-gradient(150deg,#3a2a4a,#241a30)':el.t==='dance'?'repeating-linear-gradient(45deg,#11283a,#11283a 10px,#0e2233 10px,#0e2233 20px)':el.t==='bar'?'linear-gradient(150deg,#2a3540,#1a242e)':el.t==='foodtruck'?'linear-gradient(150deg,#3a3320,#241f10)':el.t==='zone'?'repeating-linear-gradient(-45deg,rgba(31,158,201,.07),rgba(31,158,201,.07) 12px,transparent 12px,transparent 24px)':'linear-gradient(150deg,#1b3548,#13283a)';
 const zoneBorder=el.t==='zone'?'border-style:dashed;border-color:rgba(31,158,201,.5);':'';
 const radius=isRound?'50%':el.t==='couch'?'14px 14px 5px 5px':'10px';
 const shapeStyle=s.struct?`background:${structBg};border-radius:${radius};${zoneBorder}`:`border-radius:${radius};`;
 const lock=el.fixture?'<div class="lockbadge"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>':'';
 let flags='';
 if(el.sponsorname)flags+=`<div class="sponsorflag" style="background:linear-gradient(135deg,var(--gold),var(--gold-soft))">★ ${esc(el.sponsorname)}</div>`;
 if(!s.struct&&el.min)flags+=`<div class="minflag">min ${fmt(el.min)}${el.pledge?' · pledged '+fmt(el.pledge):''}</div>`;
 else if(el.pledge)flags+=`<div class="minflag">pledged ${fmt(el.pledge)}</div>`;
 return `<div class="el st-${el.status} ${sel} ${el.fixture?'fixture':''}" data-id="${el.id}" style="left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;transform:rotate(${el.rot}deg)">
   ${lounge}<div class="shape" style="${shapeStyle}">${inner}</div>
   <div class="seats">${seatsHtml}</div>${lock}${flags}
  </div>`;
}

/* convert a screen (client) point to canvas-space coordinates */
function screenToCanvas(cx,cy){
 const r=$('#canvas').getBoundingClientRect();
 return {x:(cx-r.left)/floor.zoom, y:(cy-r.top)/floor.zoom};
}
function snap(v){return floor.snap?Math.round(v/GRID)*GRID:v;}
function clampToVenue(el,x,y){
 const v=floor.venue, pad=4;
 x=Math.max(v.x+pad,Math.min(v.x+v.w-el.w-pad,x));
 y=Math.max(v.y+pad,Math.min(v.y+v.h-el.h-pad,y));
 return {x,y};
}
function addElement(t,x,y){
 const s=ELTYPES[t];const v=floor.venue;
 if(x==null){ // drop into the visible center of the venue
  x=v.x+v.w/2; y=v.y+v.h/2;
 }
 const labelN=floor.els.filter(e=>e.t===t).length+1;
 const pre={round:'T',rect:'L',vip:'V',booth:'B',couch:'C',vipsq:'VIP '}[t]||'';
 const fixtures=new Set(['bar','stage','dance','entrance']);
 let nx=snap(x-s.w/2), ny=snap(y-s.h/2);
 const el={id:floor.nextId++,t,x:nx,y:ny,w:s.w,h:s.h,rot:0,
  status:s.vip?'vip':'available',name:pre?pre+labelN:s.name,seats:s.seats,min:s.vip?2000:s.seats?500:0,
  fixture:fixtures.has(t)};
 const c=clampToVenue(el,el.x,el.y);el.x=c.x;el.y=c.y;
 floor.els.push(el);floor.sel=new Set([el.id]);renderCanvas();refreshProps();toast(s.name+' added');
}
function bindEls(){
 $$('.el').forEach(node=>{
  let sx,sy,moved,startPos,dragOk;
  const down=(ex,ey)=>{
   const id=+node.dataset.id;const el=floor.els.find(x=>x.id===id);
   moved=false;sx=ex;sy=ey;dragOk=false;
   // selection logic
   if(!floor.sel.has(id)){if(!window.__shift)floor.sel.clear();floor.sel.add(id);renderCanvas();refreshProps();}
   else if(window.__shift){floor.sel.delete(id);renderCanvas();refreshProps();return;}
   // fixtures: only drag once selected (prevents accidental moves of stage/bar/etc.)
   dragOk=!el.fixture||floor.sel.size===1;
   startPos=[...floor.sel].map(i=>{const e=floor.els.find(x=>x.id===i);return{id:i,x:e.x,y:e.y};});
  };
  const move=(ex,ey)=>{
   if(!startPos||!dragOk||floor.tool==='pan')return;moved=true;
   const dx=(ex-sx)/floor.zoom, dy=(ey-sy)/floor.zoom;
   startPos.forEach(p=>{const e=floor.els.find(x=>x.id===p.id);
    let nx=snap(p.x+dx), ny=snap(p.y+dy);const c=clampToVenue(e,nx,ny);e.x=c.x;e.y=c.y;});
   renderCanvas();
  };
  const up=()=>{startPos=null;refreshProps();};
  node.addEventListener('mousedown',e=>{if(floor.tool==='pan')return;e.stopPropagation();down(e.clientX,e.clientY);
   const mm=ev=>move(ev.clientX,ev.clientY);const mu=()=>{up();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
   document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
  node.addEventListener('touchstart',e=>{e.stopPropagation();const t=e.touches[0];down(t.clientX,t.clientY);},{passive:true});
  node.addEventListener('touchmove',e=>{if(!startPos)return;const t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault();},{passive:false});
  node.addEventListener('touchend',up);
 });
}
function setupCanvasInteract(){
 const wrap=$('#cvwrap');let marq=null,mstart,panStart;
 // ctrl/cmd + wheel to zoom toward cursor
 wrap.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey))return; e.preventDefault();
  zoomAt(e.deltaY<0?.12:-.12, e.clientX, e.clientY);
 },{passive:false});
 // empty-canvas press: pan (pan tool) OR marquee select (select tool)
 const beginEmpty=(cx,cy,shift)=>{
  if(floor.tool==='pan'){
   wrap.classList.add('panning');
   panStart={px:floor.panX,py:floor.panY,sx:cx,sy:cy};
   return 'pan';
  }
  // select tool: marquee
  if(!shift){floor.sel.clear();renderCanvas();refreshProps();}
  const r=wrap.getBoundingClientRect();mstart=[cx-r.left,cy-r.top];
  marq=document.createElement('div');marq.className='marquee';wrap.appendChild(marq);
  return 'marq';
 };
 const moveEmpty=(cx,cy,mode)=>{
  if(mode==='pan'){floor.panX=panStart.px+(cx-panStart.sx);floor.panY=panStart.py+(cy-panStart.sy);
   $('#canvas').style.transform=`translate(${floor.panX}px,${floor.panY}px) scale(${floor.zoom})`;return;}
  const r=wrap.getBoundingClientRect();const x=cx-r.left,y=cy-r.top;
  const l=Math.min(x,mstart[0]),t=Math.min(y,mstart[1]),w=Math.abs(x-mstart[0]),h=Math.abs(y-mstart[1]);
  if(marq)marq.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px`;
  floor.sel.clear();floor.els.forEach(el=>{
   const ex=el.x*floor.zoom+floor.panX,ey=el.y*floor.zoom+floor.panY,ew=el.w*floor.zoom,eh=el.h*floor.zoom;
   if(ex<l+w&&ex+ew>l&&ey<t+h&&ey+eh>t)floor.sel.add(el.id);});
  renderCanvas();
 };
 const endEmpty=mode=>{wrap.classList.remove('panning');if(marq){marq.remove();marq=null;}if(mode!=='pan')refreshProps();};
 wrap.addEventListener('mousedown',e=>{
  if(e.target.closest('.el')||e.target.closest('.bpalette')||e.target.closest('.bprops')||e.target.closest('.bscrim'))return;
  const mode=beginEmpty(e.clientX,e.clientY,window.__shift);
  const mm=ev=>moveEmpty(ev.clientX,ev.clientY,mode);
  const mu=()=>{endEmpty(mode);document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
 });
 // touch: two-finger / pan-tool single-finger pan on empty canvas
 wrap.addEventListener('touchstart',e=>{
  if(e.target.closest('.el')||e.target.closest('.bpalette')||e.target.closest('.bprops'))return;
  if(floor.tool!=='pan'&&e.touches.length<2)return;
  const t=e.touches[0];panStart={px:floor.panX,py:floor.panY,sx:t.clientX,sy:t.clientY};wrap.__panT=true;
 },{passive:true});
 wrap.addEventListener('touchmove',e=>{if(!wrap.__panT)return;const t=e.touches[0];
  floor.panX=panStart.px+(t.clientX-panStart.sx);floor.panY=panStart.py+(t.clientY-panStart.sy);
  $('#canvas').style.transform=`translate(${floor.panX}px,${floor.panY}px) scale(${floor.zoom})`;e.preventDefault();},{passive:false});
 wrap.addEventListener('touchend',()=>{wrap.__panT=false;});
}
function bindKeys(){
 if(floorKeyBound)return;floorKeyBound=true;
 document.addEventListener('keydown',e=>{
  if(e.key==='Shift')window.__shift=true;
  if(cur!=='floor')return;
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(typing)return;
  if(e.key==='Escape'){clearSel();closeDrawers();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&floor.sel.size){e.preventDefault();deleteSel();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'&&floor.sel.size){e.preventDefault();duplicateSel();return;}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&floor.sel.size){
   e.preventDefault();const step=e.shiftKey?GRID:(floor.snap?GRID:2);
   const dx=(e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0);
   const dy=(e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0);
   floor.sel.forEach(id=>{const el=floor.els.find(x=>x.id===id);const c=clampToVenue(el,el.x+dx,el.y+dy);el.x=c.x;el.y=c.y;});
   renderCanvas();return;}
 });
 document.addEventListener('keyup',e=>{if(e.key==='Shift')window.__shift=false;});
}

/* ----- zoom / pan / fit ----- */
function zoom(d){zoomAt(d);}
function zoomAt(d,cx,cy){
 const wrap=$('#cvwrap');const r=wrap.getBoundingClientRect();
 if(cx==null){cx=r.left+r.width/2;cy=r.top+r.height/2;}
 const old=floor.zoom;const nz=Math.max(.25,Math.min(2.5,old+d));
 // keep the point under the cursor stable
 const wx=(cx-r.left-floor.panX)/old, wy=(cy-r.top-floor.panY)/old;
 floor.zoom=nz;
 floor.panX=cx-r.left-wx*nz; floor.panY=cy-r.top-wy*nz;
 renderCanvas();
}
function contentBounds(){
 // bounding box of venue frame + all elements, in canvas units
 let minX=floor.venue.x,minY=floor.venue.y,maxX=floor.venue.x+floor.venue.w,maxY=floor.venue.y+floor.venue.h;
 floor.els.forEach(e=>{minX=Math.min(minX,e.x);minY=Math.min(minY,e.y);maxX=Math.max(maxX,e.x+e.w);maxY=Math.max(maxY,e.y+e.h);});
 return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY};
}
function fitToScreen(silent){
 const wrap=$('#cvwrap');if(!wrap)return;
 const r=wrap.getBoundingClientRect();if(r.width<10||r.height<10){requestAnimationFrame(()=>fitToScreen(silent));return;}
 const b=contentBounds();const padX=48,padY=42;
 const z=Math.min((r.width-padX*2)/b.w,(r.height-padY*2)/b.h);
 floor.zoom=Math.max(.25,Math.min(2.5,z));
 // center the content
 floor.panX=(r.width-b.w*floor.zoom)/2 - b.minX*floor.zoom;
 floor.panY=(r.height-b.h*floor.zoom)/2 - b.minY*floor.zoom;
 floor.fitted=true;
 renderCanvas();
 if(!silent)toast('Fit to screen');
}
function resetView(){fitToScreen();}

function alignSel(axis){

function distributeSel(){

/* ============ SMART ACTIONS (mode-specific + general) ============ */
function smartAction(id){
 if(id==='renumber'||id==='renumberb'){bulkRename();return;}
 if(id==='fillcap'){fillToCapacity();return;}
 if(id==='autotier'){autoTierByStage();return;}
 if(id==='autoseat'){autoSeatGuests();return;}
 if(id==='familytogether'){seatFamilyTogether();return;}
 if(id==='headtable'){addHeadTableRounds();return;}
 if(id==='tallypledges'){tallyPledges();return;}
 if(id==='marksponsored'){bulkSponsored();return;}
 if(id==='autogrid'){autoGridBooths();return;}
 if(id==='addstage'){addStageZone();return;}
 if(id==='parishsections'){parishSections();return;}
 toast('Smart action ran');
}
function tableEls(){return floor.els.filter(e=>['round','rect','vip','vipsq','booth','couch'].includes(e.t));}
function autoTierByStage(){
 const stage=floor.els.find(e=>e.t==='stage');if(!stage){toast('Add a stage first');return;}
 const sx=stage.x+stage.w/2,sy=stage.y+stage.h/2;const t=tableEls();
 t.forEach(e=>{e._d=Math.hypot(e.x+e.w/2-sx,e.y+e.h/2-sy);});
 const sorted=[...t].sort((a,b)=>a._d-b._d);const n=sorted.length;
 sorted.forEach((e,i)=>{e.tier=i<n*0.25?'vip':i<n*0.6?'prem':'std';if(e.tier==='vip'&&e.status==='available')e.status='vip';e.min=e.tier==='vip'?2500:e.tier==='prem'?1200:600;delete e._d;});
 renderCanvas();refreshProps();fitToScreen(true);toast('Auto-tiered '+n+' tables by distance to stage');
}
function fillToCapacity(){
 const target=curEvent.cap||400;let seats=floor.els.reduce((a,e)=>a+(e.seats||0),0);
 const v=floor.venue;let added=0,guard=0;
 while(seats<target&&guard<200){guard++;
  const cols=6,gx=v.w/cols;const idx=tableEls().length;
  const cx=v.x+gx/2+(idx%cols)*gx,cy=v.y+v.h*0.5+Math.floor(idx/cols)*130;
  const sp=ELTYPES.round;const el={id:floor.nextId++,t:'round',x:0,y:0,w:sp.w,h:sp.h,rot:0,status:'available',name:'T'+(tableEls().length+1),seats:10,tier:'std',min:600,fixture:false};
  const c=clampToVenue(el,snap(cx-sp.w/2),snap(cy));el.x=c.x;el.y=c.y;floor.els.push(el);seats+=10;added++;
  if(cy>v.y+v.h-80)break;
 }
 renderCanvas();refreshProps();fitToScreen(true);toast(added?('Added '+added+' tables → '+seats+' seats (target '+target+')'):'Already at capacity');
}
function autoSeatGuests(){
 const going=guests.filter(g=>g.rsvp==='going');const rounds=tableEls().filter(e=>e.t==='round'||e.t==='rect');
 let gi=0;rounds.forEach(t=>{let cap=t.seats||10,filled=0,names=[];
  while(filled<cap&&gi<going.length){const g=going[gi];const heads=1+(g.plus||0);if(filled+heads<=cap){g.table=t.name;names.push(g.name.split(' ')[1]||g.name);filled+=heads;}gi++;}
  if(filled>0){t.status='sold';t.family=names[0]?names[0]+' party':t.family;}});
 renderCanvas();refreshProps();fitToScreen(true);toast('Seated '+gi+' RSVP guests into '+rounds.length+' tables');
}

function addStageZone(){

function cartTotal(){return cart.reduce((a,c)=>a+c.price*c.qty,0);}
function cartAdd(id,d){
 const t=TIERS.find(x=>x.id===id);let it=cart.find(c=>c.id===id);
 if(!it&&d>0){it={id,name:t.name,price:t.price,qty:0};cart.push(it);}
 if(it){it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>c!==it);}
 // over-capacity check

    <div class="field"><label>Tagline</label><input value="${esc(brand.sub||'')}" placeholder="e.g. Signature Productions" oninput="brand.sub=this.value;applyBrand()"></div>
    <div class="field"><label>Accent color — re-themes the whole app & public page</label>
     <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">${Object.entries(ACCENTS).map(([k,a])=>`<div onclick="setAccent('${k}')" title="${a.name}" style="width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,${a.soft},${a.base});cursor:pointer;border:2px solid ${brand.accent===k?'#fff':'transparent'};transition:.2s;box-shadow:0 6px 16px -8px ${a.base}"></div>`).join('')}</div></div>
    <div class="field"><label>Logo</label>
     <div class="glass2" style="padding:16px;border-radius:12px;border:1px dashed var(--glassline);text-align:center;color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px" onclick="document.getElementById('brandLogoInput').click()">
      ${brand.logo?`<img src="${brand.logo}" alt="" style="width:40px;height:40px;border-radius:9px;object-fit:cover">`:`<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--gold-soft);fill:none;stroke-width:1.8"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>`}
      <span>${brand.logo?'Logo set · tap to replace':'Upload logo · PNG / SVG / JPG'}</span></div>
     <input type="file" id="brandLogoInput" accept="image/*" style="display:none" onchange="onBrandLogo(this)">
     ${brand.logo?`<button class="btn sm" style="margin-top:8px" onclick="brand.logo='';applyBrand();toast('Logo removed')">Remove logo</button>`:''}
    </div>
    <div class="addon ${brand.removeBadge?'on':''}" onclick="brand.removeBadge=!brand.removeBadge;applyBrand();toast(brand.removeBadge?'Zoi badge hidden on public page':'Zoi badge shown')"><div class="ck">${SVG.check}</div><div style="flex:1"><div style="font-weight:600;font-size:13px">Remove Zoi badge from public page</div><div style="font-size:11px;color:var(--muted)">Pro plan</div></div></div>
    <button class="btn gold sm block" style="margin-top:6px" onclick="go('page');toast('Open the public page to preview your brand')">Preview branded public page</button>
   </div>
  </div>
  <div class="sect"><h2>Team &amp; roles</h2><span class="lnk" onclick="inviteTeam()">+ Invite</span></div>
  <div class="card glass stag">
   ${[['George Pangaon','Owner','#0A4D8C'],['Anna M.','Box office','#B5325F'],['Theo K.','Door / check-in','#2e8b57'],['Sophia L.','Floor manager','#B8893B']].map(t=>`<div class="grow" style="cursor:default"><div class="gav" style="background:${t[2]}">${initials(t[0])}</div><div><div class="gn">${t[0]}</div><div class="gm">${t[1]}</div></div><div class="gright"><span class="pill mut">${t[1]==='Owner'?'Full access':'Limited'}</span></div></div>`).join('')}
  </div>`;
}
function inviteTeam(){openModal(`<div class="mhead"><div><h3>Invite team member</h3></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="mbody"><div class="field"><label>Email</label><input placeholder="team@example.com"></div>
 <div class="field"><label>Role</label><select><option>Box office</option><option>Door / check-in</option><option>Floor manager</option><option>Owner</option></select></div>
 <button class="btn gold block" onclick="closeModal();toast('Invite sent')">Send invite</button></div>`);}

/* ============ BOOT ============ */
try{const ls=STORE.get('zoi_layouts');if(ls)savedLayouts=JSON.parse(ls);}catch(e){}
// apply the saved white-label brand kit (accent + name + logo) before first paint
try{applyBrand();}catch(e){}
// re-fit the floor when the window resizes (keeps everything visible at any size)
let __fitT;
window.addEventListener('resize',()=>{if(cur!=='floor')return;clearTimeout(__fitT);__fitT=setTimeout(()=>{fitToScreen(true);refreshProps();},160);});
render(); // skeleton
setTimeout(()=>{booted=true;render();
 // refresh the sidebar seal/brand text now that the app is interactive
 try{const a=brandAccent();const seal=document.querySelector('.side .seal');if(seal)seal.innerHTML=brand.logo?`<img src="${brand.logo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:brandInitials();const bd=document.querySelector('.side .brand');if(bd)bd.innerHTML=`${esc(brand.name)}<small>${esc(brand.sub||'Operator cockpit')}</small>`;}catch(e){}
 // warm the real-events cache in the background so the switcher is instant
 try{fetchRealEvents();}catch(e){}
},900);
/* eventos-live build: real ev_upcoming RPC + white-label brand kit + elite public page */
</script>
<script src="/assets/zoi-theme.js"></script>
