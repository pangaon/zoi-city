<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0B1F2E"/>
<!-- OPERATOR TOOL: never public. Hard noindex always (not flag-gated). -->
<meta name="robots" content="noindex,nofollow"/>
<title>Zoi for Business — operator-grade social for the Greek world</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/assets/zoi-theme.css">
<style>
:root{
  /* bridged onto the shared design system — /assets/zoi-theme.css */
  /* inherited straight from the shared tokens: --gold, --green, --line */
  --ink:var(--bg);
  --ink2:var(--bg);
  --paper:var(--tx);
  --paper2:var(--mut);
  --muted:var(--mut);
  --muted2:var(--dim);
  --gold-s:var(--gold);
  --gold-soft:var(--gold);
  --aegean:var(--acc);
  --sea:var(--acc);
  --pigment:var(--red);
  --amber:var(--gold);
  --line2:var(--line);
  --glass:var(--card2);
  --glass2:var(--card);
  --gl:var(--line2);
  --glassline:var(--line2);
  --r:22px;
  --rs:16px;
  --rxs:12px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --fb:#1877F2;
  --ig:#E1306C;
  --tk:#000;
  --x:#1d1d1f;
  --yt:#FF0000;
  --li:#0A66C2;
  --nl:#B8893B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--paper);background:var(--ink2);
 line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.world{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(1100px 760px at 8% -6%,rgba(31,158,201,.20),transparent 58%),
 radial-gradient(1000px 720px at 108% 6%,rgba(184,137,59,.20),transparent 54%),
 radial-gradient(900px 900px at 50% 118%,rgba(10,77,140,.22),transparent 60%),
 radial-gradient(700px 600px at 80% 80%,rgba(181,50,95,.08),transparent 60%),
 linear-gradient(160deg,#0c2236,#0a1a28 60%);
 animation:drift 30s var(--ease) infinite alternate}
@keyframes drift{to{background-position:50px 36px,-40px 24px,0 -36px,30px 0,0 0}}
.grain{position:fixed;inset:0;z-index:-1;opacity:.4;pointer-events:none;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>")}
::selection{background:rgba(217,184,115,.3)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--tx) 12%, transparent);border-radius:8px}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:4px;
 border-right:1px solid var(--line2);overflow-y:auto}
.brandrow{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.seal{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fffdf8;
 background:radial-gradient(circle at 32% 28%,var(--gold-soft),var(--gold));font-family:'Fraunces';font-weight:600;font-size:22px;
 box-shadow:0 8px 18px -6px rgba(184,137,59,.8)}
.brandtxt b{font-family:'Fraunces';font-weight:600;font-size:18px;display:block;line-height:1}
.brandtxt span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);
 margin-bottom:14px;cursor:pointer;transition:.3s var(--ease)}
.acct:hover{background:var(--glass2)}
.acct .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:'Fraunces';font-weight:600;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--aegean),var(--sea))}
.acct .nm{font-weight:700;font-size:13px;line-height:1.1}.acct .sub{font-size:11px;color:var(--muted)}
.acct svg{margin-left:auto;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.navlbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;color:var(--muted);font-weight:600;font-size:13.5px;
 cursor:pointer;border:1px solid transparent;transition:.25s var(--ease);position:relative}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.nav:hover{color:var(--paper);background:var(--glass)}
.nav.on{color:var(--paper);background:var(--glass2);border-color:var(--line)}
.nav.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:3px;background:linear-gradient(var(--gold-soft),var(--gold))}
.nav .badge{margin-left:auto;background:var(--pigment);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav .badge.gold{background:var(--gold)}
.sidefoot{margin-top:auto;padding-top:14px}
/* main */
.main{flex:1;min-width:0;padding:0 0 60px;position:relative}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:14px 28px;
 background:rgba(10,26,40,.62);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line2)}
.cmd{flex:1;display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:30px;
 padding:10px 16px;color:var(--muted);font-size:13.5px;cursor:pointer;transition:.3s var(--ease);max-width:440px}
.cmd:hover{border-color:var(--gold-soft);box-shadow:0 0 0 4px rgba(217,184,115,.12)}
.cmd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.cmd .k{margin-left:auto;font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted2)}
.tb-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.iconbtn{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--glass);
 border:1px solid var(--line);cursor:pointer;color:var(--paper);transition:.3s var(--spring);position:relative}
.iconbtn:hover{transform:translateY(-2px);border-color:var(--gold-soft)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .nd{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--pigment);box-shadow:0 0 0 2px var(--ink2)}
.content{padding:20px 28px;max-width:1280px}
.mobonly{display:none}
/* type */
.h1{font-family:'Fraunces';font-weight:500;font-size:clamp(23px,2.7vw,31px);line-height:1.06;margin:0;
 font-variation-settings:'opsz' 90,'wght' 460}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.kick .ic{width:15px;height:15px}
.kick{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:560px}
.h-serif{font-family:'Fraunces';font-weight:500;line-height:1.12}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
/* glass surfaces */
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
 border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 24px 50px -30px rgba(0,0,0,.7);border-radius:var(--r)}
.card{padding:20px;position:relative;overflow:hidden;transition:transform .5s var(--spring),border-color .3s}
.card.tap{cursor:pointer}.card.tap:hover{transform:translateY(-4px)}.card.tap:active{transform:scale(.99)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--glass2);color:var(--paper);
 border:1px solid var(--line);border-radius:30px;padding:11px 18px;font:700 13.5px 'Hanken Grotesk';cursor:pointer;
 transition:transform .35s var(--spring),filter .3s,border-color .3s;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.btn:hover{transform:scale(1.03);border-color:var(--gold-soft)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#2a1d06;border:none;box-shadow:0 10px 24px -10px rgba(184,137,59,.7)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.solid{background:var(--paper);color:var(--ink);border:none}
.btn.sm{padding:8px 13px;font-size:12.5px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb0c4;border-color:rgba(181,50,95,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* grid */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
/* metric card */
.metric .mlabel{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.metric .mlabel svg{width:15px;height:15px;stroke:var(--gold-soft);fill:none;stroke-width:1.8}
.metric .mval{font-family:'Fraunces';font-weight:500;font-size:38px;line-height:1;margin:12px 0 6px;font-variation-settings:'opsz'70,'wght'460}
.metric .mdelta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.metric .mdelta.up{color:var(--green)}.metric .mdelta.dn{color:var(--pigment)}
.spark{position:absolute;bottom:0;left:0;right:0;height:42px;opacity:.85}
/* sect head */
.sect{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;gap:14px;flex-wrap:wrap}
.sect h2{font-family:'Fraunces';font-weight:500;font-size:24px;margin:0}
.sect .link{color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.sect .link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
/* channel pill / badge */
.chan{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px}
.chan.fb{background:var(--fb)}.chan.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}.chan.tk{background:#111}
.chan.x{background:#1d1d1f}.chan.yt{background:var(--yt)}.chan.li{background:var(--li)}.chan.nl{background:var(--gold)}
.chan svg{width:15px;height:15px;fill:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
 background:var(--glass);border:1px solid var(--line)}
.pill.scheduled{color:var(--sea);border-color:rgba(31,158,201,.3);background:rgba(31,158,201,.08)}
.pill.published{color:var(--green);border-color:rgba(46,139,87,.35);background:rgba(46,139,87,.1)}
.pill.draft{color:var(--muted);background:color-mix(in srgb, var(--tx) 4%, transparent)}
.pill.failed{color:#ff8aa8;border-color:rgba(181,50,95,.4);background:rgba(181,50,95,.12)}
.pill.pending{color:var(--gold-soft);border-color:rgba(217,184,115,.35);background:rgba(217,184,115,.1)}
.dot{width:6px;height:6px;border-radius:50%}
.dot.scheduled{background:var(--sea)}.dot.published{background:var(--green)}.dot.draft{background:var(--muted)}.dot.failed{background:var(--pigment)}
/* timeline */
.tl{display:flex;flex-direction:column;gap:2px}
.tli{display:flex;gap:14px;padding:13px 6px;border-radius:14px;cursor:pointer;transition:.25s;align-items:flex-start}
.tli:hover{background:var(--glass)}
.tli .time{font-family:'Fraunces';font-size:15px;font-weight:600;width:62px;flex:none;color:var(--gold-soft);font-variation-settings:'opsz'30}
.tli .time small{display:block;font-size:10px;color:var(--muted);font-family:'Hanken Grotesk';font-weight:600}
.tli .body{flex:1;min-width:0}
.tli .txt{font-size:14px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tli .meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chanrow{display:flex;gap:5px}
.tli .thumb{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:'Fraunces';font-size:18px;color:#fff;overflow:hidden}
/* attention */
.alert{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;margin-bottom:11px;border:1px solid var(--line)}
.alert .ai{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center}
.alert .ai svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.alert.warn{background:rgba(181,50,95,.1);border-color:rgba(181,50,95,.3)}.alert.warn .ai{background:var(--pigment)}
.alert.info{background:rgba(217,184,115,.08);border-color:rgba(217,184,115,.28)}.alert.info .ai{background:var(--gold)}
.alert .at{font-weight:700;font-size:13.5px}.alert .as{font-size:12.5px;color:var(--muted)}
.alert .btn{margin-left:auto}
/* nameday card */
.nameday{background:linear-gradient(150deg,rgba(184,137,59,.16),rgba(10,77,140,.1)),var(--glass)}
.nd-name{font-family:'Fraunces';font-size:30px;font-weight:600;line-height:1.05}
.nd-meta{color:var(--muted);font-size:13px;margin-top:4px}
.idea{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;background:var(--glass);border:1px solid var(--line);margin-top:9px;cursor:pointer;transition:.3s var(--spring)}
.idea:hover{transform:translateX(3px);border-color:var(--gold-soft)}
.idea .in{font-weight:700;font-size:13px}.idea .is{font-size:11.5px;color:var(--muted)}
.idea svg{margin-left:auto;width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;flex:none}
</style>
<style>
/* ===== CALENDAR ===== */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.calhead .mo{font-family:'Fraunces';font-size:26px;font-weight:500}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:3px}
.seg button{border:none;background:none;color:var(--muted);font:700 12.5px 'Hanken Grotesk';padding:7px 15px;border-radius:24px;cursor:pointer;transition:.3s}
.seg button.on{background:var(--paper);color:var(--ink)}
.navarrow{display:flex;gap:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.caldow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);text-align:center;padding:4px 0}
.calday{min-height:108px;border-radius:14px;border:1px solid var(--line2);background:var(--glass);padding:8px;cursor:pointer;
 transition:.25s var(--ease);position:relative;display:flex;flex-direction:column;gap:4px}
.calday:hover{border-color:var(--gold-soft);background:var(--glass2)}
.calday.out{opacity:.32}
.calday.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.calday.drop{border-color:var(--sea);background:rgba(31,158,201,.12);border-style:dashed}
.calday .dnum{font-family:'Fraunces';font-size:14px;font-weight:600;color:var(--paper)}
.calday.today .dnum{color:var(--gold-soft)}
.calday .feast{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.cchip{font-size:10.5px;font-weight:600;padding:4px 7px;border-radius:7px;display:flex;align-items:center;gap:5px;
 background:color-mix(in srgb, var(--tx) 6%, transparent);cursor:grab;border-left:2px solid var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip:active{cursor:grabbing}
.cchip.scheduled{border-left-color:var(--sea)}.cchip.published{border-left-color:var(--green);opacity:.8}
.cchip.draft{border-left-color:var(--muted)}.cchip.failed{border-left-color:var(--pigment);color:#ffb0c4}
.cchip .cd{width:5px;height:5px;border-radius:50%;flex:none}
.cchip.dragging{opacity:.4}
.calday .addq{margin-top:auto;font-size:10px;color:var(--muted2);opacity:0;transition:.2s;font-weight:700}
.calday:hover .addq{opacity:1}
.weekgrid{display:grid;grid-template-columns:54px repeat(7,1fr);gap:6px}
.wkhour{font-size:10px;color:var(--muted2);text-align:right;padding-right:8px;font-weight:600;padding-top:4px}
.wkcell{min-height:50px;border-radius:9px;border:1px solid var(--line2);background:var(--glass);padding:3px;transition:.2s}
.wkcell:hover{border-color:var(--gold-soft)}
/* ===== COMPOSER ===== */
.compwrap{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.chanpills{display:flex;flex-wrap:wrap;gap:9px}
.cpill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:30px;border:1px solid var(--line);
 background:var(--glass);cursor:pointer;font-weight:700;font-size:12.5px;transition:.3s var(--spring);color:var(--muted)}
.cpill:hover{transform:translateY(-2px)}
.cpill.on{color:var(--paper);background:var(--glass2);border-color:var(--gold-soft)}
.cpill .chan{width:20px;height:20px;border-radius:6px}.cpill .chan svg{width:12px;height:12px}
.cpill.on .ck{margin-left:2px}
.ck{width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2.5;display:none}
.cpill.on .ck{display:block}
.composer textarea{width:100%;min-height:180px;background:var(--glass);border:1px solid var(--line);border-radius:16px;
 color:var(--paper);font:500 16px 'Hanken Grotesk';padding:16px;resize:vertical;outline:none;line-height:1.55;transition:.3s}
.composer textarea:focus{border-color:var(--gold-soft);box-shadow:0 0 0 4px rgba(217,184,115,.12)}
.composer textarea::placeholder{color:var(--muted2)}
.cbar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.tool{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.3s var(--spring);color:var(--paper)}
.tool:hover{transform:translateY(-2px);border-color:var(--gold-soft)}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cnt{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--glass);border:1px solid var(--line)}
.cnt.over{color:#ff8aa8;border-color:rgba(181,50,95,.4);background:rgba(181,50,95,.12)}
.cnt.warn{color:var(--gold-soft)}
.cnt .ring{width:14px;height:14px}
.media-strip{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.mthumb{width:78px;height:78px;border-radius:13px;position:relative;overflow:hidden;display:grid;place-items:center;font-family:'Fraunces';font-size:24px;color:#fff;border:1px solid var(--line)}
.mthumb .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:13px;display:grid;place-items:center}
.aiassist{padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(184,137,59,.12),rgba(10,77,140,.08));border:1px solid rgba(217,184,115,.3);margin-top:16px}
.aiassist .ah{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.aiassist .ah svg{width:16px;height:16px;stroke:var(--gold-soft);fill:none;stroke-width:1.8}
.sched-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field input,.field select{background:var(--glass);border:1px solid var(--line);border-radius:12px;color:var(--paper);
 font:600 13.5px 'Hanken Grotesk';padding:10px 13px;outline:none;transition:.3s;color-scheme:dark}
.field input:focus,.field select:focus{border-color:var(--gold-soft)}
/* preview */
.preview-stage{position:sticky;top:90px}
.pvtabs{display:flex;gap:6px;margin-bottom:12px}
.pvtab{border:1px solid var(--line);background:var(--glass);color:var(--muted);border-radius:20px;padding:6px 12px;font:700 11.5px 'Hanken Grotesk';cursor:pointer;transition:.3s;display:flex;align-items:center;gap:6px}
.pvtab .chan{width:16px;height:16px;border-radius:5px}.pvtab .chan svg{width:10px;height:10px}
.pvtab.on{color:var(--paper);border-color:var(--gold-soft);background:var(--glass2)}
.pvcard{border-radius:16px;overflow:hidden;background:#fff;color:#0a0a0a;font-size:13px}
.pvcard .pvhead{display:flex;align-items:center;gap:9px;padding:11px 13px}
.pvcard .pvav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--aegean),var(--sea))}
.pvcard .pvname{font-weight:700;font-size:13px}.pvcard .pvsub{font-size:11px;color:#777}
.pvcard .pvtext{padding:0 13px 11px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.pvcard .pvmedia{aspect-ratio:1;display:grid;place-items:center;font-family:'Fraunces';font-size:40px;color:#fff;background:linear-gradient(135deg,#0A4D8C,#1F9EC9)}
.pvcard .pvmedia.wide{aspect-ratio:16/9}
.pvcard .pvactions{display:flex;gap:18px;padding:10px 13px;color:#555;font-size:12px;font-weight:600;border-top:1px solid #eee}
.pvcard .pvactions svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;vertical-align:-3px;margin-right:4px}
/* IG specific */
.pvcard.ig .pvtext{font-size:13px}.pvcard.ig .pvtext b{font-weight:700}
/* X specific */
.pvcard.x{background:#fff;border:1px solid #eee}
.pvcard.x .pvhead{padding-bottom:4px}
.pvcard.x .pvname{display:inline}.pvcard.x .pvhandle{color:#777;font-weight:500;font-size:12px}
/* LinkedIn */
.pvcard.li .pvsub{font-size:10px}
.pv-hash{color:#1877F2}
/* ===== GREEK ENGINE ===== */
.engfilters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.engfilters::-webkit-scrollbar{display:none}
.engidea{padding:18px;transition:transform .5s var(--spring)}
.engidea:hover{transform:translateY(-4px)}
.engtag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:8px;display:inline-block}
.engtag.feast{background:rgba(184,137,59,.16);color:var(--gold-soft)}
.engtag.nameday{background:rgba(10,77,140,.18);color:#7db4e8}
.engtag.history{background:rgba(181,50,95,.16);color:#ff9ab5}
.engtag.culture{background:rgba(46,139,87,.16);color:#7fd1a3}
.engtag.trend{background:rgba(31,158,201,.16);color:#7fd6ef}
.engidea h3{font-family:'Fraunces';font-weight:600;font-size:20px;margin:12px 0 6px;line-height:1.15}
.engidea .draft{font-size:13px;color:var(--muted);line-height:1.55;max-height:88px;overflow:hidden;position:relative}
.engidea .fact{font-size:11.5px;color:var(--gold-soft);margin-top:10px;display:flex;gap:6px;align-items:flex-start}
.engidea .fact svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex:none;margin-top:2px}
.engfoot{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ===== INBOX ===== */
.inboxwrap{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:start}
.msglist{display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:12px;padding:13px;border-radius:14px;border:1px solid var(--line2);background:var(--glass);cursor:pointer;transition:.25s;position:relative}
.msg:hover{background:var(--glass2)}
.msg.on{border-color:var(--gold-soft);background:var(--glass2)}
.msg.unread::after{content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--sea)}
.msg .mav{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;position:relative}
.msg .mch{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:6px;border:2px solid var(--ink2);display:grid;place-items:center}
.msg .mch svg{width:9px;height:9px;fill:#fff}
.msg .mname{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.msg .mtype{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}
.msg .mprev{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.msg .mtime{font-size:11px;color:var(--muted2);margin-left:auto;flex:none}
.thread{padding:0;display:flex;flex-direction:column;min-height:60vh}
.thread .thead{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px}
.thread .tbody{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:48vh}
.bubble{max-width:80%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.45}
.bubble.them{background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bubble.me{background:linear-gradient(135deg,var(--aegean),var(--sea));color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bubble .bt{font-size:10px;opacity:.6;margin-top:5px}
.replybar{padding:14px 18px;border-top:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.replybar input{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:24px;color:var(--paper);padding:11px 16px;font:500 13.5px 'Hanken Grotesk';outline:none}
.replybar input:focus{border-color:var(--gold-soft)}
/* ===== LIBRARY ===== */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.asset{padding:0;overflow:hidden;cursor:pointer;transition:transform .5s var(--spring)}
.asset:hover{transform:translateY(-4px)}
.asset .ac{height:130px;display:grid;place-items:center;font-family:'Fraunces';font-size:34px;color:#fff;position:relative}
.asset .ac .hov{position:absolute;inset:0;background:rgba(11,31,46,.7);opacity:0;display:flex;align-items:center;justify-content:center;gap:8px;transition:.3s;backdrop-filter:blur(3px)}
.asset:hover .ac .hov{opacity:1}
.asset .ab{padding:11px 13px}.asset .an{font-weight:700;font-size:13px}.asset .as{font-size:11px;color:var(--muted)}
.tmpl{padding:15px;cursor:pointer;transition:.3s var(--spring)}.tmpl:hover{transform:translateY(-3px);border-color:var(--gold-soft)}
.tmpl .tn{font-family:'Fraunces';font-weight:600;font-size:16px}.tmpl .tt{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5;max-height:60px;overflow:hidden}
.hashgroup{padding:14px}.hashgroup .hg{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.htag{font-size:11.5px;font-weight:600;color:var(--sea);background:rgba(31,158,201,.1);padding:4px 9px;border-radius:8px}
/* ===== APPROVALS / TEAM ===== */
.appr{padding:18px;margin-bottom:14px}
.appr .ahead{display:flex;align-items:center;gap:12px}
.appr .meta{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.appr .pvquote{padding:13px 15px;border-radius:13px;background:var(--glass);border-left:3px solid var(--gold);margin-top:13px;font-size:13.5px;line-height:1.5}
.appr .actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.member{display:flex;align-items:center;gap:13px;padding:14px;border-radius:15px;border:1px solid var(--line2);background:var(--glass);margin-bottom:10px}
.member .mav{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.role{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:.05em}
.role.admin{background:rgba(184,137,59,.16);color:var(--gold-soft)}
.role.editor{background:rgba(10,77,140,.18);color:#7db4e8}
.role.contributor{background:rgba(46,139,87,.16);color:#7fd1a3}
/* ===== PLANS ===== */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.plan{padding:26px;display:flex;flex-direction:column;position:relative;transition:transform .5s var(--spring)}
.plan:hover{transform:translateY(-5px)}
.plan.featured{border-color:var(--gold-soft);box-shadow:0 0 0 1px var(--gold-soft),0 28px 60px -34px rgba(184,137,59,.5)}
.plan .ptag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#2a1d06;font-size:10.5px;font-weight:800;padding:5px 14px;border-radius:20px;letter-spacing:.04em}
.plan .pname{font-family:'Fraunces';font-weight:600;font-size:24px}
.plan .pdesc{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:34px}
.plan .pprice{font-family:'Fraunces';font-size:46px;font-weight:500;margin:16px 0 2px;font-variation-settings:'opsz'80}
.plan .pprice small{font-size:14px;color:var(--muted);font-family:'Hanken Grotesk';font-weight:600}
.plan ul{list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:11px;flex:1}
.plan li{display:flex;gap:10px;font-size:13px;align-items:flex-start}
.plan li svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:2.4;flex:none;margin-top:2px}
.plan li.off{color:var(--muted2)}.plan li.off svg{stroke:var(--muted2)}
.curtag{font-size:10.5px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px}
/* ===== SETTINGS ===== */
.connrow{display:flex;align-items:center;gap:14px;padding:16px;border-radius:15px;border:1px solid var(--line2);background:var(--glass);margin-bottom:11px;transition:.3s}
.connrow:hover{background:var(--glass2)}
.connrow .ci{width:44px;height:44px;border-radius:13px;flex:none}.connrow .ci svg{width:20px;height:20px}
.connrow .cn{font-weight:700;font-size:14.5px}.connrow .cs{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.connrow .cs .live{color:var(--green);font-weight:700}.connrow .cs .off{color:var(--muted2);font-weight:700}
.toggle{width:46px;height:26px;border-radius:20px;background:color-mix(in srgb, var(--tx) 12%, transparent);position:relative;cursor:pointer;transition:.3s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s var(--spring)}
.toggle.on{background:var(--green)}.toggle.on::after{left:23px}
/* ===== shared: empty / skeleton / toast / modal / heatmap ===== */
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty .ei{width:74px;height:74px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}
.empty .ei svg{width:32px;height:32px;stroke:var(--gold-soft);fill:none;stroke-width:1.5}
.empty h3{font-family:'Fraunces';color:var(--paper);font-size:22px;margin:0 0 8px;font-weight:600}
.empty p{max-width:340px;margin:0 auto 18px;font-size:13.5px}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.4s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.skel-card{padding:20px;border-radius:var(--r);border:1px solid var(--line2);background:var(--glass)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(24px);z-index:120;opacity:0;
 background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:13px 20px;border-radius:30px;font-size:13px;font-weight:700;
 transition:.45s var(--spring);pointer-events:none;display:flex;align-items:center;gap:10px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--green)}
.toast .ti svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3}
.scrim{position:fixed;inset:0;z-index:100;background:rgba(6,16,26,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{max-width:480px;width:100%;max-height:88vh;overflow-y:auto;animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.94) translateY(20px);opacity:0}}
.modal .mhead{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line2)}
.modal .mhead h3{font-family:'Fraunces';font-size:21px;font-weight:600;margin:0;flex:1}
.close{width:32px;height:32px;border-radius:10px;background:var(--glass);border:1px solid var(--line);color:var(--paper);cursor:pointer;display:grid;place-items:center;font-size:16px}
.modal .mb{padding:22px}
.heatmap{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px}
.hm-lbl{font-size:10px;color:var(--muted2);font-weight:600;display:grid;place-items:center}
.hm-cell{aspect-ratio:1;border-radius:7px;background:color-mix(in srgb, var(--tx) 4%, transparent);display:grid;place-items:center;font-size:9px;color:transparent;transition:.2s;cursor:pointer}
.hm-cell:hover{transform:scale(1.15);color:var(--paper)}
.cmdbar{max-width:560px;width:100%;align-self:flex-start;margin-top:10vh;padding:0;overflow:hidden}
.cmdbar .ci{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line2)}
.cmdbar .ci svg{width:20px;height:20px;stroke:var(--gold-soft);fill:none;stroke-width:1.8}
.cmdbar input{flex:1;background:none;border:none;color:var(--paper);font:500 17px 'Hanken Grotesk';outline:none}
.cmdres{padding:8px;max-height:50vh;overflow-y:auto}
.cmdr{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:.2s;font-size:14px;font-weight:600}
.cmdr:hover,.cmdr.on{background:var(--glass2)}
.cmdr svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8}
.cmdr .kbd{margin-left:auto;font-size:10px;color:var(--muted2);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.offline{display:none;position:sticky;top:0;z-index:45;background:var(--pigment);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;text-align:center}
.offline.on{display:block;animation:slidedown .4s var(--spring)}
@keyframes slidedown{from{transform:translateY(-100%)}}
.reveal{opacity:0;transform:translateY(16px);animation:rise .65s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.dr{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px}
.dr:last-child{border:none}.dr .dl{color:var(--muted)}

/* ===== STUDIO: BRAND / TEMPLATES / MAKER + OAUTH ===== */
.swatch-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.swatch{width:64px;text-align:center;cursor:pointer}
.swatch .chip{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.1) inset;transition:.3s var(--spring)}
.swatch:hover .chip{transform:translateY(-3px)}
.swatch .hx{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:.03em}
.fontpair{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.fontpair .fp-h{font-family:'Fraunces';font-size:26px;font-weight:600}
.fontpair .fp-b{font-size:13px;color:var(--muted)}
.brandlogo{width:84px;height:84px;border-radius:20px;flex:none;display:grid;place-items:center;color:#fffdf8;
 background:radial-gradient(circle at 32% 28%,var(--gold-soft),var(--gold));font-family:'Fraunces';font-weight:600;font-size:44px;
 box-shadow:0 14px 30px -10px rgba(184,137,59,.8)}
.learnbox{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.learnbox .field{flex:1;min-width:200px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tplcard{padding:0;overflow:hidden;cursor:pointer;transition:transform .5s var(--spring)}
.tplcard:hover{transform:translateY(-4px);border-color:var(--gold-soft)}
.tplprev{aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;position:relative;overflow:hidden}
.tplprev .tk{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:absolute;top:14px;left:16px}
.tplprev .th{font-family:'Fraunces';font-weight:600;font-size:21px;line-height:1.1;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.tplprev .ts{font-size:12px;color:rgba(255,255,255,.9);margin-top:5px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.tplprev .ovl{position:absolute;inset:0;background:rgba(11,31,46,.55);opacity:0;display:grid;place-items:center;transition:.3s;backdrop-filter:blur(2px)}
.tplcard:hover .tplprev .ovl{opacity:1}
.tplmeta{padding:11px 14px;display:flex;align-items:center;gap:8px}
.tplmeta .tn{font-weight:700;font-size:13px}.tplmeta .badge2{margin-left:auto;font-size:10px;font-weight:800;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.06em}
.makerwrap{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.makercanvas{aspect-ratio:4/5;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;position:relative;
 box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.makercanvas .mk-tk{position:absolute;top:26px;left:30px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.92)}
.makercanvas .mk-logo{position:absolute;top:24px;right:28px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
 background:color-mix(in srgb, var(--tx) 16%, transparent);backdrop-filter:blur(6px);font-family:'Fraunces';font-weight:600;font-size:22px;color:#fff}
.makercanvas .mk-h{font-family:'Fraunces';font-weight:600;font-size:34px;line-height:1.08;color:#fff;text-shadow:0 3px 20px rgba(0,0,0,.45);white-space:pre-wrap}
.makercanvas .mk-s{font-size:15px;color:rgba(255,255,255,.94);margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,.4);white-space:pre-wrap}
.bgpick{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.bgswatch{width:46px;height:46px;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:.25s var(--spring)}
.bgswatch:hover{transform:translateY(-2px)}.bgswatch.on{border-color:var(--gold-soft);box-shadow:0 0 0 3px rgba(217,184,115,.2)}
/* OAuth consent */
.oauth .ohead{display:flex;align-items:center;gap:12px;padding:22px 22px 4px}
.oauth .oapp{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff}
.oauth .oapp svg{width:24px;height:24px;fill:#fff}
.oauth .oconn{font-size:20px;color:var(--muted2);font-weight:300}
.oauth .oseal{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fffdf8;
 background:radial-gradient(circle at 32% 28%,var(--gold-soft),var(--gold));font-family:'Fraunces';font-weight:600;font-size:24px}
.oauth .obody{padding:14px 22px 0}
.oauth .otitle{font-family:'Fraunces';font-size:19px;font-weight:600;line-height:1.2}
.oauth .operm{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.oauth .operm:last-of-type{border-bottom:none}
.oauth .operm svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2;flex:none;margin-top:1px}
.oauth .operm .ps{color:var(--muted);font-size:12px}
.oauth .ofoot{padding:8px 22px 22px;display:flex;gap:10px}

function animateCounters(){

  const tgt=parseFloat(el.dataset.count),suf=el.dataset.suf||'',dec=el.dataset.dec?1:0;let cur=0,step=tgt/38;
  const t=setInterval(()=>{cur+=step;if(cur>=tgt){cur=tgt;clearInterval(t);}

 });

function sparkline(data,color,id){
 const w=200,h=42,max=Math.max(...data),min=Math.min(...data),rng=(max-min)||1;
 const pts=data.map((d,i)=>`${(i/(data.length-1))*w},${h-((d-min)/rng)*(h-6)-3}`).join(' ');
 const area=`0,${h} `+pts+` ${w},${h}`;
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  <polygon points="${area}" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function monthGrid(){

 // June 2026: June 1 is a Monday -> offset 1

 let cells='';
 for(let i=0;i<first;i++)cells+=`<div class="calday out"><span class="dnum">${31-first+i+1}</span></div>`;
 for(let d=1;d<=days;d++){
  const dayPosts=POSTS.filter(p=>p.day===d).sort((a,b)=>tmin(a)-tmin(b));
  const feast=FEASTS[d];
  cells+=`<div class="calday${d===today?' today':''}" data-day="${d}" ondragover="dragOver(event,${d})" ondragleave="dragLeave(event)" ondrop="drop(event,${d})" onclick="dayClick(${d})">

 }
 // trailing

}
function weekGrid(){

 hours.forEach(h=>{rows+=`<div class="wkhour">${h}</div>`;
  for(let dd=15;dd<=21;dd++){const ph=parseInt(h);const isPM=h.includes('PM');let hh=ph;if(isPM&&ph!==12)hh+=12;
   const cellPosts=POSTS.filter(p=>{if(p.day!==dd)return false;let h2=parseInt(p.time);if(p.ampm==='PM'&&h2!==12)h2+=12;if(p.ampm==='AM'&&h2===12)h2=0;return h2>=hh&&h2<hh+2;});
   rows+=`<div class="wkcell" onclick="dayClick(${dd})">${cellPosts.map(p=>`<div class="cchip ${p.st}" onclick="event.stopPropagation();openPost(${p.id})"><span class="cd" style="background:${chColor(p.ch[0])}"></span><span class="t">${p.txt.slice(0,10)}</span></div>`).join('')}</div>`;}});
 return rows+`</div>`;

 if(comp.format==='Reels'||comp.format==='Carousels')sc+=9;
 const len=txt.length; if(len>=80&&len<=600)sc+=8; if(len<30)sc-=8;
 if(/[#＃]/.test(txt)||comp.firstComment)sc+=6;
 if(/[☀-➿]/.test(txt))sc+=5;
 if(comp.altText)sc+=3;
 if(comp.ch.length>=2)sc+=4;
 if(/[Ͱ-Ͽ]/.test(txt))sc+=5;

function openCmd(){$('#cmdscrim').classList.add('on');$('#cmdinput').value='';cmdFilter('');setTimeout(()=>$('#cmdinput').focus(),50);}
function closeCmd(){$('#cmdscrim').classList.remove('on');}
$('#cmdscrim').onclick=e=>{if(e.target.id==='cmdscrim')closeCmd();};
function cmdFilter(q){q=q.toLowerCase();cmdList=CMDS.filter(c=>c.l.toLowerCase().includes(q));cmdSel=0;
 $('#cmdres').innerHTML=cmdList.length?cmdList.map((c,i)=>`<div class="cmdr ${i===cmdSel?'on':''}" onclick="runCmd(${i})">${ic(c.i)} ${c.l}${i===0?'<span class="kbd">↵</span>':''}</div>`).join('')
  :`<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No matches. Try "calendar", "Greek", "analytics"…</div>`;}
function runCmd(i){const c=cmdList[i];if(!c)return;closeCmd();

 else if(c.action==='nameday'){useIdea(b64(IDEAS[0].draft),IDEAS[0].ch.join(','));}
 else if(c.action==='switchws'){openWorkspaceSwitcher();}
 else go(c.v);}
$('#cmdinput').addEventListener('input',e=>cmdFilter(e.target.value));
$('#cmdinput').addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,cmdList.length-1);renderCmdSel();}
 else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);renderCmdSel();}
 else if(e.key==='Enter'){runCmd(cmdSel);}else if(e.key==='Escape')closeCmd();});

function updateBadges(){
