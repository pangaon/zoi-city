name: Production Database Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect/recover read diagnostics; restart sends one authorized project restart'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - restart
          - recover

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  database-recovery:
    if: github.repository == 'pangaon/zoi-city'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect or recover database
        run: node scripts/database-recovery.mjs "$RECOVERY_ACTION"
        env:
          RECOVERY_ACTION: ${{ inputs.action }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
