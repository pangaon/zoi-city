name: Enrichment fixed index request
on:
  push:
    branches: [main]
    paths: ['ops/enrichment-index-once-request.json']
permissions:
  contents: read
concurrency:
  group: enrichment-fixed-index-once
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pangaon/zoi-city' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false && github.event.repository.visibility == 'public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run reviewed fixed index request once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/geography/run-index-once.mjs
