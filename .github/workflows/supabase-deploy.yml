name: Supabase DB Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'pangaon/zoi-city'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy audited SQL to production
        run: |
          cd /home/runner/work/zoi-city/zoi-city
          supabase link --project-ref csebihpaychdkanjjsmz || true
          # The production migration ledger contains historical versions that
          # are not present in this checkout. Apply only the audited additive
          # contracts instead of attempting to replay unknown migrations.
          supabase db query --linked --file supabase/migrations/0039_canonical_geography_contract.sql
          supabase db query --linked --file supabase/migrations/0040_enrichment_control_plane.sql
          supabase db query --linked --file supabase/migrations/0041_enrichment_schedule.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy enrichment worker to production
        run: |
          cd /home/runner/work/zoi-city/zoi-city
          supabase functions deploy zoi-enrich --use-api --project-ref csebihpaychdkanjjsmz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Kick one protected enrichment batch
        run: |
          cd /home/runner/work/zoi-city/zoi-city
          supabase db query --linked "select net.http_post(
            url := 'https://csebihpaychdkanjjsmz.supabase.co/functions/v1/zoi-enrich',
            headers := jsonb_build_object(
              'Content-Type', 'application/json',
              'Authorization', 'Bearer ' || (select decrypted_secret from vault.decrypted_secrets where name = 'service_role_key')
            ),
            body := '{\"limit\":200}'::jsonb,
            timeout_milliseconds := 120000
          );"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify public contract and security checks
        run: node tests/contract/run.mjs

      - name: Notify deployment
        if: success()
        run: echo "✅ Supabase migrations deployed successfully"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Supabase deployment failed"
          echo "Add SUPABASE_ACCESS_TOKEN secret to GitHub repo settings:"
          echo "https://github.com/pangaon/zoi-city/settings/secrets/actions"
          exit 1
