name: Supabase validation and worker release

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      function:
        description: Reviewed Edge Function to release
        required: true
        type: choice
        options: [zoi-enrich, zoi-feed-publish, social-publish, email-send, email-unsubscribe]

permissions:
  contents: read
concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false
jobs:
  verify:
    # The shared CI already validates pushes and PRs; avoid running it twice.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify:local
  deploy-worker:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy reviewed worker
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          case "$FUNCTION_NAME" in
            email-unsubscribe|zoi-enrich|social-publish|email-send)
              # Existing functions validate caller JWT/cron secret in the handler; unsubscribe validates its opaque token.
              npx --yes supabase@2.115.0 functions deploy "$FUNCTION_NAME" --no-verify-jwt --use-api --project-ref csebihpaychdkanjjsmz ;;
            zoi-feed-publish)
              npx --yes supabase@2.115.0 functions deploy "$FUNCTION_NAME" --use-api --project-ref csebihpaychdkanjjsmz ;;
            *) echo 'Unsupported function'; exit 1 ;;
          esac
# Schema changes are individually reviewed and recorded in the production
# migration ledger. Never replay the old fixed list or use blanket db push:
# this repository contains legacy versions absent from the live ledger.
