name: Supabase DB Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'pangaon/zoi-city'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy migrations to production
        run: |
          cd /home/runner/work/zoi-city/zoi-city
          supabase link --project-ref csebihpaychdkanjjsmz || true
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify deployment
        if: success()
        run: echo "✅ Supabase migrations deployed successfully"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Supabase deployment failed"
          echo "Add SUPABASE_ACCESS_TOKEN secret to GitHub repo settings:"
          echo "https://github.com/pangaon/zoi-city/settings/secrets/actions"
          exit 1
