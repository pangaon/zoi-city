name: Dedicated copy-only private business destination QA
on:
  push:
    branches: [main]
    paths: ['ops/business-destination-private-qa.json']
permissions:
  contents: read
concurrency:
  group: dedicated-business-destination-private-qa
  cancel-in-progress: false
jobs:
  private-destination:
    if: github.repository == 'pangaon/zoi-city' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.event.repository.visibility == 'public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate exact request-only admission
        id: admission
        run: node scripts/auth-qa/business-destination-private-ci.mjs check
      - name: Request, fence, recovery and cleanup guards before credentials
        run: node --test tests/unit/business-destination-private-qa.test.mjs
      - name: Install existing pinned browser
        if: steps.admission.outputs.enabled == 'true'
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Actual copy-only private owner journey
        id: browser
        if: steps.admission.outputs.enabled == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/auth-qa/business-destination-private-ci.mjs browser
      - name: Reconcile original receipts only after uncertain browser result
        if: always() && steps.admission.outputs.enabled == 'true' && steps.browser.outcome != 'skipped' && steps.browser.outcome != 'success'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/auth-qa/business-destination-private-ci.mjs cleanup
      - name: Sanitized result and fixed failure stage only
        if: always() && steps.admission.outputs.enabled == 'true' && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-private-destination-${{ github.run_id }}
          path: |
            qa-business-destination-private-evidence/result.json
            qa-business-destination-private-evidence/failure.json
          if-no-files-found: error
          retention-days: 7
