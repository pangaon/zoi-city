name: Dedicated Company private browser QA
on:
  push:
    branches: [main]
    paths: ['ops/company-private-browser-qa.json']
permissions:
  contents: read
concurrency:
  group: dedicated-company-private-browser-qa
  cancel-in-progress: false
jobs:
  company-private:
    if: github.repository == 'pangaon/zoi-city' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.event.repository.visibility == 'public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact expiring request and reviewed code
        run: node scripts/auth-qa/company-private-browser-ci.mjs check
      - name: Controlled guards and cleanup tests before credentials
        run: node --test tests/unit/company-private-browser-qa.test.mjs
      - name: Install pinned browser
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Dedicated synthetic Company private browser journey and canonical cleanup
        id: browser
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/auth-qa/company-private-browser-ci.mjs browser
      - name: Canonical cleanup also after interrupted browser stage
        if: always() && steps.browser.outcome != 'skipped'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/auth-qa/company-private-browser-ci.mjs cleanup
      - name: Boolean-only evidence
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: company-private-${{ github.run_id }}
          path: |
            qa-company-evidence/result.json
            qa-company-evidence/failure.json
          if-no-files-found: error
          retention-days: 7
