name: Dedicated QA authenticated read-only checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dedicated-qa-authenticated-readonly
  cancel-in-progress: false
jobs:
  readonly:
    if: github.repository == 'pangaon/zoi-city' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify identity and read-only guards without credentials
        run: node --test tests/unit/authenticated-qa.test.mjs
      - name: Install pinned browser
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Read dedicated QA workspace using temporary local session
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/auth-qa/ci.mjs
      - name: Publish sanitized boolean evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-readonly-evidence/result.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
