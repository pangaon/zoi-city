name: Bounded listing quality audit
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: Apply queue receipts (false is a no-network plan)
        type: boolean
        default: false
      task:
        type: choice
        options: [classification, verification]
        default: classification
      limit:
        description: Maximum leases or receipt retries (1–20; canary 3)
        type: number
        default: 3
      resume_run:
        description: Prior workflow run ID containing immutable evidence (empty for new leases)
        type: string
        default: ''
      resume_artifact:
        description: Exact artifact name for an automatic matrix run (empty preserves legacy manual name)
        type: string
        default: ''
      resume_attempt:
        description: Prior run attempt containing the artifact
        type: number
        default: 1
permissions:
  contents: read
  actions: read
concurrency:
  group: listing-quality-production
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      limit: ${{ steps.plan.outputs.limit }}
      execute: ${{ steps.plan.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        name: Validate authorization before credentials or browser installation
        env:
          QUALITY_AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' }}
          QUALITY_TASK: ${{ inputs.task }}
          QUALITY_LIMIT: ${{ inputs.limit }}
          QUALITY_EXECUTE: ${{ inputs.execute }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RESUME_ATTEMPT: ${{ inputs.resume_attempt }}
        run: |
          node --input-type=module -e "import {auditPlan} from './scripts/quality/ci.mjs'; import {appendFile} from 'node:fs/promises'; const p=await auditPlan(); for(const [k,v] of Object.entries(p))await appendFile(process.env.GITHUB_OUTPUT,k+'='+JSON.stringify(v)+'\n');"
  audit:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded collector contracts
        run: node --test tests/unit/quality-ci.test.mjs tests/unit/quality-collector.test.mjs tests/unit/member-source.test.mjs tests/unit/association-cards.test.mjs
      - name: Restore exact prior evidence
        if: github.event_name == 'workflow_dispatch' && inputs.execute && inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run }}
          name: ${{ inputs.resume_artifact || format('quality-evidence-{0}-{1}', inputs.resume_run, inputs.resume_attempt) }}
          path: quality-evidence
      - id: active
        name: Recheck automatic expiry immediately before browser installation
        env:
          QUALITY_AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' }}
          QUALITY_TASK: ${{ matrix.task }}
          QUALITY_LIMIT: ${{ needs.preflight.outputs.limit }}
          QUALITY_EXECUTE: ${{ needs.preflight.outputs.execute }}
        run: |
          node --input-type=module -e "import {auditPlan} from './scripts/quality/ci.mjs'; import {appendFile} from 'node:fs/promises';const p=await auditPlan();await appendFile(process.env.GITHUB_OUTPUT,'execute='+(p.enabled&&p.execute)+'\n');"
      - name: Install pinned browser for rendered verification
        if: steps.active.outputs.execute == 'true' && matrix.task == 'verification' && inputs.resume_run == ''
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Collect bounded evidence or resume exact receipts
        env:
          QUALITY_AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' }}
          QUALITY_EXECUTE: ${{ needs.preflight.outputs.execute }}
          QUALITY_TASK: ${{ matrix.task }}
          QUALITY_LIMIT: ${{ needs.preflight.outputs.limit }}
          QUALITY_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run != '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/quality/ci.mjs
      - name: Preserve immutable evidence and specialist repair report
        if: always() && needs.preflight.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('quality-evidence-{0}-{1}', github.run_id, github.run_attempt) || format('quality-evidence-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.task) }}
          path: quality-evidence/*.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false
