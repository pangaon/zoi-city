name: MESA isolated frontend browser QA
on:
  pull_request:
    paths: ['assets/festival/**', 'assets/inquiries/model.mjs', 'assets/bookings/model.mjs', 'tests/browser/mesa-*', '.github/workflows/mesa-map-browser.yml', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['assets/festival/**', 'tests/browser/mesa-*', '.github/workflows/mesa-map-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium pinned by playwright-core 1.63.0
        run: node node_modules/playwright-core/cli.js install --with-deps chromium --only-shell
      - name: Exercise real frontend modules against synthetic RPC fixture
        run: node tests/browser/mesa-map.browser.mjs
      - name: Upload synthetic QA receipt and desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mesa-map-synthetic-frontend-${{ github.run_id }}
          path: artifacts/mesa-map-browser/
          if-no-files-found: error
          retention-days: 14
