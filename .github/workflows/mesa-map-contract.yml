name: MESA map database contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/database/mesa-festival-maps.integration.mjs'
      - '.github/workflows/mesa-map-contract.yml'
  push:
    branches: [main, 'feat/mesa-event-map']
    paths:
      - 'supabase/migrations/**'
      - 'tests/database/mesa-festival-maps.integration.mjs'
      - '.github/workflows/mesa-map-contract.yml'
permissions:
  contents: read
concurrency:
  group: mesa-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi
      - name: Exercise migration with disposable database and actual authority functions
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: node tests/database/mesa-festival-maps.integration.mjs
