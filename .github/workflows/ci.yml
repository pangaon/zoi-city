# zoi.city CI — Wave 1 deterministic foundation.
# The site is static HTML + two Vercel serverless functions; there is NO build step
# and NO npm dependencies, so there is deliberately no `npm install` here.
# Everything below runs zero-dependency Node scripts committed in /scripts and /tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run production API and page checks explicitly'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check every inline <script> block
        run: npm run check

      - name: Lint HTML well-formedness
        run: npm run lint:html

      - name: Syntax-check serverless functions (api/)
        run: |
          for f in api/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Unit tests
        run: node scripts/run-tests.mjs tests --local

  mobile-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Check native source changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          relevant=true
          backend=false
          base="$PUSH_BASE"
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; fi
          if [ "$EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --name-only "$base" HEAD > /tmp/native-changed-paths; then
              relevant=false
              if [ "$EVENT_NAME" = push ] && grep -Fxq "ops/backend-release-request.json" /tmp/native-changed-paths; then backend=true; fi
              if grep -Eq '^(mobile/|assets/homes/phone\.mjs$|assets/enrichment/(publisher-social|branch-contact-scope)\.mjs$|supabase/functions/zoi-enrich/_social\.js$|assets/tickets/venue-model\.mjs$|assets/bookings/(model|planner|reschedule-model)\.mjs$|assets/priorities/(engine|sources)\.mjs$|assets/commerce/model\.mjs$|assets/operations/recovery\.mjs$|assets/organizations/(calendar-model|group-model)\.mjs$|assets/timekeeping/model\.mjs$|assets/documents/file-rules\.mjs$|\.github/workflows/ci\.yml$)' /tmp/native-changed-paths; then relevant=true; fi
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  mobile:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked mobile dependencies
        run: npm ci
      - name: Verify native session lifecycle
        run: npm test
      - name: Type-check native application
        run: npx tsc --noEmit
      - name: Verify Expo web bundle
        run: npx expo export --platform web --output-dir /tmp/zoi-mobile-web

  live-contracts:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live API and page contracts
        run: node scripts/run-tests.mjs tests --live

  backend-release:
    needs: [verify, mobile-changes, mobile]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.mobile-changes.outputs.backend == 'true' && (needs.mobile.result == 'success' || needs.mobile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: supabase-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy only the expiring reviewed backend release
        run: node scripts/release-backend.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
