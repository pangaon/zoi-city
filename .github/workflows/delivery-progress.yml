name: Live delivery progress
on:
  push:
    branches: [main]
    paths: ['docs/recovery-delivery-board.json', 'scripts/delivery/sync.mjs', '.github/workflows/delivery-progress.yml']
  workflow_run:
    workflows: ['CI', 'Default discovery database contract']
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: live-delivery-progress
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'pangaon/zoi-city' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/delivery/sync.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
