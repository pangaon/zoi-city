name: Rendered official source repair
on:
  push:
    branches: [main]
    paths:
      - 'ops/source-render-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rendered-official-source-repair
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify source and transport guards
        run: node --test tests/unit/rendered-source.test.mjs tests/unit/quality-collector.test.mjs tests/unit/enrichment-document-quality.test.mjs tests/unit/site-image-extraction.test.mjs
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Capture and repair existing leased sources
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/enrichment/render-queue.mjs
      - name: Retain per-listing source, pending write and confirmed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: rendered-source-evidence/*.json
          retention-days: 90
          if-no-files-found: warn
          overwrite: false
