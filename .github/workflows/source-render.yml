name: Sandboxed source runtime probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-render.yml'
      - 'scripts/enrichment/preflight.mjs'
      - 'scripts/enrichment/render-source.mjs'
      - 'scripts/enrichment/source-errors.mjs'
      - 'ops/source-render-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rendered-official-source-repair
  cancel-in-progress: false
jobs:
  runtime-probe:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify source transport and probe guards
        run: node --test tests/unit/rendered-source.test.mjs tests/unit/source-runtime-probe.test.mjs tests/unit/quality-collector.test.mjs
      - name: Install identical pinned Chromium runtime
        run: npx --no-install playwright-core install --with-deps chromium
      # Deliberately no Supabase credentials and no queue/capture command here.
      # Diagnose the runtime before another listing can be leased or mutated.
      - name: Probe sandbox without visiting a source or leasing a listing
        env:
          SOURCE_PROBE_RUNNER: ${{ matrix.runner }}
        run: node scripts/enrichment/preflight.mjs
      - name: Retain safe runtime evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-runtime-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-runtime-probe/probe.json
          retention-days: 90
          if-no-files-found: warn
          overwrite: false
